<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel 문서검색</title>
<style>
:root{--navy:#173e63;--bg:#f3f6f9;--line:#dce3ea;--muted:#64717d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans KR",sans-serif;color:#17202a}
header{background:var(--navy);color:#fff;padding:17px}header h1{font-size:21px;margin:0 0 4px}header p{font-size:13px;margin:0;opacity:.88}
main{max-width:1500px;margin:auto;padding:12px}.box,.filebox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:11px}
.setup{background:#fff8e7}.controls{display:grid;grid-template-columns:1fr 2fr 120px;gap:8px}
input,select,button{width:100%;padding:11px;border:1px solid #cbd5df;border-radius:8px;background:#fff;font-size:14px}
button{border:0;background:var(--navy);color:#fff}.secondary{background:#5c6874}.small{font-size:12px;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.badge{padding:7px 10px;border-radius:18px;background:#eaf0f6;font-size:13px}
.filetitle{font-size:18px;font-weight:bold;color:var(--navy);margin-bottom:4px}.sheettitle{font-weight:bold;margin:12px 0 6px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:55vh}
table{border-collapse:collapse;width:100%;min-width:800px}th,td{padding:8px;border-bottom:1px solid #e6ebef;text-align:left;vertical-align:top;font-size:13px}
th{position:sticky;top:0;background:#eaf0f6;z-index:2}mark{background:#fff09a}.msg{text-align:center;padding:30px;color:var(--muted)}
@media(max-width:700px){.controls{grid-template-columns:1fr}.tablewrap{max-height:62vh}main{padding:7px}}
</style></head>
<body>
<header><h1>Excel 문서검색</h1><p>Google Sheets · Apps Script · GitHub / 스마트폰 조회</p></header>
<main>
<div id="setup" class="box setup"><b>Apps Script 연결</b>
<div class="small" style="margin:6px 0 8px">배포된 웹 앱의 /exec 주소를 한 번 입력하세요.</div>
<div style="display:grid;grid-template-columns:1fr 120px;gap:8px"><input id="url" placeholder="https://script.google.com/macros/s/.../exec"><button onclick="saveUrl()">저장</button></div></div>

<div class="box">
<div class="controls">
<select id="file"><option value="all">전체 파일</option></select>
<input id="q" placeholder="전체 내용검색: 펌프, 호실, 장비명, 점검내용..." onkeydown="if(event.key==='Enter')search()">
<button onclick="search()">검색</button>
</div>
<div style="display:flex;gap:8px;margin-top:8px">
<button class="secondary" onclick="showSelected()">선택파일 전체보기</button>
<button class="secondary" onclick="loadFiles()">파일목록 새로고침</button>
</div>
<div class="stats"><span class="badge" id="fc">파일 0개</span><span class="badge" id="mc">검색 0건</span><span class="badge" id="up">업데이트 -</span></div>
</div>
<div id="result"><div class="msg">Apps Script를 연결해주세요.</div></div>
</main>
<script>
const FIXED_API_URL=''; const $=x=>document.getElementById(x);
const api=()=>FIXED_API_URL||localStorage.getItem('excelViewerApi')||'';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveUrl(){let u=$('url').value.trim();if(!u)return;localStorage.setItem('excelViewerApi',u);loadFiles()}
async function get(p){let u=new URL(api());Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));let r=await fetch(u,{cache:'no-store'}),j=await r.json();if(!j.ok)throw Error(j.error||'API 오류');return j}
async function loadFiles(){try{$('url').value=api();let j=await get({action:'files'});$('file').innerHTML='<option value="all">전체 파일</option>'+j.files.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');$('fc').textContent='파일 '+j.files.length+'개';$('setup').style.display='none';$('result').innerHTML='<div class="msg">파일을 선택하여 전체보기하거나 검색어를 입력하세요.</div>'}catch(e){$('result').innerHTML='<div class="msg">연결 실패: '+esc(e.message)+'</div>'; $('setup').style.display='block'}}
async function search(){if(!api())return;let q=$('q').value.trim();$('result').innerHTML='<div class="msg">검색 중...</div>';try{let j=await get({action:'search',id:$('file').value,q:q});$('mc').textContent='검색 '+j.totalMatches+'건 · '+j.fileMatches+'개 파일';$('up').textContent='업데이트 '+j.updatedAt;renderResults(j.results,q)}catch(e){$('result').innerHTML='<div class="msg">검색 실패: '+esc(e.message)+'</div>'}}
async function showSelected(){let id=$('file').value;if(id==='all'){ $('q').value=''; return search(); }$('result').innerHTML='<div class="msg">파일 읽는 중...</div>';try{let j=await get({action:'read',id:id});renderResults([{name:j.file.name,tables:j.tables,matches:j.tables.reduce((n,t)=>n+t.matches,0)}],'');$('mc').textContent='전체 '+j.tables.reduce((n,t)=>n+t.matches,0)+'건';$('up').textContent='업데이트 '+j.updatedAt}catch(e){$('result').innerHTML='<div class="msg">읽기 실패: '+esc(e.message)+'</div>'}}
function hi(v,q){let s=esc(v);if(!q)return s;let z=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp(z,'gi'),m=>'<mark>'+m+'</mark>')}
function renderResults(results,q){if(!results.length){$('result').innerHTML='<div class="msg">검색 결과가 없습니다.</div>';return}
$('result').innerHTML=results.map(f=>`<section class="filebox"><div class="filetitle">${esc(f.name)}</div><div class="small">검색결과 ${f.matches}건</div>${f.tables.map(t=>table(t,q)).join('')}</section>`).join('')}
function table(t,q){let r=t.rows||[];if(!r.length)return'';let h=r[0],body=r.slice(1);return `<div class="sheettitle">시트: ${esc(t.sheet)} · ${t.matches}건</div><div class="tablewrap"><table><thead><tr>${h.map(x=>'<th>'+hi(x,q)+'</th>').join('')}</tr></thead><tbody>${body.map(row=>'<tr>'+h.map((_,i)=>'<td>'+hi(row[i]||'',q)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`}
window.onload=()=>{$('url').value=api();if(api())loadFiles()}
</script></body></html>
