function updateBackground(){ $('bg').style.backgroundColor=config.clockBackgroundColor||'#17283b';if(config.clockBackgroundMode==='color'){$('bg').style.backgroundImage='none';return;} const path=String(config.background||DEFAULT.background);if(!/^images\/[\w가-힣 .-]+\.(jpg|jpeg|png|webp)$/i.test(path)||path.includes('..'))return;const url=path+'?v='+Date.now();const img=new Image();img.onload=()=>{$('bg').style.backgroundImage='url("'+url+'")';lastBg=url;v51mUpdateVersionColor(true)};img.src=url}
