<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V50D 날씨 애니메이션 7종 테스트</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9eef5;font-family:Arial,'Malgun Gothic',sans-serif;color:#1b3452}.wrap{max-width:1150px;margin:auto;padding:18px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.controls button{border:1px solid #bdcfe1;background:#fff;color:#173453;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;font-size:15px}.controls button.active{background:#173a7a;color:#fff}.info{font-size:14px;color:#486079;margin:10px 0}#weatherScreen{position:relative;aspect-ratio:16/9;overflow:hidden;background:#122940;color:white;border-radius:16px;box-shadow:0 15px 30px #0a23432b}#weatherContent{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:80%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;text-shadow:0 2px 14px #102b4266}#weatherContent .wx-place{font-size:clamp(17px,2.8vw,30px);margin-bottom:8px}#weatherContent .wx-main{font-size:clamp(60px,10vw,124px);font-weight:700}#weatherContent .wx-condition{font-size:clamp(24px,4vw,46px);font-weight:600}#weatherContent .wx-extra{font-size:clamp(14px,2vw,24px);margin-top:15px}.foot{font-size:13px;color:#60728a;margin-top:12px}
/* V50D: smaller sun, bright stars + diagonal meteors, more delicate clouds, snow crystals and three lightning zones. */
#weatherScreen #wx50Scene{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;isolation:isolate;opacity:1}
#weatherScreen #weatherContent{z-index:1}
#wx50Scene{--wx50-sky1:#65b4e7;--wx50-sky2:#d1ecf8;background:linear-gradient(160deg,var(--wx50-sky1),var(--wx50-sky2))}
#wx50Scene.wx50-sun{--wx50-sky1:#2788d1;--wx50-sky2:#a9dff8}
#wx50Scene.wx50-moon{--wx50-sky1:#07172f;--wx50-sky2:#24496c}
#wx50Scene.wx50-partly{--wx50-sky1:#4b9fda;--wx50-sky2:#b6dceb}
#wx50Scene.wx50-cloud{--wx50-sky1:#607c99;--wx50-sky2:#b0c1cc}
#wx50Scene.wx50-rain{--wx50-sky1:#233e5d;--wx50-sky2:#718ea4}
#wx50Scene.wx50-snow{--wx50-sky1:#819eb7;--wx50-sky2:#d9e9f4}
#wx50Scene.wx50-thunder{--wx50-sky1:#17233d;--wx50-sky2:#495775}
#wx50Scene.wx50-over-image{background:linear-gradient(160deg,#203f6060,#0c284750)}
/* 25vmin -> 16vmin. Keep the sun off the text area. */
#wx50Scene .wx50-sun-disc{position:absolute;width:16vmin;height:16vmin;left:15%;top:15%;border-radius:50%;background:#fff4bd;box-shadow:0 0 42px 15px #fff5bd77,0 0 105px 35px #ffedac4d;animation:wx50-breathe 9s ease-in-out infinite alternate}
#wx50Scene .wx50-moon-disc{position:absolute;width:16vmin;height:16vmin;right:17%;top:13%;border-radius:50%;background:#e7eff9;box-shadow:0 0 40px 12px #dce9f344}
#wx50Scene .wx50-moon-disc:after{content:'';position:absolute;width:85%;height:85%;left:30%;top:-15%;border-radius:50%;background:#07172f}
#wx50Scene .wx50-cloud{position:absolute;width:260px;height:72px;border-radius:100px;background:#f6fbffe0;filter:drop-shadow(0 15px 16px #17324b16);animation:wx50-drift 33s ease-in-out infinite alternate;will-change:transform}
#wx50Scene .wx50-cloud:before,#wx50Scene .wx50-cloud:after{content:'';position:absolute;border-radius:50%;background:inherit}
#wx50Scene .wx50-cloud:before{width:112px;height:112px;left:39px;bottom:24px}
#wx50Scene .wx50-cloud:after{width:137px;height:137px;left:106px;bottom:15px}
#wx50Scene.wx50-cloud .wx50-cloud,#wx50Scene.wx50-rain .wx50-cloud,#wx50Scene.wx50-thunder .wx50-cloud{background:#d4e0e9df}
#wx50Scene.wx50-partly .wx50-cloud{background:#f3f8ffba;filter:blur(1.5px);animation-duration:58s}
#wx50Scene.wx50-cloud .wx50-cloud{background:#d7e1eac0;filter:blur(2.2px);animation-duration:66s}
#wx50Scene.wx50-snow .wx50-cloud{background:#edf5fc9a;filter:blur(2px);animation-duration:62s}
#wx50Scene.wx50-thunder .wx50-cloud{background:#8f9eb29a;filter:blur(2.5px);animation-duration:68s}
/* Rain is deliberately unchanged from V50C. */
#wx50Scene .wx50-drop{position:absolute;top:-10%;height:35px;width:2px;background:#c9eaffbb;transform:rotate(12deg);animation:wx50-rainfall var(--duration,1.6s) linear infinite;animation-delay:var(--delay,0s);will-change:transform}
#wx50Scene .wx50-flake{position:absolute;top:-7%;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 6px #ffffffaa;animation:wx50-snowfall var(--duration,8s) linear infinite;animation-delay:var(--delay,0s);will-change:transform}
#wx50Scene .wx50-flake.wx50-crystal{width:auto;height:auto;background:none;border-radius:0;box-shadow:none;font:24px/1 'Malgun Gothic',sans-serif;color:#f6fbff;text-shadow:0 0 8px #fff8}
#wx50Scene .wx50-snow-decor{position:absolute;font:clamp(23px,4vw,54px)/1 'Malgun Gothic',sans-serif;color:#f5fcff;opacity:.22;text-shadow:0 0 12px #ffffff88;animation:wx50-snow-glide 13s ease-in-out infinite alternate;will-change:transform}
/* Stars are sharper; only a few are larger, avoiding a busy sky. */
/* V50D: restrained night sky. Most stars stay faint; one star at a time gently twinkles. */
#wx50Scene .wx50-star{position:absolute;width:2px;height:2px;background:#e4edfc;border-radius:50%;opacity:.35;box-shadow:0 0 2px 1px #b8d5fa30}
#wx50Scene .wx50-star.wx50-bright{width:3px;height:3px;opacity:.35;box-shadow:0 0 2px 1px #b8d5fa30;animation:wx50-solo-twinkle 16s ease-in-out infinite;animation-delay:var(--delay,0s)}
/* Three short, diagonal shooting stars. The streaks do not continuously rain down. */
#wx50Scene .wx50-meteor{position:absolute;top:var(--meteor-top,5%);left:var(--meteor-left,87%);width:115px;height:2px;border-radius:6px;background:linear-gradient(90deg,transparent 0%,#d9edff66 45%,#ffffff 100%);filter:drop-shadow(0 0 5px #c6e8ff);opacity:0;transform:rotate(-38deg);transform-origin:right center;animation:wx50-meteor-fall var(--meteor-duration,10s) linear infinite;animation-delay:var(--meteor-delay,0s);will-change:transform,opacity}
#wx50Scene .wx50-meteor:after{content:'';position:absolute;right:-2px;top:-2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 9px 4px #b9ddff}
/* Three independent electrical strikes with staggered timing. */
#wx50Scene .wx50-electric{position:absolute;top:6%;left:var(--bolt-left,53%);width:var(--bolt-width,29%);height:78%;overflow:visible;filter:drop-shadow(0 0 5px #a9dfff99)}
#wx50Scene .wx50-electric path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:550;stroke-dashoffset:550;opacity:0;animation:wx50-crackle 9s linear infinite;animation-delay:var(--bolt-delay,0s)}
#wx50Scene .wx50-electric .wx50-core-glow{stroke:#77bfff;stroke-width:12;filter:blur(7px)}
#wx50Scene .wx50-electric .wx50-core{stroke:#e9f8ff;stroke-width:3.1}
#wx50Scene .wx50-electric .wx50-branch{stroke:#b5eaff;stroke-width:1.8;animation-name:wx50-crackle-branch;animation-delay:calc(var(--bolt-delay,0s) - .16s)}
#wx50Scene .wx50-electric .wx50-branch.second{stroke-width:1.4;animation-delay:calc(var(--bolt-delay,0s) - .3s)}
#wx50Scene .wx50-electric .wx50-branch.third{stroke-width:1.2;animation-delay:calc(var(--bolt-delay,0s) - .4s)}
#wx50Scene .wx50-electric-haze{position:absolute;inset:0;background:radial-gradient(ellipse at var(--haze-x,50%) 37%,#b9e5ff22,transparent 32%);opacity:0;animation:wx50-haze 9s linear infinite;animation-delay:var(--bolt-delay,0s)}
@keyframes wx50-drift{from{transform:translate3d(-5vw,0,0) scale(var(--wx50-scale,1))}to{transform:translate3d(8vw,0,0) scale(var(--wx50-scale,1))}}
@keyframes wx50-breathe{from{opacity:.8;transform:scale(.97)}to{opacity:1;transform:scale(1.05)}}
@keyframes wx50-rainfall{from{transform:translate3d(0,-12vh,0) rotate(12deg)}to{transform:translate3d(-12vw,115vh,0) rotate(12deg)}}
@keyframes wx50-snowfall{from{transform:translate3d(0,-10vh,0)}to{transform:translate3d(7vw,112vh,0)}}
@keyframes wx50-snow-glide{from{transform:translate3d(-7px,4px,0) rotate(-9deg)}to{transform:translate3d(13px,-12px,0) rotate(12deg)}}
@keyframes wx50-solo-twinkle{0%,3%,20%,100%{opacity:.35;transform:scale(1);box-shadow:0 0 2px 1px #b8d5fa30}8%{opacity:.9;transform:scale(1.45);box-shadow:0 0 7px 2px #e8f3ffb8}12%{opacity:1;transform:scale(1.65);box-shadow:0 0 10px 3px #d8eaffd0}16%{opacity:.48;transform:scale(1.1);box-shadow:0 0 4px 1px #c7dfff50}}
@keyframes wx50-twinkle{from{opacity:.48;transform:scale(.88)}to{opacity:1;transform:scale(1.18)}}
@keyframes wx50-meteor-fall{0%,8%{opacity:0;transform:translate3d(0,0,0) rotate(-38deg)}9%{opacity:1}14%{opacity:1}19%,100%{opacity:0;transform:translate3d(-39vw,37vh,0) rotate(-38deg)}}
@keyframes wx50-crackle{
 0%,9%,43%,100%{opacity:0;stroke-dashoffset:550}
 11%{opacity:.65;stroke-dashoffset:350}
 13%{opacity:.95;stroke-dashoffset:100}
 15%{opacity:.28;stroke-dashoffset:0}
 18%{opacity:.85;stroke-dashoffset:0}
 20%{opacity:.18;stroke-dashoffset:0}
 23%{opacity:1;stroke-dashoffset:0}
 26%{opacity:.38;stroke-dashoffset:0}
 29%{opacity:.9;stroke-dashoffset:0}
 33%{opacity:.22;stroke-dashoffset:0}
 37%{opacity:.78;stroke-dashoffset:0}
 41%{opacity:0;stroke-dashoffset:0}
}
@keyframes wx50-crackle-branch{
 0%,12%,44%,100%{opacity:0;stroke-dashoffset:550}
 14%{opacity:.75;stroke-dashoffset:120}
 17%{opacity:.1;stroke-dashoffset:0}
 21%{opacity:.9;stroke-dashoffset:0}
 24%{opacity:.2;stroke-dashoffset:0}
 28%{opacity:.78;stroke-dashoffset:0}
 31%{opacity:.12;stroke-dashoffset:0}
 36%{opacity:.85;stroke-dashoffset:0}
 42%{opacity:0;stroke-dashoffset:0}
}
@keyframes wx50-haze{0%,9%,42%,100%{opacity:0}13%,23%,32%{opacity:.65}18%,28%,38%{opacity:.16}}
body:not([data-lcd-screen=weather]) #wx50Scene *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){#wx50Scene *{animation:none!important}#wx50Scene .wx50-drop,#wx50Scene .wx50-electric,#wx50Scene .wx50-meteor{display:none!important}}
</style></head><body data-lcd-screen="weather"><div class="wrap"><h2>V50D · 맑은 밤 별빛 조정 테스트</h2><p class="info">맑은 밤만 수정했습니다. 별은 20개로 줄이고 대부분 은은하게 고정하며, 4개의 별이 한 번에 하나씩 차례로 반짝입니다. 사선 별똥별과 나머지 6종은 그대로입니다.</p><div id="buttons" class="controls"></div><div id="weatherScreen"><div id="weatherContent"><div class="wx-place">서울 · 성수동</div><div class="wx-main">24°C</div><div class="wx-condition">맑음</div><div class="wx-extra">체감 24°C · 습도 45%</div></div></div><p class="foot">디자인 테스트용입니다. WeatherAPI·관리자·서버 연결 없이 실행되며, 기존 V49 파일은 변경하지 않았습니다.</p></div><script>
const config={weatherBackgroundMode:'color'};
function wx49Kind(code,isDay){if(code===1000)return isDay?'sun':'moon';return ({1003:'partly',1009:'cloud',1183:'rain',1213:'snow',1276:'thunder'})[code]||'cloud'}
// V50C: seven independent scenes, driven by existing WeatherAPI conditionCode/isDay.
function wx50Kind(code,isDay){
 const kind=wx49Kind(code,isDay);
 if(kind==='mist')return 'cloud';
 if(kind==='sleet')return 'rain';
 return ['sun','moon','partly','cloud','rain','snow','thunder'].includes(kind)?kind:'cloud';
}
function wx50MountScene(page,code,isDay){
 const kind=wx50Kind(code,isDay);
 const scene=document.createElement('div');scene.id='wx50Scene';scene.className='wx50-'+kind;
 if(config.weatherBackgroundMode==='image')scene.classList.add('wx50-over-image');
 scene.setAttribute('aria-hidden','true');
 const add=(cls,style,content)=>{const e=document.createElement('div');e.className=cls;if(style)for(const [k,v] of Object.entries(style))e.style.setProperty(k,v);if(content)e.textContent=content;scene.appendChild(e);return e};
 if(kind==='sun'||kind==='partly')add('wx50-sun-disc');
 if(kind==='moon'){
  add('wx50-moon-disc');
  // 20 small stars, only 4 of which take turns briefly glowing (one at a time).
  let brightIndex=0;
  for(let i=0;i<20;i++){
   const bright=[2,7,12,17].includes(i);
   add('wx50-star'+(bright?' wx50-bright':''),{
    left:(7+(i*37)%85)+'%',top:(8+(i*29)%78)+'%',
    ...(bright?{'--delay':(-brightIndex++*4)+'s'}:{})
   });
  }
  for(let i=0;i<3;i++)add('wx50-meteor',{
   '--meteor-left':(85-i*12)+'%','--meteor-top':(6+i*10)+'%',
   '--meteor-duration':(9+i*2)+'s','--meteor-delay':(-i*4.3)+'s'
  });
 }
 // V50C rain remains unchanged. More clouds elsewhere, but keep them small and transparent.
 const clouds=kind==='rain'?3:kind==='partly'?3:kind==='cloud'?4:kind==='thunder'?5:kind==='snow'?3:0;
 const positions={partly:[[-10,17],[43,12],[76,41]],cloud:[[-12,11],[28,25],[70,15],[82,48]],snow:[[-10,14],[38,8],[77,24]],thunder:[[-12,8],[23,13],[57,5],[82,27],[40,44]]};
 for(let i=0;i<clouds;i++){
  const isRain=kind==='rain',pos=(positions[kind]||[])[i]||[-12+i*37,18+i*15];
  add('wx50-cloud',{
   left:isRain?(-12+i*37)+'%':pos[0]+'%',
   top:isRain?(18+i*15)+'%':pos[1]+'%',
   '--wx50-scale':isRain?'1':String(kind==='partly'?.48+(i%2)*.1:kind==='thunder'?.64+(i%3)*.1:kind==='snow'?.54+(i%2)*.1:.56+(i%3)*.07),
   animationDelay:(-i*7)+'s',
   opacity:isRain?String(.65+i*.12):String(kind==='partly'?.35+(i%2)*.09:kind==='thunder'?.40+(i%3)*.07:kind==='snow'?.35+(i%2)*.08:.39+(i%3)*.06)
  });
 }
 if(kind==='rain'||kind==='snow'){
  const rain=kind==='rain';const count=rain?24:22;
  for(let i=0;i<count;i++){
   const crystal=!rain&&i%3===0;
   add(rain?'wx50-drop':('wx50-flake'+(crystal?' wx50-crystal':'')),{
    left:((i*47+13)%100)+'%',
    '--duration':(rain?1.25+(i%5)*.24:6.8+(i%6)*.8)+'s',
    '--delay':(-i*(rain?.27:.53))+'s',
    opacity:String(.45+(i%4)*.14)
   },crystal?'❄':'');
  }
  if(!rain){
   for(let i=0;i<8;i++)add('wx50-snow-decor',{
    left:(4+(i*29)%91)+'%',top:(12+(i*37)%75)+'%',
    fontSize:(26+(i%3)*11)+'px',animationDelay:(-i*1.7)+'s',opacity:String(.15+(i%3)*.05)
   },'❄');
  }
 }
 if(kind==='thunder'){
  const bolts=[
   {left:'5%',width:'30%',delay:'0s',x:'18%',core:'M182 8 L161 83 L183 114 L133 191 L149 229 L100 303 L119 342 L63 441 L78 477 L41 497'},
   {left:'37%',width:'30%',delay:'-2.9s',x:'51%',core:'M148 9 L178 69 L142 121 L162 162 L117 243 L138 284 L96 362 L114 398 L57 486'},
   {left:'68%',width:'29%',delay:'-5.7s',x:'82%',core:'M165 8 L137 78 L170 110 L135 186 L152 234 L109 288 L127 338 L75 415 L89 450 L52 493'}
  ];
  for(const bolt of bolts){
   add('wx50-electric-haze',{'--bolt-delay':bolt.delay,'--haze-x':bolt.x});
   const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
   svg.setAttribute('class','wx50-electric');svg.setAttribute('viewBox','0 0 350 500');
   svg.setAttribute('preserveAspectRatio','xMidYMid meet');svg.setAttribute('aria-hidden','true');
   svg.style.setProperty('--bolt-left',bolt.left);svg.style.setProperty('--bolt-width',bolt.width);svg.style.setProperty('--bolt-delay',bolt.delay);
   const paths=[['wx50-core-glow',bolt.core],['wx50-core',bolt.core],
    ['wx50-branch','M133 191 L208 207 L190 258 L248 282 L226 328'],
    ['wx50-branch second','M100 303 L54 319 L74 359 L28 388'],
    ['wx50-branch third','M149 229 L220 176 L247 189 L284 156']];
   for(const [cls,d] of paths){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('class',cls);p.setAttribute('d',d);svg.appendChild(p)}
   scene.appendChild(svg);
  }
 }
 page.appendChild(scene);
}

const cases=[['맑음',1000,1,'24°C'],['맑은 밤',1000,0,'19°C'],['구름 조금',1003,1,'22°C'],['흐림',1009,1,'20°C'],['비',1183,1,'16°C'],['눈',1213,1,'-2°C'],['천둥·번개',1276,1,'18°C']];
function show(i){const [label,code,day,temp]=cases[i],page=document.getElementById('weatherScreen'),content=document.getElementById('weatherContent');page.querySelector('#wx50Scene')?.remove();wx50MountScene(page,code,day);page.prepend(page.querySelector('#wx50Scene'));content.querySelector('.wx-main').textContent=temp;content.querySelector('.wx-condition').textContent=label;document.querySelectorAll('#buttons button').forEach((b,j)=>b.classList.toggle('active',i===j))}
cases.forEach((item,i)=>{const b=document.createElement('button');b.textContent=item[0];b.onclick=()=>show(i);document.getElementById('buttons').appendChild(b)});show(0);
</script></body></html>
