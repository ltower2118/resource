<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCD 시계 관리자</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#1d2d42;font-family:Arial,'Malgun Gothic',sans-serif}.wrap{max-width:880px;margin:auto;padding:20px 15px 80px}section{background:white;border:1px solid #dde5ed;border-radius:14px;padding:18px;margin:14px 0}h1{font-size:24px;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}p{font-size:13px;color:#64748b;line-height:1.6}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}input[type=checkbox]{width:auto;transform:scale(1.15);margin-right:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{display:flex;gap:8px;flex-wrap:wrap}button,.btn{padding:12px 16px;border:0;border-radius:9px;background:#18317a;color:white;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}button:disabled{opacity:.5}.secondary{background:#e6edf6;color:#203452}#preview{position:relative;aspect-ratio:16/9;background:#223a57;border-radius:12px;overflow:hidden;color:#fff}#pvBg,#pvShade{position:absolute;inset:0}#pvBg{background-size:cover;background-position:center}#pvShade{background:#000}#pvTime{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}#pvDate{position:absolute;font-weight:700;white-space:nowrap}#status{padding:13px;background:#eef5ff;border-radius:9px;white-space:pre-wrap;line-height:1.6}#status.error{background:#ffeaea;color:#a12b2b}#status.ok{background:#e6f5e9;color:#245d39}@media(max-width:540px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>LCD 시계 관리자</h1><p>미리보기에서 확인한 뒤 <b>설정 저장</b> 한 번으로 LCD 화면에 반영합니다.</p>
<section><h2>시간</h2><label><input id="showTime" type="checkbox">시간 표시</label><div class="grid"><div><label>글자 크기(px)</label><input id="timeSize" type="number" min="24" max="260"></div><div><label>글자 색상</label><input id="timeColor" type="color"></div><div><label>시간 글꼴</label><select id="timeFont"><option value="Arial">Arial</option><option value="Malgun Gothic">맑은 고딕</option><option value="Noto Sans KR">Noto Sans KR</option><option value="Georgia">Georgia</option><option value="Courier New">Courier New</option><option value="Times New Roman">Times New Roman</option></select></div><div><label>시간 형식</label><select id="timeFormat"><option value="24s">24시간 시:분:초</option><option value="24m">24시간 시:분</option><option value="12s">오전/오후 시:분:초</option><option value="12m">오전/오후 시:분</option></select></div></div></section>
<section><h2>날짜</h2><label><input id="showDate" type="checkbox">날짜 표시</label><div class="grid"><div><label>글자 크기(px)</label><input id="dateSize" type="number" min="16" max="110"></div><div><label>글자 색상</label><input id="dateColor" type="color"></div><div><label>날짜 글꼴</label><select id="dateFont"><option value="Arial">Arial</option><option value="Malgun Gothic">맑은 고딕</option><option value="Noto Sans KR">Noto Sans KR</option><option value="Georgia">Georgia</option><option value="Courier New">Courier New</option><option value="Times New Roman">Times New Roman</option></select></div><div><label>표시 위치</label><select id="datePosition"><option value="center">중앙 (시간 아래)</option><option value="top-left">왼쪽 위</option><option value="top-right">오른쪽 위</option><option value="bottom-left">왼쪽 아래</option><option value="bottom-right">오른쪽 아래</option></select></div><div><label>날짜 형태</label><select id="dateFormat"><option value="long">2026년 11월 2일 월요일</option><option value="short">2026.11.02 (월)</option><option value="iso">2026-11-02</option><option value="slash">2026/11/02</option><option value="month">11월 2일 월요일</option></select></div></div></section>
<section><h2>배경</h2><label>배경 이미지 파일명</label><input id="background" value="images/background.jpg"><p>배경 이미지는 GitHub의 <b>ds/images</b> 폴더에서 교체합니다. 같은 파일명으로 변경해도 LCD가 주기적으로 새로 읽습니다.</p><label>배경 어둡게 (%)</label><input id="overlay" type="range" min="0" max="70"><div class="buttons"><button id="images" class="secondary">GitHub 배경 폴더 열기</button></div></section>
<section><h2>실시간 미리보기</h2><div id="preview"><div id="pvBg"></div><div id="pvShade"></div><div id="pvTime"></div><div id="pvDate"></div></div></section>
<section><h2>저장</h2><label>관리자 키 (최초 한 번 입력)</label><input id="key" type="password" autocomplete="off" placeholder="Apps Script setup() 실행 로그의 관리자 키"><label><input id="remember" type="checkbox">이 PC에 관리자 키 기억</label><div class="buttons"><button id="save">💾 설정 저장 · LCD 자동 반영</button><button id="load" class="secondary">↻ 현재 설정 다시 불러오기</button><button id="clear" class="secondary">관리자 키 지우기</button><a class="btn secondary" href="main.html" target="_blank" rel="noopener">LCD 화면 보기</a></div><p id="status" role="status">연결 확인 중...</p></section></main>
<script src="config.js"></script><script src="shared.js"></script><script>
const $=id=>document.getElementById(id);let current={...DEFAULT};
const keys=['showTime','showDate','timeSize','timeColor','timeFormat','timeFont','dateSize','dateFont','dateColor','datePosition','dateFormat','background','overlay'];
function readForm(){const x={...current};for(const k of keys){const el=$(k);x[k]=el.type==='checkbox'?el.checked:el.type==='number'||el.type==='range'?Number(el.value):el.value}return x}
function fill(c){current={...DEFAULT,...c};for(const k of keys){const el=$(k);if(el.type==='checkbox')el.checked=!!current[k];else el.value=current[k]}preview()}
function message(s,kind=''){const el=$('status');el.textContent=s;el.className=kind}
function preview(){const c=readForm(),p=nowParts(),t=$('pvTime'),d=$('pvDate');t.textContent=fmtTime(c,p);d.textContent=fmtDate(c,p);t.style.display=c.showTime?'block':'none';d.style.display=c.showDate?'block':'none';t.style.color=c.timeColor;d.style.color=c.dateColor;t.style.fontFamily=fontValue(c.timeFont);d.style.fontFamily=fontValue(c.dateFont);t.style.fontSize=Math.min(66,Math.max(14,c.timeSize*.34))+'px';d.style.fontSize=Math.min(28,Math.max(10,c.dateSize*.4))+'px';d.style.top='auto';d.style.bottom='auto';d.style.left='auto';d.style.right='auto';d.style.transform='none';
if(c.datePosition==='center'){d.style.top='68%';d.style.left='50%';d.style.transform='translate(-50%,-50%)'}else{d.style[c.datePosition.includes('top')?'top':'bottom']='4%';d.style[c.datePosition.includes('right')?'right':'left']='3%'}
$('pvShade').style.opacity=Number(c.overlay)/100;$('pvBg').style.backgroundImage='url("'+encodeURI(c.background)+'")'}
function repoUrl(){const h=location.hostname,p=location.pathname.split('/').filter(Boolean);if(!h.endsWith('.github.io'))return '';const owner=h.split('.')[0],repo=p[0]||owner;return 'https://github.com/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo)+'/tree/main/ds/images'}
$('images').onclick=()=>{const url=repoUrl();if(url)window.open(url,'_blank','noopener');else message('GitHub Pages에서 접속하세요.','error')};
for(const el of document.querySelectorAll('input,select'))el.addEventListener('input',preview);
async function load(){try{const c=await getRemote();fill(c);message('현재 LCD 설정을 불러왔습니다.','ok')}catch(e){fill(DEFAULT);message('서버 연결 실패: '+e.message,'error')}}
function sleep(t){return new Promise(r=>setTimeout(r,t))}
async function save(){const key=$('key').value.trim();if(!apiReady())return message('config.js에 웹앱 주소를 먼저 설정하세요.','error');if(!key)return message('관리자 키를 입력하세요.','error');
const config=readForm(),requestId=String(Date.now())+'-'+Math.random().toString(36).slice(2);if($('remember').checked)localStorage.setItem('lcd_clock_admin_key',key);else localStorage.removeItem('lcd_clock_admin_key');
$('save').disabled=true;message('설정 저장 중...');
try{await fetch(apiUrl(),{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',adminKey:key,config,requestId})});
let confirmed=false;for(let i=0;i<10;i++){await sleep(1500);try{const actual=await getRemote();if(actual.version===requestId){confirmed=true;fill(actual);break}}catch(_){}}
if(confirmed)message('저장 완료! LCD 화면은 약 15초 이내에 새 설정을 불러옵니다.','ok');else message('저장 여부를 확인하지 못했습니다. 중복 저장하지 말고 현재 설정 다시 불러오기를 눌러 확인하세요. 관리자 키 및 Apps Script 배포 권한도 확인하세요.','error')}
catch(e){message('저장 요청 오류: '+e.message,'error')}finally{$('save').disabled=false}}
$('save').onclick=save;$('load').onclick=load;$('clear').onclick=()=>{localStorage.removeItem('lcd_clock_admin_key');$('key').value='';$('remember').checked=false;message('관리자 키를 이 브라우저에서 지웠습니다.')};
$('key').value=localStorage.getItem('lcd_clock_admin_key')||'';$('remember').checked=!!$('key').value;
fill(DEFAULT);load();setInterval(preview,1000);
</script></body></html>
