<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LCD 시계</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;}body{margin:0;overflow:hidden;background:#17283b;color:#fff;font-family:Arial,'Malgun Gothic',sans-serif}#bg,#shade{position:fixed;inset:0}#bg{background-size:cover;background-position:center;background-repeat:no-repeat}#shade{background:#000;pointer-events:none}#time{position:fixed;max-width:98vw;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;font-weight:800;text-shadow:0 2px 16px #000a;font-variant-numeric:tabular-nums}#date{position:fixed;max-width:98vw;white-space:nowrap;font-weight:700;text-shadow:0 2px 12px #000a}.center{top:66%;left:50%;transform:translate(-50%,-50%)}.top-left{top:4%;left:3%}.top-right{top:4%;right:3%}.bottom-left{bottom:4%;left:3%}.bottom-right{bottom:4%;right:3%}#full{position:fixed;bottom:14px;right:14px;padding:10px;color:#fff;background:#0009;border:1px solid #fff8;border-radius:9px;opacity:0;cursor:pointer}body:hover #full,#full:focus{opacity:1}#exitFull{position:fixed;top:12px;right:12px;padding:10px 14px;background:#000b;color:white;border:1px solid #fff8;border-radius:8px;cursor:pointer;z-index:99;display:none}body:fullscreen #full,body:fullscreen #exitFull,body:fullscreen #status{display:none!important}html:fullscreen #full,html:fullscreen #exitFull,html:fullscreen #status{display:none!important}#messageScreen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:5vw;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.35;font-weight:800;z-index:10}
#messageScreen .message-content{position:absolute;left:50%;top:50%;width:1728px;max-width:none;min-width:0;overflow-wrap:anywhere;transform-origin:center center;line-height:1.35;box-sizing:border-box}#messageScreen.active{display:flex}body:has(#messageScreen.active) #bg,body:has(#messageScreen.active) #shade{visibility:hidden}#messageScreen b,#messageScreen strong{font-weight:900}#messageScreen u{text-decoration:underline}#messageScreen mark{background:#fff176;color:#111}
#boot,#offline{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:#111c2e;color:#fff;padding:7vw;transition:opacity .65s ease}
#boot .spinner{width:54px;height:54px;border:5px solid #ffffff30;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:24px}@keyframes spin{to{transform:rotate(360deg)}}
#boot.hide{opacity:0;pointer-events:none}#offline{display:none;z-index:70;background:#15233a;font-weight:750;font-size:clamp(25px,4.3vw,70px);line-height:1.6;white-space:pre-line}#offline.visible{display:flex}#offline small{font-size:clamp(14px,1.5vw,22px);font-weight:400;color:#c5d0df;margin-top:25px}#status{position:fixed;bottom:12px;left:12px;font-size:12px;color:#fff9}
body.preview-mode #boot,body.preview-mode #offline{display:none!important}#messageScreen .v13-layout{position:absolute;inset:0;width:1920px;height:1080px;transform-origin:0 0}#messageScreen .v13-item{position:absolute;transform:translate(-50%,-50%);max-width:none;white-space:pre-wrap;overflow-wrap:normal;word-break:normal;line-height:1.2;box-sizing:border-box;padding:8px} </style></head><body><div id="bg"></div><div id="shade"></div><div id="time"></div><div id="date"></div><div id="messageScreen" aria-live="polite"></div><div id="status"></div><div id="offline"><span>인터넷 연결이 안 됩니다.
조만간 복구하겠습니다.</span><small id="offlineHint">연결 상태를 확인하고 있습니다.</small></div><div id="boot"><div class="spinner"></div><div>LCD 화면을 준비하고 있습니다...</div></div><button id="full">⛶ 전체화면</button><button id="exitFull" type="button" aria-label="전체화면 종료">× 종료</button><script>

 if(e.target && e.target.tagName==='SCRIPT'){
   var o=document.getElementById('offline'),b=document.getElementById('boot');
   if(o){o.classList.add('visible');document.getElementById('offlineHint').textContent='필수 설정 파일을 불러오지 못했습니다. GitHub ds 폴더를 확인하세요.';}

</script><script src="config.js?v=20261102-rich-editor-v3"></script><script src="shared.js?v=20261102-rich-editor-v3"></script><script>
if(new URLSearchParams(location.search).get('preview')==='1')document.body.classList.add('preview-mode');const $=id=>document.getElementById(id);let lastMessageMarkup='';let config={...DEFAULT};let lastBg='';let screenStarted=Date.now();let screenType='clock';let cycleKey='';let lastConfigSignature='';let syncRunning=false;let lastSyncAt=0;let firstReady=false;let failCount=0;const forceOffline=new URLSearchParams(location.search).get('testOffline')==='1';const isPreview=new URLSearchParams(location.search).get('preview')==='1';let previewMode='clock';let bootWatchdog=null;
function draw(){const p=nowParts();$('time').textContent=fmtTime(config,p);$('date').textContent=fmtDate(config,p)}
function viewScale(){return Math.min(window.innerWidth/1920,window.innerHeight/1080)}
function fitLayout(){
 const scale=viewScale();
 $('time').style.fontSize=(Math.max(24,Math.min(260,Number(config.timeSize)||112))*scale)+'px';
 $('date').style.fontSize=(Math.max(16,Math.min(110,Number(config.dateSize)||34))*scale)+'px';
 const content=$('messageScreen').querySelector('.message-content');const v13Layer=$('messageScreen').querySelector('.v13-layout');if(v13Layer){v13Layer.style.transform='scale('+scale+')';v13Layer.style.left=((innerWidth-1920*scale)/2)+'px';v13Layer.style.top=((innerHeight-1080*scale)/2)+'px'}
 if(content){content.style.transform='translate(-50%,-50%) scale('+scale+')'}
 $('messageScreen').style.fontSize=Math.max(24,Math.min(240,Number(config.messageSize)||100))+'px';
 $('messageScreen').style.padding='0';
 $('bg').style.backgroundSize=config.backgroundFit==='contain'?'contain':'cover';if(Number.isFinite(Number(config.timeX))&&config.timeX!=null){$('time').style.left=config.timeX+'%';$('time').style.top=(config.timeY??50)+'%'}if(config.dateX!=null&&config.dateY!=null){$('date').style.left=config.dateX+'%';$('date').style.top=config.dateY+'%';$('date').style.right='auto';$('date').style.bottom='auto';$('date').style.transform='translate(-50%,-50%)'}
}
window.addEventListener('resize',fitLayout);
window.addEventListener('orientationchange',()=>setTimeout(fitLayout,150));
function apply(c){config={...DEFAULT,...c};$('time').style.display=config.showTime?'block':'none';$('date').style.display=config.showDate?'block':'none';$('time').style.fontFamily=fontValue(config.timeFont);$('date').style.fontFamily=fontValue(config.dateFont);$('time').style.color=config.timeColor;$('date').style.color=config.dateColor;$('date').className=config.datePosition;$('shade').style.opacity=Number(config.overlay)/100;screenStarted=Date.now();renderScreen();draw();fitLayout()}
function renderScreen(){
 const m=$('messageScreen');const enabled=!!config.messageEnabled&&(Array.isArray(config.messageBlocks)&&config.messageBlocks.length>0||String(config.messageText||config.messageHtml||'').trim().length>0);
 if(!enabled&&!isPreview){screenType='clock';m.classList.remove('active');return}
 const clockMs=Math.max(5,Number(config.clockSeconds)||60)*1000;
 const messageMs=Math.max(3,Number(config.messageSeconds)||15)*1000;
 const elapsed=Date.now()-screenStarted;
 const offset=config.startScreen==='message'?clockMs:0;const next=isPreview?previewMode:(((elapsed+offset)%(clockMs+messageMs))<clockMs?'clock':'message');
 screenType=next;m.classList.toggle('active',next==='message');
 if(new URLSearchParams(location.search).has('debug'))$('status').textContent='교대 '+next+' / '+Math.floor(elapsed/1000)+'초 / '+Math.floor(clockMs/1000)+'+'+Math.floor(messageMs/1000)+'초';
 const html=Array.isArray(config.messageBlocks)&&config.messageBlocks.length?'__V13_BLOCKS__'+JSON.stringify(config.messageBlocks):messageMarkup(config);if(html!==lastMessageMarkup){if(html.startsWith('__V13_BLOCKS__')){
 m.innerHTML='<div class="v13-layout"></div>';const layer=m.firstElementChild;
 for(const b of config.messageBlocks){const item=document.createElement('div');item.className='v13-item';item.textContent=String(b.text||'');item.style.width=Math.max(100,Math.min(1800,Number(b.width)||900))+'px';item.style.whiteSpace='pre-wrap';item.style.overflowWrap=b.wrap===false?'normal':'break-word';item.style.wordBreak='normal';item.style.left=Number(b.x??50)+'%';item.style.top=Number(b.y??50)+'%';item.style.fontSize=Number(b.size||100)+'px';item.style.color=b.color||'#ffdd55';item.style.fontFamily=fontValue(b.font||'Arial');item.style.fontWeight=b.bold?'800':'400';item.style.textDecoration=b.underline?'underline':'none';layer.appendChild(item)}
 }else{m.innerHTML='<div class="message-content">'+html+'</div>'}lastMessageMarkup=html;fitLayout()}m.style.textAlign=messageAlignment(config);
 m.style.fontSize=Math.max(24,Math.min(240,Number(config.messageSize)||100))+'px';
 m.style.color=config.messageColor||'#ffdd55';m.style.backgroundColor=config.messageBackground||'#101827';
 m.style.fontFamily=fontValue(config.messageFont);
}
function updateBackground(){const path=String(config.background||DEFAULT.background);if(!/^images\/[\w가-힣 .-]+\.(jpg|jpeg|png|webp)$/i.test(path)||path.includes('..'))return;const url=path+'?v='+Date.now();const img=new Image();img.onload=()=>{$('bg').style.backgroundImage='url("'+url+'")';lastBg=url};img.src=url}
async function refresh(){
 if(syncRunning)return;
 syncRunning=true;
 try{
  if(forceOffline)throw Error('인터넷 장애 테스트 모드');
  if(!navigator.onLine)throw Error('오프라인');
  const c=await getRemote(12000);
  const signature=JSON.stringify(c);
  if(signature!==lastConfigSignature){
    apply(c);
    lastConfigSignature=signature;
    updateBackground();
  }
  lastSyncAt=Date.now();failCount=0;$('offline').classList.remove('visible');
  if(!firstReady){firstReady=true;clearTimeout(bootWatchdog);requestAnimationFrame(()=>{requestAnimationFrame(()=>{$('boot').classList.add('hide');setTimeout(()=>$('boot').remove(),750)})})}
  if(!new URLSearchParams(location.search).has('debug'))$('status').textContent='';
 }catch(e){failCount++;$('status').textContent='서버 동기화 오류: '+e.message;
 if(forceOffline||!navigator.onLine||failCount>=1){$('offline').classList.add('visible');$('offlineHint').textContent=forceOffline?'테스트 모드 · 주소에서 ?testOffline=1 을 제거하면 정상 화면으로 돌아갑니다.':'네트워크 연결을 자동으로 다시 확인합니다.';if(!firstReady){firstReady=true;clearTimeout(bootWatchdog);$('boot').classList.add('hide');setTimeout(()=>$('boot').remove(),750)}}
 else if(!firstReady){$('boot').querySelector('div:last-child').textContent='서버에 다시 연결하고 있습니다...'}
 }
 finally{syncRunning=false}
}
// PC 절전 복귀, 탭 전환, 네트워크 복구 시 즉시 동기화
function resumeSync(){if(Date.now()-lastSyncAt>1500)refresh()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeSync()});
window.addEventListener('focus',resumeSync);
window.addEventListener('pageshow',resumeSync);
window.addEventListener('online',resumeSync);
// LCD 전체화면 제어: 화면 클릭, ESC로 해제; F11은 브라우저에서 처리
let fullscreenStartedAt=0;
let exitingFullscreen=false;
async function leaveFullscreen(){
 if(!document.fullscreenElement||exitingFullscreen)return;
 exitingFullscreen=true;
 try{await document.exitFullscreen()}catch(err){console.warn('전체화면 해제 실패',err)}
 finally{exitingFullscreen=false}
}
$('full').onclick=async()=>{
 try{
  if(document.fullscreenElement){await leaveFullscreen();return}
  await document.documentElement.requestFullscreen();
 }catch(e){$('status').textContent='전체화면 실행 제한: F11을 이용하세요.'}
};
$('exitFull').onclick=leaveFullscreen;
document.addEventListener('fullscreenchange',()=>{
 fullscreenStartedAt=document.fullscreenElement?Date.now():0;

 $('full').textContent='⛶ 전체화면';
 $('exitFull').style.display='none';
});
// 전체화면에서는 화면의 빈 곳이나 시계/문자를 클릭하면 해제합니다.
// 전체화면 진입 버튼 클릭 이벤트가 전파되어 즉시 해제되는 것은 방지합니다.
document.addEventListener('click',e=>{
 if(!document.fullscreenElement)return;
 if(e.target.closest('#full, #exitFull'))return;
 if(Date.now()-fullscreenStartedAt<500)return;
 leaveFullscreen();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&document.fullscreenElement){leaveFullscreen();return}
 // 브라우저의 F11 모드는 브라우저가 직접 전환합니다.
 // 브라우저 F11은 다시 F11로 전환합니다.
 // F11은 브라우저 기본 동작에 맡깁니다. 웹페이지가 F11 모드를 강제로 제어할 수 없습니다.
});
// Start with an opaque loading layer. If external API never responds, never leave the LCD stuck on loading.
bootWatchdog=setTimeout(()=>{
 if(firstReady)return;
 firstReady=true;
 $('offline').classList.add('visible');
 $('offlineHint').textContent='설정 서버 응답이 지연되고 있습니다. 자동으로 재연결을 시도합니다.';
 $('boot').classList.add('hide');
 setTimeout(()=>$('boot')?.remove(),750);
},14000);
setInterval(()=>{if(firstReady){draw();renderScreen()}},500);
if(isPreview){$('boot').remove();$('offline').remove();$('full').remove();$('exitFull').remove();$('status').remove();window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.kind!=='lcd-preview-config')return;previewMode=e.data.mode==='message'?'message':'clock';lastMessageMarkup='';apply(e.data.config);updateBackground();renderScreen()});window.parent.postMessage({kind:'lcd-preview-ready'},location.origin)}else{refresh();setInterval(refresh,10000)}
</script></body></html>
