<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCD 시계</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#17283b;color:#fff;font-family:Arial,'Malgun Gothic',sans-serif}#bg,#shade{position:fixed;inset:0}#bg{background-size:cover;background-position:center}#shade{background:#000;pointer-events:none}#time{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;font-weight:800;text-shadow:0 2px 16px #000a;font-variant-numeric:tabular-nums}#date{position:fixed;white-space:nowrap;font-weight:700;text-shadow:0 2px 12px #000a}.center{top:66%;left:50%;transform:translate(-50%,-50%)}.top-left{top:4%;left:3%}.top-right{top:4%;right:3%}.bottom-left{bottom:4%;left:3%}.bottom-right{bottom:4%;right:3%}#full{position:fixed;bottom:14px;right:14px;padding:10px;color:#fff;background:#0009;border:1px solid #fff8;border-radius:9px;opacity:0;cursor:pointer}body:hover #full,#full:focus{opacity:1}#status{position:fixed;bottom:12px;left:12px;font-size:12px;color:#fff9}
</style></head><body><div id="bg"></div><div id="shade"></div><div id="time"></div><div id="date"></div><div id="status"></div><button id="full">⛶ 전체화면</button><script src="config.js"></script><script src="shared.js"></script><script>
const $=id=>document.getElementById(id);let config={...DEFAULT};let lastBg='';
function draw(){const p=nowParts();$('time').textContent=fmtTime(config,p);$('date').textContent=fmtDate(config,p)}
function apply(c){config={...DEFAULT,...c};$('time').style.display=config.showTime?'block':'none';$('date').style.display=config.showDate?'block':'none';$('time').style.fontSize='min('+config.timeSize+'px, 13vw)';$('date').style.fontSize='min('+config.dateSize+'px, 6vw)';$('time').style.color=config.timeColor;$('date').style.color=config.dateColor;$('date').className=config.datePosition;$('shade').style.opacity=Number(config.overlay)/100;draw()}
function updateBackground(){const path=String(config.background||DEFAULT.background);if(!/^images\/[\w가-힣 .-]+\.(jpg|jpeg|png|webp)$/i.test(path)||path.includes('..'))return;const url=path+'?v='+Date.now();const img=new Image();img.onload=()=>{$('bg').style.backgroundImage='url("'+url+'")';lastBg=url};img.src=url}
async function refresh(){try{const c=await getRemote();if(c.version!==config.version)apply(c);updateBackground();$('status').textContent=''}catch(e){$('status').textContent=e.message+' · 이전 화면 유지'}}
$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
apply(config);setInterval(draw,1000);refresh();setInterval(refresh,15000);
</script></body></html>
