<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>실시간 슬라이드쇼</title>
<style>
:root{--fade:1100ms;--clock-size:96px;--date-size:30px;--clock-color:#fff;--date-color:#fff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101724;color:#fff;font-family:system-ui,"Malgun Gothic",sans-serif}
.slide{position:fixed;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity var(--fade) ease}.slide.on{opacity:1}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.18);pointer-events:none}
.clock{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;pointer-events:none;text-shadow:0 3px 18px #000b;padding:24px}
#time{font-size:clamp(24px,8vw,var(--clock-size));font-weight:850;color:var(--clock-color);font-variant-numeric:tabular-nums;line-height:1.1}
#date{font-size:clamp(16px,3vw,var(--date-size));font-weight:650;color:var(--date-color);margin-top:12px}
.hidden{display:none!important}
.controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:#111b2cce;padding:9px;border-radius:12px;opacity:0;transition:opacity .2s}
body:hover .controls,.controls:focus-within{opacity:1}button{background:#ffffff23;color:#fff;border:1px solid #ffffff30;border-radius:8px;padding:9px 11px;cursor:pointer}
#status{position:fixed;bottom:12px;left:15px;color:#ffffffa6;font-size:12px;max-width:35vw}
#empty{position:fixed;inset:0;display:grid;place-items:center;color:#fff8;font-size:20px;text-align:center;padding:24px}
@media(pointer:coarse){.controls{opacity:1;bottom:14px}#status{bottom:90px}}
</style></head><body>
<div id="slideA" class="slide on"></div><div id="slideB" class="slide"></div><div class="shade"></div>
<div id="empty">ds/images 폴더에 사진을 등록하고<br>관리자에서 재생할 사진을 선택하세요.</div>
<div class="clock"><div id="time"></div><div id="date"></div></div>
<div id="status"></div><div class="controls"><button id="prev">◀</button><button id="toggle">일시정지</button><button id="next">▶</button><span id="counter">0 / 0</span><button id="reload">새로고침</button><button id="full">⛶ 전체화면</button></div>
<script>
const CFG={imageFolder:'ds/images',manifest:'ds/slides.json',refreshSeconds:30,timeZone:'Asia/Seoul'};
const $=id=>document.getElementById(id);
let slides=[],pos=0,front='slideA',playing=true,slideTimer=null,busy=false,settings={};
function tick(){
 const d=new Date();
 $('time').textContent=new Intl.DateTimeFormat('ko-KR',{timeZone:CFG.timeZone,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);
 $('date').textContent=new Intl.DateTimeFormat('ko-KR',{timeZone:CFG.timeZone,year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d);
}tick();setInterval(tick,1000);
function setAppearance(c){
 const mode=['both','time','date'].includes(c.mode)?c.mode:'both';
 $('time').classList.toggle('hidden',mode==='date');$('date').classList.toggle('hidden',mode==='time');
 const safeColor=x=>/^#[\da-f]{6}$/i.test(x||'')?x:'#ffffff';
 document.documentElement.style.setProperty('--clock-size',Math.max(24,Math.min(240,Number(c.size)||96))+'px');
 document.documentElement.style.setProperty('--date-size',Math.max(16,Math.min(120,Number(c.dateSize)||30))+'px');
 document.documentElement.style.setProperty('--clock-color',safeColor(c.color));
 document.documentElement.style.setProperty('--date-color',safeColor(c.dateColor));
}
function loadImg(src){return new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(true);img.onerror=()=>resolve(false);img.src=src})}
function updateCount(){$('counter').textContent=slides.length?(pos+1)+' / '+slides.length:'0 / 0'}
function schedule(){clearInterval(slideTimer);if(playing&&slides.length>1)slideTimer=setInterval(()=>next(1),Math.max(2,Number(settings.slideSeconds)||10)*1000)}
async function next(step){
 if(busy||slides.length<2)return;busy=true;
 const target=(pos+step+slides.length)%slides.length,back=front==='slideA'?'slideB':'slideA';
 if(!await loadImg(slides[target].url)){$('status').textContent='이미지 읽기 실패: '+slides[target].name;busy=false;return}
 $(back).style.backgroundImage='url("'+slides[target].url+'")';$(back).classList.add('on');$(front).classList.remove('on');front=back;pos=target;updateCount();
 setTimeout(()=>busy=false,Math.max(0,Number(settings.fadeMs)||1100)+50);
}
function encodePath(s){return s.split('/').map(encodeURIComponent).join('/')}
async function refresh(){
 try{
  const res=await fetch(CFG.manifest+'?v='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw Error('ds/slides.json HTTP '+res.status);
  const m=await res.json();
  if(!Array.isArray(m.selected))throw Error('selected 배열이 없습니다.');
  settings=m;setAppearance(m.clock||{});
  document.documentElement.style.setProperty('--fade',Math.max(0,Math.min(10000,Number(m.fadeMs)||1100))+'ms');
  const names=[...new Set(m.selected)].filter(x=>typeof x==='string'&&/^[^/\\]+\.(jpe?g|png|webp|gif)$/i.test(x)&&!x.includes('..'));
  const nextSlides=names.map(name=>({name,url:encodePath(CFG.imageFolder+'/'+name)+'?v='+encodeURIComponent(m.version||'0')}));
  const signature=JSON.stringify(nextSlides);
  if(signature!==JSON.stringify(slides)){
   const oldName=slides[pos]?.name;slides=nextSlides;
   pos=Math.max(0,slides.findIndex(x=>x.name===oldName));
   if(slides.length){
    if(!await loadImg(slides[pos].url))throw Error('선택된 사진을 읽을 수 없습니다: '+slides[pos].name);
    $('slideA').style.backgroundImage='url("'+slides[pos].url+'")';$('slideA').classList.add('on');$('slideB').classList.remove('on');front='slideA';
   }else{$('slideA').style.backgroundImage='none';$('slideB').style.backgroundImage='none'}
   $('empty').classList.toggle('hidden',slides.length>0);updateCount();
  }
  schedule();
  $('status').textContent=slides.length===1?'사진 1장 · 고정 표시':slides.length+'장 · '+(slides.length?'자동 슬라이드쇼':'선택된 사진 없음');
 }catch(e){$('status').textContent='설정 확인 실패: '+e.message}
}
$('prev').onclick=()=>{next(-1);schedule()};$('next').onclick=()=>{next(1);schedule()};
$('toggle').onclick=()=>{playing=!playing;$('toggle').textContent=playing?'일시정지':'▶ 재생';schedule()};
$('reload').onclick=refresh;
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('status').textContent='전체화면은 브라우저에서 허용해야 합니다. F11 사용 가능.'}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();if(e.key==='f'||e.key==='F')$('full').click()});
refresh();setInterval(refresh,Math.max(10,CFG.refreshSeconds)*1000);
</script></body></html>
