 if(page.dataset.weatherSignature===sig)return;
 page.dataset.weatherSignature=sig;
 page.replaceChildren();
 const content=document.createElement('div');content.id='weatherContent';page.appendChild(content);
 const add=(cls,text)=>{const el=document.createElement('div');el.className=cls;el.textContent=text;content.appendChild(el)};
 if(config.weatherShowLocation!==false)add('wx-place',String(w.location||config.weatherCity||'날씨'));
 if(fields.includes('temp'))add('wx-main',mark+' '+vals.temp);else add('wx-main',mark);
 if(fields.includes('condition'))add('wx-condition',vals.condition);
 add('wx-extra',fields.filter(k=>!['temp','condition'].includes(k)).map(k=>vals[k]).join('    ·    '));
 add('wx-foot','WeatherAPI.com · '+(stale?'이전 정보 · ':'')+'갱신 '+date.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
 applyWeatherLayoutV43();
}
// V40: independent, single-endpoint JSONP transport. No overlapping requests.
// V34 weatherCheck is known to return a flat object with ok, temperature, condition and humidity.
function weatherPayloadValidV35(d){
 return !!(d && d.ok===true && d.temperature!==null && d.temperature!==undefined && d.temperature!=='' &&
   Number.isFinite(Number(d.temperature)) && typeof d.condition==='string' && d.condition.trim()!=='' &&
   d.humidity!==null && d.humidity!==undefined && d.humidity!=='' && Number.isFinite(Number(d.humidity)));
}
const WX_CACHE_KEY_V37='lcd_weather_v43';
let wxFailuresV36=0,wxLastDetailV36='',wxLastGoodAtV36=0;
let wxFlightV37=0,wxStartedV37=0,wxNextV37=0;
let wxRequestCountV40=0,wxLastResponseV40='대기',wxLastEndpointV40='';
function wxLogV36(text){
 wxLastDetailV36=String(text||'');
 if(window.wxDebugShowV40){
  const state=wxPending?'요청 중':'대기';
  const url=(typeof apiUrl==='function' ? apiUrl() : '');
  const host=url ? (function(){try{return new URL(url).hostname}catch(_){return '주소 오류'}})() : '주소 미설정';
  window.wxDebugShowV40('연결: '+host+' / '+state+'\n조회 횟수: '+wxRequestCountV40+' / 마지막 응답: '+wxLastResponseV40+'\n'+wxLastDetailV36);
 }
}
function wxAcceptV36(w){
 wxData=w;wxError='';wxFailuresV36=0;wxLastGoodAtV36=Date.now();
 wxLastResponseV40='성공 · '+String(w.temperature)+'°C';
 wxLogV36('정상 수신 · '+String(w.location||config.weatherCity||'Seoul')+' · '+String(w.condition));
 try{localStorage.setItem(WX_CACHE_KEY_V37,JSON.stringify({...w,queryCity:config.weatherCity||'Seoul',cachedAt:Date.now()}))}catch(_){}
}
function weatherJsonpV40(action,timeoutMs=12000){
 return new Promise((resolve,reject)=>{
  const callback='lcdWx40_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
  const script=document.createElement('script');let settled=false;
  let timer;
  function finish(error,data){
   if(settled)return;
   settled=true;clearTimeout(timer);
   try{delete window[callback]}catch(_){}
   script.remove();error?reject(error):resolve(data);
  }
  window[callback]=data=>finish(null,data);
  script.onerror=()=>finish(Error('JSONP 스크립트 로드 실패. 웹앱 배포 접근 권한(모든 사용자) 또는 서버 주소를 확인하세요.'));
  try{
   if(typeof apiUrl!=='function'||typeof apiReady!=='function'||!apiReady())throw Error('config.js의 LCD 웹앱 /exec 주소를 확인하세요.');
   const url=new URL(apiUrl());
   url.searchParams.set('action',action);
   url.searchParams.set('callback',callback);
   url.searchParams.set('_',String(Date.now()));
   wxLastEndpointV40=url.origin+url.pathname;
   timer=setTimeout(()=>finish(Error('날씨 서버 응답 시간 초과 ('+Math.round(timeoutMs/1000)+'초). 웹앱 접근 권한과 JSONP 응답을 확인하세요.')),timeoutMs);
   script.src=url.toString();document.head.appendChild(script);
  }catch(e){finish(e)}
 });
}
function weatherNeededV43(){return !!(config.weatherPageEnabled||(config.clockPageEnabled!==false&&config.weatherOnClock));}
function wxRefreshMsV42(){const n=Number(config.weatherRefreshMinutes);return ([5,10,15,30].includes(n)?n:15)*60000;}
async function refreshWeather(force=false){
 if(forceOffline||previewMode||!weatherNeededV43())return;
 if(wxPending)return;
 const now=Date.now();if(!force&&now<wxNextV37)return;
 wxPending=true;wxStartedV37=now;wxLast=now;wxRequestCountV40++;
 const flight=++wxFlightV37;
 wxLogV36('V43 weather 요청 시작 · '+(config.weatherCity||'Seoul'));
 if(!weatherPayloadValidV35(wxData)){wxError='날씨 서버에 연결 중…';renderWeather()}
 try{
  const result=await weatherJsonpV40('weather',12000);
  if(flight!==wxFlightV37)return;
  if(!weatherPayloadValidV35(result)){
   const detail=String(result&&result.error||result&&result.message||result&&result.stage||'필수 기온/날씨/습도 데이터 누락');
   throw Error('날씨 응답 오류: '+detail);
  }
  wxAcceptV36(result);
  wxNextV37=Date.now()+wxRefreshMsV42();
 }catch(e){
  if(flight!==wxFlightV37)return;
  wxFailuresV36++;
  wxNextV37=Date.now()+Math.min(120000,15000*wxFailuresV36);
  wxLastResponseV40='실패 '+wxFailuresV36+'회';
  const detail=String(e&&e.message||e);
  if(!weatherPayloadValidV35(wxData))wxError='날씨 조회 실패 · '+detail.slice(0,160);
  wxLogV36(detail);
 }finally{
  if(flight===wxFlightV37){
   wxPending=false;wxStartedV37=0;
   renderWeather();
   // Keep the last outcome visible. Do not replace it with a generic "checking" message.
   wxLogV36(wxLastDetailV36);
  }
 }
}
function wxRestoreCacheV37(){
 try{
  const d=JSON.parse(localStorage.getItem(WX_CACHE_KEY_V37)||'null');
  if(weatherPayloadValidV35(d)&&d.queryCity===(config.weatherCity||'Seoul')&&
     Number.isFinite(Number(d.cachedAt))&&Date.now()-Number(d.cachedAt)<6*3600000){
   wxData=d;wxLastGoodAtV36=Number(d.cachedAt);wxLast=Number(d.cachedAt);wxNextV37=Math.max(wxNextV37,Number(d.cachedAt)+wxRefreshMsV42());wxLastResponseV40='저장된 날씨 표시';renderWeather();
  }
 }catch(_){}
}
// Independent scheduler: runs even if configuration refresh is in progress.
setInterval(()=>{
 if(previewMode||forceOffline||!weatherNeededV43())return;
 if(wxPending&&wxStartedV37&&Date.now()-wxStartedV37>16000){
  wxFlightV37++;wxPending=false;wxStartedV37=0;
  wxNextV37=Date.now()+15000;
  wxLastResponseV40='시간 초과';
  if(!weatherPayloadValidV35(wxData))wxError='날씨 서버 응답 시간 초과 · 웹앱 공개 접근 권한을 확인하세요.';
  wxLogV36('16초 이상 응답 없음 · JSONP callback 미실행');renderWeather();
 }
 if(!wxPending&&Date.now()>=wxNextV37)refreshWeather();
},3000);
function renderBlocks(){
 const layer=$('messageBlocks');if(!layer)return;
 const blocks=Array.isArray(config.messageBlocks)?config.messageBlocks:[];
 const signature=JSON.stringify(blocks);
 if(layer.dataset.signature!==signature){
  layer.replaceChildren();
  for(const b of blocks){
   const el=document.createElement('div');el.className='lcd-block';el.textContent=String(b.text||'');
   el.style.left=(Number(b.x??50))+'%';el.style.top=(Number(b.y??50))+'%';
   el.style.width=Math.max(100,Math.min(1800,Number(b.width)||900))+'px';
   el.style.fontSize=Math.max(16,Math.min(300,Number(b.size)||100))+'px';
   el.style.fontFamily=fontValue(b.font);el.style.color=/^#[0-9a-f]{6}$/i.test(b.color||'')?b.color:'#ffdd55';
   el.style.textAlign=['left','center','right'].includes(b.align)?b.align:'center';el.style.fontWeight=b.bold?'800':'400';el.style.textDecoration=b.underline?'underline':'none';
   el.style.overflowWrap=b.wrap===false?'normal':'break-word';el.style.wordBreak='normal';
   layer.appendChild(el);
  }
  layer.dataset.signature=signature;
 }
 const scale=viewScale();
 for(let i=0;i<layer.children.length;i++){const el=layer.children[i],b=blocks[i];el.style.width=(Math.max(100,Math.min(1800,Number(b.width)||900))*scale)+'px';el.style.fontSize=(Math.max(16,Math.min(300,Number(b.size)||100))*scale)+'px';el.style.padding=(8*scale)+'px'}
 layer.style.backgroundColor=config.messageBackground||'#101827';
}
function updateBackground(){ $('bg').style.backgroundColor=config.clockBackgroundColor||'#17283b';if(config.clockBackgroundMode==='color'){$('bg').style.backgroundImage='none';return;} const path=String(config.background||DEFAULT.background);if(!/^images\/[\w가-힣 .-]+\.(jpg|jpeg|png|webp)$/i.test(path)||path.includes('..'))return;const url=path+'?v='+Date.now();const img=new Image();img.onload=()=>{$('bg').style.backgroundImage='url("'+url+'")';lastBg=url};img.src=url}
async function refresh(){
 if(previewMode&&previewOverride)return;
 if(syncRunning)return;
 syncRunning=true;
 try{
  if(forceOffline)throw Error('인터넷 장애 테스트 모드');
  if(!navigator.onLine)throw Error('오프라인');
  const c=await getRemote(12000);
  const signature=JSON.stringify(c);
  if(signature!==lastConfigSignature){
    apply(c);
    lastConfigSignature=signature;
    updateBackground();
  }
  lastSyncAt=Date.now();failCount=0;$('offline').classList.remove('visible');
  if(weatherNeededV43())setTimeout(()=>refreshWeather(),100);
  if(!firstReady){firstReady=true;clearTimeout(bootWatchdog);window.__lcdBootGuard?.ready()}
  if(!new URLSearchParams(location.search).has('debug'))$('status').textContent='';
 }catch(e){failCount++;$('status').textContent='서버 동기화 오류: '+e.message;if(window.wxDebugShowV40)window.wxDebugShowV40('설정 서버 통신 오류: '+e.message);
 if(forceOffline||!navigator.onLine||failCount>=1){$('offline').classList.add('visible');$('offlineHint').textContent=forceOffline?'테스트 모드 · 주소에서 ?testOffline=1 을 제거하면 정상 화면으로 돌아갑니다.':'네트워크 연결을 자동으로 다시 확인합니다.';if(!firstReady){firstReady=true;clearTimeout(bootWatchdog);window.__lcdBootGuard?.fail('설정 서버 통신 실패: '+e.message)}}
 else if(!firstReady){$('boot').querySelector('div:last-child').textContent='서버에 다시 연결하고 있습니다...'}
 }
 finally{syncRunning=false}
}
// PC 절전 복귀, 탭 전환, 네트워크 복구 시 즉시 동기화
function resumeSync(){if(Date.now()-lastSyncAt>1500)refresh()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeSync()});
window.addEventListener('focus',resumeSync);
window.addEventListener('pageshow',resumeSync);
window.addEventListener('online',resumeSync);
// LCD 전체화면 제어: 화면 클릭, ESC로 해제; F11은 브라우저에서 처리
let fullscreenStartedAt=0;
let exitingFullscreen=false;
async function leaveFullscreen(){
 if(!document.fullscreenElement||exitingFullscreen)return;
 exitingFullscreen=true;
 try{await document.exitFullscreen()}catch(err){console.warn('전체화면 해제 실패',err)}
 finally{exitingFullscreen=false}
}
$('full').onclick=async()=>{
 try{
  if(document.fullscreenElement){await leaveFullscreen();return}
  await document.documentElement.requestFullscreen();
 }catch(e){$('status').textContent='전체화면 실행 제한: F11을 이용하세요.'}
};
$('exitFull').onclick=leaveFullscreen;
document.addEventListener('fullscreenchange',()=>{
 fullscreenStartedAt=document.fullscreenElement?Date.now():0;

 $('full').textContent='⛶ 전체화면';
 $('exitFull').style.display='none';
});
// 전체화면에서는 화면의 빈 곳이나 시계/문자를 클릭하면 해제합니다.
// 전체화면 진입 버튼 클릭 이벤트가 전파되어 즉시 해제되는 것은 방지합니다.
document.addEventListener('click',e=>{
 if(!document.fullscreenElement)return;
 if(e.target.closest('#full, #exitFull'))return;
 if(Date.now()-fullscreenStartedAt<500)return;

});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&document.fullscreenElement){leaveFullscreen();return}
 // 브라우저의 F11 모드는 브라우저가 직접 전환합니다.
 // 브라우저 F11은 다시 F11로 전환합니다.
 // F11은 브라우저 기본 동작에 맡깁니다. 웹페이지가 F11 모드를 강제로 제어할 수 없습니다.
});
// Start with an opaque loading layer. If external API never responds, never leave the LCD stuck on loading.
bootWatchdog=setTimeout(()=>{

 firstReady=true;
 $('offline').classList.add('visible');
 $('offlineHint').textContent='설정 서버 응답이 지연되고 있습니다. 자동으로 재연결을 시도합니다.';

},14000);
setInterval(()=>{if(firstReady){draw();renderScreen()}},500);
if(previewMode){
 window.addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data||e.data.kind!=='lcd-preview-config')return;

  apply({...DEFAULT,clockPageEnabled:false,messageEnabled:false,weatherPageEnabled:true,weatherOnClock:true,weatherCity:'Seoul'});
