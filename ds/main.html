<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>실시간 디지털 사이니지</title><style>
:root{color-scheme:dark;--fade:1100ms}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080f1e;color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif}.stage{position:fixed;inset:0;overflow:hidden}.slide{position:absolute;inset:0;background-position:center;background-size:contain;background-repeat:no-repeat;opacity:0;transition:opacity var(--fade) ease}.slide.active{opacity:1}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 28%,transparent 72%,rgba(0,0,0,.45));pointer-events:none}.clock{position:absolute;top:clamp(20px,3vw,50px);right:clamp(20px,4vw,65px);text-align:right;text-shadow:0 2px 18px #000b;pointer-events:none}.time{font-size:clamp(42px,7vw,112px);font-weight:800;letter-spacing:.025em;font-variant-numeric:tabular-nums;line-height:1.05}.date{font-size:clamp(17px,2.1vw,32px);font-weight:600;margin-top:9px}.status{position:absolute;left:28px;bottom:20px;font-size:13px;color:#fff9;text-shadow:0 1px 5px #000}.toolbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:9px;background:#0b1222bb;border:1px solid #ffffff33;border-radius:15px;opacity:0;transition:opacity .2s;backdrop-filter:blur(10px)}.stage:hover .toolbar,.toolbar:focus-within,.toolbar.visible{opacity:1}button{background:#ffffff20;border:1px solid #ffffff30;color:white;padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:700}button:hover{background:#ffffff38}.counter{min-width:65px;text-align:center;font-size:13px}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;line-height:1.8;color:#dbeafe;font-size:clamp(18px,2vw,28px)}.hidden{display:none!important}.notice{position:absolute;left:20px;top:20px;background:#09162bc9;padding:10px 15px;border-radius:10px;font-size:12px;color:#fff9;max-width:35vw}@media(pointer:coarse){.toolbar{opacity:1;bottom:14px}.status{bottom:90px}.clock{right:20px;top:25px}}
</style></head><body><main class="stage" id="stage"><div id="a" class="slide active"></div><div id="b" class="slide"></div><div class="shade"></div><div class="clock"><div class="time" id="time">--:--:--</div><div class="date" id="date">날짜 불러오는 중</div></div><div class="empty" id="empty">images 폴더에 JPG 파일을 업로드하면<br>자동으로 슬라이드쇼가 시작됩니다.</div><div class="notice" id="notice">GitHub 저장소 설정을 확인하세요.</div><div class="status" id="status">이미지 확인 중…</div><nav class="toolbar" aria-label="슬라이드 제어"><button id="prev" title="이전">◀</button><button id="play" title="일시정지">일시정지</button><button id="next" title="다음">▶</button><span class="counter" id="counter">0 / 0</span><button id="reload" title="목록 갱신">새로고침</button><button id="full" title="전체화면">⛶ 전체화면</button></nav></main>
<script>
/* ===== 이 부분만 변경 ===== */
const CONFIG={
  githubOwner:'YOUR_GITHUB_ID', // GitHub 사용자명
  githubRepo:'YOUR_REPOSITORY', // 저장소 이름
  branch:'main',                // main 또는 master
  imageFolder:'images',         // JPG 업로드 폴더
  slideSeconds:10,              // 이미지별 표시 시간
  fadeMs:1100,                  // 페이드 시간
  refreshSeconds:30,            // 새 이미지 확인 주기
  imageFit:'contain',           // contain=전체 표시, cover=화면 꽉 채움
  timeZone:'Asia/Seoul',
  showSeconds:true
};
/* ======================= */
const $=id=>document.getElementById(id);
let slides=[],index=0,front='a',playing=true,timer=null,transitioning=false;
document.documentElement.style.setProperty('--fade',CONFIG.fadeMs+'ms');
$('a').style.backgroundSize=$('b').style.backgroundSize=CONFIG.imageFit;
function tick(){const now=new Date();$('time').textContent=new Intl.DateTimeFormat('ko-KR',{timeZone:CONFIG.timeZone,hour:'2-digit',minute:'2-digit',second:CONFIG.showSeconds?'2-digit':undefined,hour12:false}).format(now);$('date').textContent=new Intl.DateTimeFormat('ko-KR',{timeZone:CONFIG.timeZone,year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(now)}tick();setInterval(tick,1000);
const configured=CONFIG.githubOwner!=='YOUR_GITHUB_ID'&&CONFIG.githubRepo!=='YOUR_REPOSITORY';
$('notice').classList.toggle('hidden',configured);
function rawUrl(name){return 'https://raw.githubusercontent.com/'+encodeURIComponent(CONFIG.githubOwner)+'/'+encodeURIComponent(CONFIG.githubRepo)+'/'+encodeURIComponent(CONFIG.branch)+'/'+CONFIG.imageFolder.split('/').map(encodeURIComponent).join('/')+'/'+name.split('/').map(encodeURIComponent).join('/')}
function showStatus(msg){$('status').textContent=msg}
function paintFirst(){if(!slides.length)return;$('a').style.backgroundImage='url("'+slides[index].url+'")';$('a').classList.add('active');$('b').classList.remove('active');front='a';$('empty').classList.add('hidden');updateCounter()}
function updateCounter(){$('counter').textContent=slides.length?(index+1)+' / '+slides.length:'0 / 0'}
function preload(url){return new Promise(resolve=>{const im=new Image();im.onload=()=>resolve(true);im.onerror=()=>resolve(false);im.src=url})}
async function goTo(n){if(transitioning||!slides.length)return;if(slides.length===1){index=0;updateCounter();return}transitioning=true;index=(n+slides.length)%slides.length;const back=front==='a'?'b':'a';const incoming=$(back),outgoing=$(front);const ok=await preload(slides[index].url);if(!ok){showStatus('이미지를 불러오지 못했습니다: '+slides[index].name);transitioning=false;return}incoming.style.backgroundImage='url("'+slides[index].url+'")';incoming.classList.add('active');outgoing.classList.remove('active');front=back;updateCounter();setTimeout(()=>{transitioning=false},CONFIG.fadeMs+80)}
function schedule(){clearInterval(timer);if(playing)timer=setInterval(()=>{if(slides.length>1)goTo(index+1)},Math.max(2,CONFIG.slideSeconds)*1000)}
async function refreshSlides(){if(!configured){showStatus('HTML CONFIG에 GitHub 사용자명과 저장소명을 입력하세요.');return}try{const endpoint='https://api.github.com/repos/'+encodeURIComponent(CONFIG.githubOwner)+'/'+encodeURIComponent(CONFIG.githubRepo)+'/contents/'+CONFIG.imageFolder.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(CONFIG.branch);const r=await fetch(endpoint,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub API HTTP '+r.status);const list=await r.json();if(!Array.isArray(list))throw Error('images 폴더 목록 형식 오류');const files=list.filter(x=>x.type==='file'&&/\.(jpe?g|png|webp|gif)$/i.test(x.name)).sort((a,b)=>a.name.localeCompare(b.name,'ko',{numeric:true}));const next=files.map(x=>({name:x.name,sha:x.sha,url:rawUrl(x.name)+'?v='+encodeURIComponent(x.sha)}));const signature=JSON.stringify(next.map(x=>x.name+':'+x.sha));const oldSignature=JSON.stringify(slides.map(x=>x.name+':'+x.sha));if(signature!==oldSignature){const currentName=slides[index]?.name;slides=next;const found=slides.findIndex(x=>x.name===currentName);index=found>=0?found:0;if(slides.length){if(!await preload(slides[index].url))throw Error('이미지 파일 로딩 실패');paintFirst();schedule()}else{$('empty').classList.remove('hidden');$('a').style.backgroundImage='none';$('b').style.backgroundImage='none'}showStatus('이미지 '+slides.length+'장 · 변경사항 반영 '+new Date().toLocaleTimeString('ko-KR'))}else{showStatus('이미지 '+slides.length+'장 · 확인 '+new Date().toLocaleTimeString('ko-KR'))}updateCounter()}catch(err){showStatus('자동 갱신 실패: '+err.message+' (공개 저장소/설정 확인)')}}
$('prev').onclick=()=>{goTo(index-1);schedule()};$('next').onclick=()=>{goTo(index+1);schedule()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'일시정지':'▶ 재생';schedule()};$('reload').onclick=refreshSlides;
$('full').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else{await document.documentElement.requestFullscreen()}}catch(err){showStatus('전체화면은 브라우저에서 허용해야 합니다. F11도 사용 가능합니다.')}};
document.addEventListener('fullscreenchange',()=>$('full').textContent=document.fullscreenElement?'⛶ 전체화면 종료':'⛶ 전체화면');
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){goTo(index+1);schedule()}if(e.key==='ArrowLeft'){goTo(index-1);schedule()}if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='f'||e.key==='F')$('full').click()});
refreshSlides();schedule();setInterval(refreshSlides,Math.max(10,CONFIG.refreshSeconds)*1000);
</script></body></html>
