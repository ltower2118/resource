<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCD 시계</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#17283b;color:#fff;font-family:Arial,'Malgun Gothic',sans-serif}#bg,#shade{position:fixed;inset:0}#bg{background-size:cover;background-position:center}#shade{background:#000;pointer-events:none}#time{position:fixed;max-width:98vw;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;font-weight:800;text-shadow:0 2px 16px #000a;font-variant-numeric:tabular-nums}#date{position:fixed;max-width:98vw;white-space:nowrap;font-weight:700;text-shadow:0 2px 12px #000a}.center{top:66%;left:50%;transform:translate(-50%,-50%)}.top-left{top:4%;left:3%}.top-right{top:4%;right:3%}.bottom-left{bottom:4%;left:3%}.bottom-right{bottom:4%;right:3%}#full{position:fixed;bottom:14px;right:14px;padding:10px;color:#fff;background:#0009;border:1px solid #fff8;border-radius:9px;opacity:0;cursor:pointer}body:hover #full,#full:focus{opacity:1}#exitFull{position:fixed;top:12px;right:12px;padding:10px 14px;background:#000b;color:white;border:1px solid #fff8;border-radius:8px;cursor:pointer;z-index:99;display:none}body:fullscreen #full,body:fullscreen #exitFull,body:fullscreen #status{display:none!important}html:fullscreen #full,html:fullscreen #exitFull,html:fullscreen #status{display:none!important}#messageScreen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:5vw;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.35;font-weight:800;z-index:10}
#messageScreen.active{display:flex}#status{position:fixed;bottom:12px;left:12px;font-size:12px;color:#fff9}
</style></head><body><div id="bg"></div><div id="shade"></div><div id="time"></div><div id="date"></div><div id="messageScreen" aria-live="polite"></div><div id="status"></div><button id="full">⛶ 전체화면</button><button id="exitFull" type="button" aria-label="전체화면 종료">× 종료</button><script src="config.js"></script><script src="shared.js"></script><script>
const $=id=>document.getElementById(id);let config={...DEFAULT};let lastBg='';let screenStarted=Date.now();let screenType='clock';let cycleKey='';let lastConfigSignature='';
function draw(){const p=nowParts();$('time').textContent=fmtTime(config,p);$('date').textContent=fmtDate(config,p)}
function apply(c){config={...DEFAULT,...c};$('time').style.display=config.showTime?'block':'none';$('date').style.display=config.showDate?'block':'none';$('time').style.fontSize='min('+Math.max(24,Math.min(260,Number(config.timeSize)||112))+'px, 19vw)';$('date').style.fontSize=Math.max(16,Math.min(110,Number(config.dateSize)||34))+'px';$('time').style.fontFamily=fontValue(config.timeFont);$('date').style.fontFamily=fontValue(config.dateFont);$('time').style.color=config.timeColor;$('date').style.color=config.dateColor;$('date').className=config.datePosition;$('shade').style.opacity=Number(config.overlay)/100;screenStarted=Date.now();renderScreen();draw()}
function renderScreen(){
 const m=$('messageScreen');const enabled=!!config.messageEnabled&&String(config.messageText||'').trim().length>0;
 if(!enabled){screenType='clock';m.classList.remove('active');return}
 const clockMs=Math.max(5,Number(config.clockSeconds)||60)*1000;
 const messageMs=Math.max(3,Number(config.messageSeconds)||15)*1000;
 const elapsed=Date.now()-screenStarted;
 const next=(elapsed%(clockMs+messageMs))<clockMs?'clock':'message';
 screenType=next;m.classList.toggle('active',next==='message');
 if(new URLSearchParams(location.search).has('debug'))$('status').textContent='교대 '+next+' / '+Math.floor(elapsed/1000)+'초 / '+Math.floor(clockMs/1000)+'+'+Math.floor(messageMs/1000)+'초';
 m.textContent=String(config.messageText||'').slice(0,500);
 m.style.fontSize='min('+Math.max(24,Math.min(240,Number(config.messageSize)||100))+'px, 12vw)';
 m.style.color=config.messageColor||'#ffdd55';m.style.backgroundColor=config.messageBackground||'#101827';
 m.style.fontFamily=fontValue(config.messageFont);
}
function updateBackground(){const path=String(config.background||DEFAULT.background);if(!/^images\/[\w가-힣 .-]+\.(jpg|jpeg|png|webp)$/i.test(path)||path.includes('..'))return;const url=path+'?v='+Date.now();const img=new Image();img.onload=()=>{$('bg').style.backgroundImage='url("'+url+'")';lastBg=url};img.src=url}
async function refresh(){try{const c=await getRemote();const signature=JSON.stringify(c);
if(signature!==lastConfigSignature){apply(c);lastConfigSignature=signature}
updateBackground();if(!new URLSearchParams(location.search).has('debug'))$('status').textContent=''}catch(e){$('status').textContent=e.message+' · 이전 화면 유지'}}
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('status').textContent='전체화면 실행 제한: F11을 이용하세요.'}};
$('exitFull').onclick=async()=>{if(document.fullscreenElement)await document.exitFullscreen()};
document.addEventListener('fullscreenchange',()=>{$('full').textContent='⛶ 전체화면';$('exitFull').style.display='none'});
// ESC 종료는 브라우저 기본 전체화면 해제 동작을 사용합니다.
apply(config);setInterval(()=>{draw();renderScreen()},500);refresh();setInterval(refresh,15000);
</script></body></html>
