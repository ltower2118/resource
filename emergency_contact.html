<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>서울숲엘타워</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; }
        body { background-color: #ffffff; margin: 0; padding: 16px; color: #334155; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 430px; padding: 0 6px 24px 6px; }
        
        /* 상단 네비게이션 바 */
        .top-nav-bar { width: 100%; max-width: 430px; display: flex; align-items: center; justify-content: center; position: relative; padding: 16px 0; margin-top: 5px; border-bottom: 2px solid #334155; margin-bottom: 20px; }
        .btn-back-left { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background-color: transparent; border: none; font-size: 1.2rem; cursor: pointer; text-decoration: none; }
        .page-title { font-size: 1.2rem; font-weight: 800; color: #1e3a8a; margin: 0; }

        /* 테이블 감싸는 박스 - 스크롤 제거 */
        .table-wrap { width: 100%; max-width: 430px; overflow: hidden; margin-bottom: 20px; }

        /* 그리드 테이블 */
        .grid-table { 
            width: 100%; 
            border-collapse: collapse; 
            border: none;
            background-color: #ffffff;
            table-layout: auto;
        }

        /* 제목칸 스타일 */
        .grid-table th { 
            background-color: #1e3a8a; 
            color: #ffffff; 
            font-weight: bold; 
            font-size: 0.8rem; 
            padding: 10px 4px; 
            text-align: center; 
            border-bottom: 1px solid #334155;
            border-left: 1px solid #334155;
            border-right: 1px solid #334155;
            white-space: nowrap;
        }
        .grid-table th:first-child { border-left: none; }
        .grid-table th:last-child { border-right: none; }

        /* 데이터 칸 스타일 */
        .grid-table td { 
            padding: 10px 4px; 
            font-size: 0.8rem; 
            color: #0f172a; 
            text-align: center; 
            border-bottom: 1px solid #cbd5e1; 
            border-left: 1px solid #cbd5e1;
            border-right: 1px solid #cbd5e1;
            word-break: break-word;
            line-height: 1.3;
        }
        .grid-table td:first-child { border-left: none; }
        .grid-table td:last-child { border-right: none; }

        /* 가로 폭 비율 */
        .col-room { width: 12%; }    
        .col-company { width: 30%; } 
        .col-name { width: 8%; }    
        .col-tel1 { width: 14%; }    
        .col-tel2 { width: 36%; }   

        .tel-btn { color: #2563eb; text-decoration: none; font-weight: bold; display: block; }
        .grid-table tr:nth-child(even) { background-color: #f8fafc; }
        .footer { text-align: center; font-size: 0.72rem; color: #94a3b8; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="top-nav-bar">
        <a href="index.html" class="btn-back-left">⬅️</a>
        <h1 class="page-title">📞 입주사 비상연락망</h1>
    </div>
    
    <div class="table-wrap">
        <table class="grid-table">
            <colgroup>
                <col class="col-room">
                <col class="col-company">
                <col class="col-name">
                <col class="col-tel1">
                <col class="col-tel2">
            </colgroup>
            
            <thead>
                <tr>
                    <th>호실</th>
                    <th>업체명</th>
                    <th>정/부</th>
                    <th>담당자</th>
                    <th>휴대폰</th>
                </tr>
            </thead>
            <tbody id="excel-data-body">
                <tr>
                    <td colspan="5" style="padding: 30px; color: #94a3b8;">잠시만 기다려주세요 .<b>데이터 로딩 중...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <p class="footer">Made by AI & Ha You Sin</p>
</div>

<script>
    // 💡 [수정 포인트] 과장님이 깃허브에 올리신 CSV 파일명과 똑같이 적어주세요!
   const csvFileName = 'emergency_contact.csv'; 
 async function loadGridTable() {
        try {
            // GitHub Raw 파일 URL 사용 (상대경로 대신)
            const response = await fetch(`https://raw.githubusercontent.com/ltower2118/resource/main/${csvFileName}`);
            
            if (!response.ok) {
                throw new Error(`파일을 찾을 수 없습니다. (상태: ${response.status})`);
            }

            const blob = await response.blob();
            const decoder = new TextDecoder('euc-kr');
            const buffer = await blob.arrayBuffer();
            const csvText = decoder.decode(buffer);
            
            const rows = csvText.split(/\r?\n/);
            let tableHTML = '';
            let dataCount = 0;

            rows.forEach((row, index) => {
                // 첫 줄(헤더) 스킵, 빈 줄 스킵
                if (index === 0 || !row.trim()) return; 

                const cells = row.split(',');
                
                if (cells.length >= 5) {
                    const room = cells[0].trim();
                    const company = cells[1].trim();
                    const manager = cells[2].trim();
                    const tel1 = cells[3].trim(); 
                    const tel2 = cells[4].trim(); 

                    tableHTML += `
                        <tr>
                            <td>${room}</td>
                            <td style="text-align: left; padding-left: 4px; font-weight: 500;">${company}</td>
                            <td>${manager}</td>
                            <td>${tel1}</td>
                            <td><a href="tel:${tel2}" class="tel-btn">${tel2 || '-'}</a></td>
                        </tr>
                    `;
                    dataCount++;
                }
            });

            if (dataCount === 0) {
                tableHTML = '<tr><td colspan="5" style="color: #94a3b8; padding: 20px;">📭 데이터가 없습니다.</td></tr>';
            }

            document.getElementById('excel-data-body').innerHTML = tableHTML;

        } catch (error) {
            console.error('CSV 로드 실패:', error);
            document.getElementById('excel-data-body').innerHTML = `
                <tr>
                    <td colspan="5" class="error-message">
                        ❌ 데이터 로드 실패<br>
                        <small>${error.message}</small>
                    </td>
                </tr>
            `;
        }
    }

    window.onload = loadGridTable;
</script>
</body>
</html>
