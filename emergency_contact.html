<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>서울숲엘타워</title>
    <style>
        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { background-color: #ffffff; padding: 0; margin: 0; color: #0f172a; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 430px; padding: 0 6px 24px 6px; } 
        
        /* 상단 네비게이션 바 */
        .top-nav-bar { width: 100%; display: flex; align-items: center; justify-content: center; position: relative; padding: 16px 0; margin-top: 5px; border-bottom: 2px solid #334155; margin-bottom: 16px; }
        .btn-back-left { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background-color: transparent; border: none; cursor: pointer; font-size: 1.2rem; }
        .page-title { font-size: 1.15rem; font-weight: 800; color: #1e3a8a; margin: 0; }
        .table-wrap { width: 100%; overflow: hidden; }
        /* 💡 1. 여기 구역이 바깥 테두리(border)를 없앤 구역입니다 */
        .grid-table { 
            width: 100%; 
            border-collapse: collapse; 
            border: none; /* 외곽 큰 사각형 선 제거 */
            background-color: #ffffff; 
            table-layout: fixed; 
        }
        /* 💡 2. 제목칸의 양쪽 끝 세로선을 제거하는 스타일 */
        .grid-table th { 
            background-color: #1e3a8a; 
            color: #ffffff; 
            font-weight: bold; 
            font-size: 0.8rem; 
            padding: 10px 2px; 
            text-align: center; 
            border-bottom: 1px solid #334155; 
            border-left: 1px solid #334155;
            border-right: 1px solid #334155;
        }
        .grid-table th:first-child { border-left: none; } /* 맨 왼쪽 세로선 제거 */
        .grid-table th:last-child { border-right: none; }  /* 맨 오른쪽 세로선 제거 */
        /* 💡 3. 데이터 내용칸의 양쪽 끝 세로선을 제거하는 스타일 */
        .grid-table td { 
            padding: 10px 2px; 
            font-size: 0.75rem; 
            color: #0f172a; 
            text-align: center; 
            border-bottom: 1px solid #cbd5e1; 
            border-left: 1px solid #cbd5e1;   
            border-right: 1px solid #cbd5e1;  
            overflow: hidden; 
            text-overflow: ellipsis; 
            word-break: break-all; 
        }
        .grid-table td:first-child { border-left: none; } /* 맨 왼쪽 세로선 제거 */
        .grid-table td:last-child { border-right: none; }  /* 맨 오른쪽 세로선 제거 */
        /* 가로 폭 비율 고정 */
        .col-room { width: 14%; }    
        .col-company { width: 26%; } 
        .col-name { width: 18%; }    
        .col-tel1 { width: 21%; }    
        .col-tel2 { width: 21%; }    
        .tel-btn { color: #2563eb; text-decoration: none; font-weight: bold; display: block; }
        .grid-table tr:nth-child(even) { background-color: #f8fafc; }
        .footer { text-align: center; font-size: 0.72rem; color: #94a3b8; margin-top: 30px; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-nav-bar">
        <a href="index.html" class="btn-back-left">⬅️</a>
        <h1 class="page-title">📞 입주사 긴급비상 연락망</h1>
    </div>
    
    <div class="table-wrap">
        <table class="grid-table">
            <colgroup>
                <col class="col-room">
                <col class="col-company">
                <col class="col-name">
                <col class="col-tel1">
                <col class="col-tel2">
            </colgroup>
            
            <thead>
                <tr>
                    <th>호실</th>
                    <th>업체명</th>
                    <th>정/부</th>
                    <th>담당자</th>
                    <th>휴대폰</th>
                </tr>
            </thead>
            <tbody id="excel-data-body">
                <tr>
                    <td colspan="5" style="padding: 30px; color: #94a3b8;">잠시만 기다려 주세요 <br>데이터 로딩 중...</td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="footer">Built by AI & Ha Yu-sin</p>
</div>
<script>
    const csvFileName = 'emergency_contact.csv'; 

    async function loadGridTable() {
        try {
            // 1. CSV 파일을 날것(바이너리) 데이터로 가져옵니다.
            const response = await fetch('./' + csvFileName);
            if (!response.ok) throw new Error('파일을 찾을 수 없습니다.');

            const buffer = await response.arrayBuffer();
            
            // 2. 💡 [한글 깨짐 해결 핵심] 
            // 파일의 앞부분(BOM)을 체크하여 UTF-8인지 ANSI(EUC-KR)인지 자동으로 판별합니다.
            const arr = new Uint8Array(buffer);
            let encoding = 'euc-kr'; // 기본값은 엑셀 일반 CSV 형식(ANSI)
            
            if (arr.length >= 3 && arr[0] === 0xEF && arr[1] === 0xBB && arr[2] === 0xBF) {
                encoding = 'utf-8'; // UTF-8 변환 파일일 경우
            }

            // 3. 판별된 인코딩 번역기를 물려 글자를 깨짐 없이 읽어옵니다.
            const decoder = new TextDecoder(encoding);
            const csvText = decoder.decode(buffer);
            
            // 4. 줄바꿈 처리 및 표 그리기
            const rows = csvText.split(/\r?\n/);
            let tableHTML = '';

            rows.forEach((row, index) => {
                if (index === 0 || !row.trim()) return; // 첫 줄 제목행 패스

                const cells = row.split(',');
                
                if (cells.length >= 4) {
                    const room = cells[0].trim();
                    const company = cells[1].trim();
                    const manager = cells[2].trim();
                    const phone = cells[3].trim();

                    tableHTML += `
                        <tr>
                            <td>${room}</td>
                            <td style="text-align: left; padding-left: 6px; font-weight: 500;">${company}</td>
                            <td>${manager}</td>
                            <td><a href="tel:${phone}" class="tel-btn">${phone}</a></td>
                        </tr>
                    `;
                }
            });

            document.getElementById('excel-data-body').innerHTML = tableHTML || '<tr><td colspan="4">데이터가 없습니다.</td></tr>';
        } catch (error) {
            console.error(error);
            document.getElementById('excel-data-body').innerHTML = `<tr><td colspan="4" style="color:red; padding:20px;">❌ 로드 실패 (${error.message})</td></tr>`;
        }
    }

    window.onload = loadGridTable;
</script>
