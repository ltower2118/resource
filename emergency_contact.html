<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>서울숲엘타워2</title>
    <style>
        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { background-color: #ffffff; padding: 0; margin: 0; color: #0f172a; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 430px; padding: 0 6px 24px 6px; } 
        
        /* 상단 네비게이션 바 */
        .top-nav-bar { width: 100%; display: flex; align-items: center; justify-content: center; position: relative; padding: 16px 0; margin-top: 5px; border-bottom: 2px solid #334155; margin-bottom: 15px; }
        .btn-back-left { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background-color: #f1f5f9; border-radius: 50%; text-decoration: none; color: #334155; font-size: 1.1rem; font-weight: bold; }
        .page-title { font-size: 1.15rem; font-weight: 800; color: #1e3a8a; margin: 0; }

        .table-wrap { width: 100%; overflow: hidden; }

        /* 💡 1. 여기 구역이 바깥 테두리(border)를 없앤 구역입니다 */
        .grid-table { 
            width: 100%; 
            border-collapse: collapse; 
            border: none; /* 외곽 큰 사각형 선 제거 */
            background-color: #ffffff; 
            table-layout: fixed; 
        }

        /* 💡 2. 제목칸의 양쪽 끝 세로선을 제거하는 스타일 */
        .grid-table th { 
            background-color: #1e3a8a; 
            color: #ffffff; 
            font-weight: bold; 
            font-size: 0.8rem; 
            padding: 10px 2px; 
            text-align: center; 
            border-bottom: 1px solid #334155; 
            border-left: 1px solid #334155;
            border-right: 1px solid #334155;
        }
        .grid-table th:first-child { border-left: none; } /* 맨 왼쪽 세로선 제거 */
        .grid-table th:last-child { border-right: none; }  /* 맨 오른쪽 세로선 제거 */

        /* 💡 3. 데이터 내용칸의 양쪽 끝 세로선을 제거하는 스타일 */
        .grid-table td { 
            padding: 10px 2px; 
            font-size: 0.75rem; 
            color: #0f172a; 
            text-align: center; 
            border-bottom: 1px solid #cbd5e1; 
            border-left: 1px solid #cbd5e1;   
            border-right: 1px solid #cbd5e1;  
            overflow: hidden; 
            text-overflow: ellipsis; 
            word-break: break-all; 
        }
        .grid-table td:first-child { border-left: none; } /* 맨 왼쪽 세로선 제거 */
        .grid-table td:last-child { border-right: none; }  /* 맨 오른쪽 세로선 제거 */

        /* 가로 폭 비율 고정 */
        .col-room { width: 14%; }    
        .col-company { width: 26%; } 
        .col-name { width: 18%; }    
        .col-tel1 { width: 21%; }    
        .col-tel2 { width: 21%; }    

        .tel-btn { color: #2563eb; text-decoration: none; font-weight: bold; display: block; }
        .grid-table tr:nth-child(even) { background-color: #f8fafc; }
        .footer { text-align: center; font-size: 0.72rem; color: #94a3b8; margin-top: 30px; }
    </style>
</head>
<body>

<div class="container">

    <div class="top-nav-bar">
        <a href="index.html" class="btn-back-left">⬅️</a>
        <h1 class="page-title">📞 입주사 연락망</h1>
    </div>
    
    <div class="table-wrap">
        <table class="grid-table">
            <colgroup>
                <col class="col-room">
                <col class="col-company">
                <col class="col-name">
                <col class="col-tel1">
                <col class="col-tel2">
            </colgroup>
            
            <thead>
                <tr>
                    <th>호실</th>
                    <th>업체명</th>
                    <th>정/부</th>
                    <th>담당자</th>
                    <th>휴대폰</th>
                </tr>
            </thead>
            <tbody id="excel-data-body">
                <tr>
                    <td colspan="5" style="padding: 30px; color: #94a3b8;">데이터 로딩 중...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <p class="footer">Built by AI & Ha Yu-sin</p>
</div>


<script>
    const csvFileName = 'emergency_contact.csv'; 

    // 💡 개량된 전화번호 감지기: 텍스트 안에 숫자와 하이픈이 포함되어 있으면 무조건 감지합니다.
    function hasPhoneNumber(text) {
        const cleanText = text.replace(/[^0-9\-]/g, '');
        return cleanText.length >= 9; // 숫자가 9자리 이상이면 전화번호로 인정
    }

    // 💡 텍스트 내부에서 순수 전화번호(숫자와 하이픈)만 쏙 추출하는 함수
    function extractPhoneNumber(text) {
        return text.replace(/[^0-9\-]/g, '');
    }

    async function loadUniversalCSV() {
        try {
            const response = await fetch('./' + csvFileName);
            if (!response.ok) throw new Error('CSV 파일을 찾을 수 없습니다.');

            const buffer = await response.arrayBuffer();
            
            // 1. 인코딩 자동 감지 (한글 깨짐 차단)
            const arr = new Uint8Array(buffer);
            let encoding = 'euc-kr'; 
            if (arr.length >= 3 && arr[0] === 0xEF && arr[1] === 0xBB && arr[2] === 0xBF) {
                encoding = 'utf-8';
            }

            const decoder = new TextDecoder(encoding);
            const csvText = decoder.decode(buffer);
            
            // 2. 줄바꿈 기준 분리
            const rows = csvText.split(/\r?\n/);
            
            let headHTML = '<tr>';
            let bodyHTML = '';
            let maxColumns = 0;

            rows.forEach((row, rowIndex) => {
                if (!row.trim()) return; // 빈 줄 패스

                const cells = row.split(',');
                
                // 첫 번째 행: 무조건 제목칸(th) 매칭
                if (rowIndex === 0) {
                    maxColumns = cells.length;
                    cells.forEach(cell => {
                        headHTML += `<th>${cell.trim()}</th>`;
                    });
                    headHTML += '</tr>';
                } 
                // 두 번째 행부터: 데이터칸(td) 조립
                else {
                    bodyHTML += '<tr>';
                    
                    // 💡 핵심 수정: 원래 첫 줄 열 개수(maxColumns)나 현재 행의 열 개수 중 더 큰 값만큼 끝까지 돌립니다.
                    // 이렇게 하면 엑셀 변환 오류로 칸이 뒤로 밀려도 데이터가 잘리지 않고 끝까지 화면에 출력됩니다.
                    const currentLength = Math.max(maxColumns, cells.length);
                    
                    for (let i = 0; i < currentLength; i++) {
                        const cellData = cells[i] ? cells[i].trim() : '';
                        
                        // 데이터가 아예 비어있다면 빈칸 처리
                        if (!cellData) {
                            bodyHTML += `<td>-</td>`;
                        } 
                        // 💡 만약 데이터 안에 전화번호 성격의 숫자가 포함되어 있다면
                        else if (hasPhoneNumber(cellData)) {
                            const purePhone = extractPhoneNumber(cellData);
                            // 글자 전체를 다 보여주되, 클릭 시 전화가 걸리도록 안전하게 매칭
                            bodyHTML += `<td><a href="tel:${purePhone}" class="tel-btn">${cellData}</a></td>`;
                        } 
                        // 일반 텍스트는 그대로 출력
                        else {
                            bodyHTML += `<td>${cellData}</td>`;
                        }
                    }
                    bodyHTML += '</tr>';
                }
            });

            // 3. 화면에 격자 반영
            document.getElementById('table-head').innerHTML = headHTML;
            document.getElementById('table-body').innerHTML = bodyHTML || `<tr><td colspan="${maxColumns}">데이터가 비어 있습니다.</td></tr>`;
            
        } catch (error) {
            console.error(error);
            document.getElementById('table-body').innerHTML = `<tr><td style="color:red; padding:20px;">❌ 로드 실패: ${error.message}</td></tr>`;
        }
    }

    window.onload = loadUniversalCSV;
</script>
