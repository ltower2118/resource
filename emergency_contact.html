<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>서울숲엘타워4</title>
    <style>
        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { background-color: #ffffff; padding: 0; margin: 0; color: #0f172a; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 430px; padding: 0 6px 24px 6px; } 
        
        /* 상단 네비게이션 바 */
        .top-nav-bar { width: 100%; display: flex; align-items: center; justify-content: center; position: relative; padding: 16px 0; margin-top: 5px; border-bottom: 2px solid #334155; margin-bottom: 15px; }
        .btn-back-left { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background-color: #f1f5f9; border-radius: 50%; text-decoration: none; color: #334155; font-size: 1.1rem; font-weight: bold; }
        .page-title { font-size: 1.15rem; font-weight: 800; color: #1e3a8a; margin: 0; }

        .table-wrap { width: 100%; overflow: hidden; }

        /* 💡 1. 여기 구역이 바깥 테두리(border)를 없앤 구역입니다 */
        .grid-table { 
            width: 100%; 
            border-collapse: collapse; 
            border: none; /* 외곽 큰 사각형 선 제거 */
            background-color: #ffffff; 
            table-layout: fixed; 
        }

        /* 💡 2. 제목칸의 양쪽 끝 세로선을 제거하는 스타일 */
        .grid-table th { 
            background-color: #1e3a8a; 
            color: #ffffff; 
            font-weight: bold; 
            font-size: 0.8rem; 
            padding: 10px 2px; 
            text-align: center; 
            border-bottom: 1px solid #334155; 
            border-left: 1px solid #334155;
            border-right: 1px solid #334155;
        }
        .grid-table th:first-child { border-left: none; } /* 맨 왼쪽 세로선 제거 */
        .grid-table th:last-child { border-right: none; }  /* 맨 오른쪽 세로선 제거 */

        /* 💡 3. 데이터 내용칸의 양쪽 끝 세로선을 제거하는 스타일 */
        .grid-table td { 
            padding: 10px 2px; 
            font-size: 0.75rem; 
            color: #0f172a; 
            text-align: center; 
            border-bottom: 1px solid #cbd5e1; 
            border-left: 1px solid #cbd5e1;   
            border-right: 1px solid #cbd5e1;  
            overflow: hidden; 
            text-overflow: ellipsis; 
            word-break: break-all; 
        }
        .grid-table td:first-child { border-left: none; } /* 맨 왼쪽 세로선 제거 */
        .grid-table td:last-child { border-right: none; }  /* 맨 오른쪽 세로선 제거 */

        /* 가로 폭 비율 고정 */
        .col-room { width: 14%; }    
        .col-company { width: 26%; } 
        .col-name { width: 10%; }    
        .col-tel1 { width: 20%; }    
        .col-tel2 { width: 30%; }    

        .tel-btn { color: #2563eb; text-decoration: none; font-weight: bold; display: block; }
        .grid-table tr:nth-child(even) { background-color: #f8fafc; }
        .footer { text-align: center; font-size: 0.72rem; color: #94a3b8; margin-top: 30px; }
    </style>
</head>
<body>

<div class="container">

    <div class="top-nav-bar">
        <a href="index.html" class="btn-back-left">⬅️</a>
        <h1 class="page-title">📞 입주사 연락망</h1>
    </div>
    
    <div class="table-wrap">
        <table class="grid-table">
            <colgroup>
                <col class="col-room">
                <col class="col-company">
                <col class="col-name">
                <col class="col-tel1">
                <col class="col-tel2">
            </colgroup>
            
            <thead>
                <tr>
                    <th>호실</th>
                    <th>업체명</th>
                    <th>정/부</th>
                    <th>담당자</th>
                    <th>휴대폰</th>
                </tr>
            </thead>
            <tbody id="excel-data-body">
                <tr>
                    <td colspan="5" style="padding: 30px; color: #94a3b8;">잠시만 기다려주세요 .<b>데이터 로딩 중...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <p class="footer">Made by AI & Ha Yu-sin</p>
</div>

<script>
    const csvFileName = 'emergency_contact.csv'; 

    async function loadGridTable() {
        try {
            const response = await fetch('./' + csvFileName);
            if (!response.ok) throw new Error('파일 확인 불가');

            const blob = await response.blob();
            const decoder = new TextDecoder('euc-kr');
            const buffer = await blob.arrayBuffer();
            const csvText = decoder.decode(buffer);
            
            const rows = csvText.split(/\r?\n/);
            let tableHTML = '';

            rows.forEach((row, index) => {
                if (index === 0 || !row.trim()) return; 

                const cells = row.split(',');
                
                if (cells.length >= 5) {
                    const room = cells[0].trim();
                    const company = cells[1].trim();
                    const manager = cells[2].trim();
                    const tel1 = cells[3].trim(); 
                    const tel2 = cells[4].trim(); 

                    tableHTML += `
                        <tr>
                            <td>${room}</td>
                            <td style="text-align: left; padding-left: 4px; font-weight: 500;">${company}</td>
                            <td>${manager}</td>
                            <td><a href="tel:${tel1}" class="tel-btn">${tel1 || '-'}</a></td>
                            <td><a href="tel:${tel2}" class="tel-btn">${tel2 || '-'}</a></td>
                        </tr>
                    `;
                }
            });

            document.getElementById('excel-data-body').innerHTML = tableHTML || '<tr><td colspan="5">데이터가 없습니다.</td></tr>';
        } catch (error) {
            console.error(error);
            document.getElementById('excel-data-body').innerHTML = '<tr><td colspan="5" style="color:red; padding:20px;">❌ 로드 실패</td></tr>';
        }
    }

    window.onload = loadGridTable;
</script>
