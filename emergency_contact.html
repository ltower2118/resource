<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>서울숲엘타워2</title>
    <style>
        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { background-color: #ffffff; padding: 0; margin: 0; color: #0f172a; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 430px; padding: 0 6px 24px 6px; } 
        
        /* 상단 네비게이션 바 */
        .top-nav-bar { width: 100%; display: flex; align-items: center; justify-content: center; position: relative; padding: 16px 0; margin-top: 5px; border-bottom: 2px solid #334155; margin-bottom: 15px; }
        .btn-back-left { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background-color: #f1f5f9; border-radius: 50%; text-decoration: none; color: #334155; font-size: 1.1rem; font-weight: bold; }
        .page-title { font-size: 1.15rem; font-weight: 800; color: #1e3a8a; margin: 0; }

        .table-wrap { width: 100%; overflow: hidden; }

        .grid-table { 
            width: 100%; 
            border-collapse: collapse; 
            border: none; 
            background-color: #ffffff; 
            table-layout: fixed; 
        }

        /* 제목칸 테두리 정돈 */
        .grid-table th { 
            background-color: #1e3a8a; 
            color: #ffffff; 
            font-weight: bold; 
            font-size: 0.8rem; 
            padding: 10px 2px; 
            text-align: center; 
            border-bottom: 1px solid #334155; 
            border-left: 1px solid #334155;
            border-right: 1px solid #334155;
        }
        .grid-table th:first-child { border-left: none; } 
        .grid-table th:last-child { border-right: none; } 

        /* 데이터 칸 테두리 정돈 */
        .grid-table td { 
            padding: 10px 2px; 
            font-size: 0.75rem; 
            color: #0f172a; 
            text-align: center; 
            border-bottom: 1px solid #cbd5e1; 
            border-left: 1px solid #cbd5e1;   
            border-right: 1px solid #cbd5e1;  
            overflow: hidden; 
            text-overflow: ellipsis; 
            word-break: break-all; 
        }
        .grid-table td:first-child { border-left: none; } 
        .grid-table td:last-child { border-right: none; } 

        /* 5개 열 기준 가로 폭 비율 고정 */
        .col-room { width: 14%; }    
        .col-company { width: 26%; } 
        .col-name { width: 18%; }    
        .col-tel1 { width: 21%; }    
        .col-tel2 { width: 21%; }    

        .tel-btn { color: #2563eb; text-decoration: none; font-weight: bold; display: block; }
        .grid-table tr:nth-child(even) { background-color: #f8fafc; }
        .footer { text-align: center; font-size: 0.72rem; color: #94a3b8; margin-top: 30px; }
    </style>
</head>
<body>

<div class="container">

    <div class="top-nav-bar">
        <a href="index.html" class="btn-back-left">⬅️</a>
        <h1 class="page-title">📞 입주사 연락망</h1>
    </div>
    
    <div class="table-wrap">
        <table class="grid-table">
            <colgroup>
                <col class="col-room">
                <col class="col-company">
                <col class="col-name">
                <col class="col-tel1">
                <col class="col-tel2">
            </colgroup>
            
            <thead id="table-head">
                <tr>
                    <th>호실</th>
                    <th>업체명</th>
                    <th>정/부</th>
                    <th>담당자</th>
                    <th>휴대폰</th>
                </tr>
            </thead>
            <tbody id="excel-data-body">
                <tr>
                    <td colspan="5" style="padding: 30px; color: #94a3b8;">데이터 로딩 중...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <p class="footer">Built by AI & Ha Yu-sin</p>
</div>

<script>
    // 💡 [수정] 파일명 확장자를 소문자(.csv) 안전 규격으로 맞췄습니다.
    const csvFileName = 'emergency_contact.csv'; 

    function hasPhoneNumber(text) {
        const cleanText = text.replace(/[^0-9\-]/g, '');
        return cleanText.length >= 9; 
    }

    function extractPhoneNumber(text) {
        return text.replace(/[^0-9\-]/g, '');
    }

    async function loadUniversalCSV() {
        try {
            // 💡 [수정] 현재 폴더 명시를 위해 ./ 경로를 동반하여 호출합니다.
            const response = await fetch('./' + csvFileName);
            if (!response.ok) throw new Error('CSV 파일을 찾을 수 없습니다. 대소문자를 확인해 주세요.');

            const buffer = await response.arrayBuffer();
            
            const arr = new Uint8Array(buffer);
            let encoding = 'euc-kr'; 
            if (arr.length >= 3 && arr[0] === 0xEF && arr[1] === 0xBB && arr[2] === 0xBF) {
                encoding = 'utf-8';
            }

            const decoder = new TextDecoder(encoding);
            const csvText = decoder.decode(buffer);
            
            const rows = csvText.split(/\r?\n/);
            
            let headHTML = '';
            let bodyHTML = '';
            let maxColumns = 5; // 고정된 레이아웃 기준 열 개수

            rows.forEach((row, rowIndex) => {
                if (!row.trim()) return; 

                const cells = row.split(',');
                
                // 첫 번째 행이 엑셀의 제목칸일 경우 타이틀 자동 매칭
                if (rowIndex === 0) {
                    maxColumns = cells.length;
                    headHTML += '<tr>';
                    cells.forEach(cell => {
                        headHTML += `<th>${cell.trim()}</th>`;
                    });
                    headHTML += '</tr>';
                } 
                // 데이터 내용 조립
                else {
                    bodyHTML += '<tr>';
                    for (let i = 0; i < maxColumns; i++) {
                        const cellData = cells[i] ? cells[i].trim() : '';
                        
                        if (!cellData) {
                            bodyHTML += `<td>-</td>`;
                        } 
                        else if (hasPhoneNumber(cellData)) {
                            const purePhone = extractPhoneNumber(cellData);
                            bodyHTML += `<td><a href="tel:${purePhone}" class="tel-btn">${cellData}</a></td>`;
                        } 
                        else {
                            bodyHTML += `<td>${cellData}</td>`;
                        }
                    }
                    bodyHTML += '</tr>';
                }
            });

            // 추출된 데이터가 정상적일 때만 헤더와 바디를 교체합니다.
            if (headHTML) {
                document.getElementById('table-head').innerHTML = headHTML;
            }
            document.getElementById('excel-data-body').innerHTML = bodyHTML || `<tr><td colspan="${maxColumns}">데이터가 비어 있습니다.</td></tr>`;
            
        } catch (error) {
            console.error(error);
            document.getElementById('excel-data-body').innerHTML = `<tr><td colspan="5" style="color:red; padding:20px; font-weight:bold;">❌ 로드 실패<br><span style="font-size:0.75rem; color:#94a3b8; font-weight:normal;">${error.message}</span></td></tr>`;
        }
    }

    window.onload = loadUniversalCSV;
</script>
</body>
</html>
