<script>
    const csvFileName = 'emergency_contact.csv'; 

    async function loadGridTable() {
        try {
            // 1. CSV 파일을 날것(바이너리) 데이터로 가져옵니다.
            const response = await fetch('./' + csvFileName);
            if (!response.ok) throw new Error('파일을 찾을 수 없습니다.');

            const buffer = await response.arrayBuffer();
            
            // 2. 💡 [한글 깨짐 해결 핵심] 
            // 파일의 앞부분(BOM)을 체크하여 UTF-8인지 ANSI(EUC-KR)인지 자동으로 판별합니다.
            const arr = new Uint8Array(buffer);
            let encoding = 'euc-kr'; // 기본값은 엑셀 일반 CSV 형식(ANSI)
            
            if (arr.length >= 3 && arr[0] === 0xEF && arr[1] === 0xBB && arr[2] === 0xBF) {
                encoding = 'utf-8'; // UTF-8 변환 파일일 경우
            }

            // 3. 판별된 인코딩 번역기를 물려 글자를 깨짐 없이 읽어옵니다.
            const decoder = new TextDecoder(encoding);
            const csvText = decoder.decode(buffer);
            
            // 4. 줄바꿈 처리 및 표 그리기
            const rows = csvText.split(/\r?\n/);
            let tableHTML = '';

            rows.forEach((row, index) => {
                if (index === 0 || !row.trim()) return; // 첫 줄 제목행 패스

                const cells = row.split(',');
                
                if (cells.length >= 4) {
                    const room = cells[0].trim();
                    const company = cells[1].trim();
                    const manager = cells[2].trim();
                    const phone = cells[3].trim();

                    tableHTML += `
                        <tr>
                            <td>${room}</td>
                            <td style="text-align: left; padding-left: 6px; font-weight: 500;">${company}</td>
                            <td>${manager}</td>
                            <td><a href="tel:${phone}" class="tel-btn">${phone}</a></td>
                        </tr>
                    `;
                }
            });

            document.getElementById('excel-data-body').innerHTML = tableHTML || '<tr><td colspan="4">데이터가 없습니다.</td></tr>';
        } catch (error) {
            console.error(error);
            document.getElementById('excel-data-body').innerHTML = `<tr><td colspan="4" style="color:red; padding:20px;">❌ 로드 실패 (${error.message})</td></tr>`;
        }
    }

    window.onload = loadGridTable;
</script>
