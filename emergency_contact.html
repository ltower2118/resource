<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입주사 긴급비상 연락망</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; }
        body { background-color: #ffffff; margin: 0; padding: 16px; color: #334155; }
        
        /* 테이블을 감싸는 박스 (모바일에서 화면이 작으면 가로 스크롤 생성) */
        .table-container { width: 100%; overflow-x: auto; margin-top: 20px; border: 1px solid #e2e8f0; border-radius: 8px; }
        
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; white-space: nowrap; }
        
        /* 첫 줄(제목칸) 배경색 파란색 톤으로 지정 */
        th { background-color: #1e3a8a; color: white; font-weight: bold; }
        /* 한 줄 건너 한 줄씩 음영을 주어 눈이 편하게 세팅 */
        tr:nth-child(even) { background-color: #f8fafc; }
        tr:hover { background-color: #f1f5f9; }
    </style>
</head>
<body>

    <h2 style="color: #1e3a8a; border-left: 4px solid #1e3a8a; padding-left: 8px; margin-bottom: 15px;">입주사 긴급비상 연락망</h2>

    <div class="table-container">
        <table id="excel-table">
            <tr>
                <td style="padding: 30px; color: #94a3b8;">데이터를 불러오는 중입니다...</td>
            </tr>
        </table>
    </div>

<script>
    // 💡 1. 파일명 대소문자 확인 (깃허브에 올린 파일명과 토씨 하나 틀리지 않게 똑같이 적어주세요)
    const csvFileName = 'emergency_contact.csv'; 

    async function loadCSV() {
        try {
            // 💡 경로 오류 방지를 위해 ./ 를 붙여 현재 폴더임을 명시합니다.
            const response = await fetch('./' + csvFileName);
            
            if (!response.ok) {
                throw new Error('파일을 찾을 수 없습니다. (에러코드: ' + response.status + ')');
            }

            const blob = await response.blob();
            const decoder = new TextDecoder('euc-kr');
            const buffer = await blob.arrayBuffer();
            const csvText = decoder.decode(buffer);
            
            // 💡 윈도우(\r\n)와 리눅스(\n) 줄바꿈 규격을 모두 호환하도록 수정
            const rows = csvText.split(/\r?\n/);
            let tableHTML = '';

            rows.forEach((row, index) => {
                if (!row.trim()) return; 
                
                const cells = row.split(',');
                tableHTML += '<tr>';
                cells.forEach(cell => {
                    tableHTML += index === 0 ? `<th>${cell.trim()}</th>` : `<td>${cell.trim()}</td>`;
                });
                tableHTML += '</tr>';
            });

            document.getElementById('excel-table').innerHTML = tableHTML;
        } catch (error) {
            console.error(error);
            document.getElementById('excel-table').innerHTML = `
                <tr><td style="color:red; padding:30px; font-weight:bold;">
                    ❌ CSV 파일을 불러오지 못했습니다.<br>
                    <span style="font-size:0.8rem; color:#64748b; font-weight:normal;">이유: ${error.message}</span>
                </td></tr>`;
        }
    }

    window.onload = loadCSV;
</script>

</body>
</html>
