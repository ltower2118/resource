<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시설점검 사진등록 · 보고서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2530;
    --paper:#F6F4EE;
    --steel:#6B7785;
    --amber:#E2A63B;
    --ok:#3F7D68;
    --issue:#C1443C;
    --line:#D9D4C7;
    --card:#FFFFFF;
    --hole:#F6F4EE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:720px;margin:0 auto;padding:0 0 80px;}

  /* ---------- Header / Nameplate ---------- */
  .nameplate{
    background:var(--ink);
    color:var(--paper);
    padding:22px 20px 20px;
    position:relative;
    overflow:hidden;
  }
  .nameplate::before{
    content:"";
    position:absolute;
    right:-40px;top:-40px;
    width:140px;height:140px;
    border:2px solid rgba(246,244,238,.08);
    border-radius:50%;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    color:var(--amber);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  .nameplate h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:.01em;
    margin:0 0 14px;
  }
  .np-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    position:relative;
    z-index:1;
  }
  .np-field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    color:rgba(246,244,238,.55);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .np-field input{
    width:100%;
    background:rgba(246,244,238,.08);
    border:1px solid rgba(246,244,238,.2);
    border-radius:4px;
    color:var(--paper);
    font-family:'Noto Sans KR',sans-serif;
    font-size:14px;
    padding:8px 9px;
  }
  .np-field input::placeholder{color:rgba(246,244,238,.35);}
  .np-field input:focus{outline:2px solid var(--amber);outline-offset:1px;}

  /* ---------- Add item form ---------- */
  .panel{
    background:var(--card);
    margin:16px 16px 0;
    border-radius:10px;
    border:1px solid var(--line);
    padding:16px;
  }
  .panel-title{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--steel);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel-title::before{
    content:"";
    width:4px;height:14px;
    background:var(--amber);
    display:inline-block;
    border-radius:2px;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field{margin-bottom:10px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--steel);
    margin-bottom:5px;
  }
  .field select,.field input[type=text],.field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:6px;
    padding:9px 10px;
    font-family:'Noto Sans KR',sans-serif;
    font-size:14px;
    color:var(--ink);
    background:#fff;
  }
  .field textarea{resize:vertical;min-height:54px;}
  .field select:focus,.field input:focus,.field textarea:focus{
    outline:none;border-color:var(--ink);
  }

  .status-toggle{display:flex;gap:8px;}
  .status-toggle button{
    flex:1;
    padding:9px 4px;
    border-radius:6px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'Noto Sans KR',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--steel);
    cursor:pointer;
  }
  .status-toggle button.active[data-status="정상"]{background:var(--ok);border-color:var(--ok);color:#fff;}
  .status-toggle button.active[data-status="주의"]{background:var(--amber);border-color:var(--amber);color:#fff;}
  .status-toggle button.active[data-status="이상"]{background:var(--issue);border-color:var(--issue);color:#fff;}

  .photo-input{
    border:1.5px dashed var(--line);
    border-radius:8px;
    padding:14px;
    text-align:center;
    color:var(--steel);
    font-size:13px;
    cursor:pointer;
    display:block;
  }
  .photo-input input{display:none;}
  .photo-preview{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
  }
  .photo-preview .thumb{
    position:relative;
    width:68px;height:68px;
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .photo-preview .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-preview .thumb button{
    position:absolute;top:2px;right:2px;
    width:18px;height:18px;
    border-radius:50%;
    border:none;
    background:rgba(28,37,48,.75);
    color:#fff;
    font-size:11px;
    line-height:18px;
    padding:0;
    cursor:pointer;
  }

  .add-btn{
    width:100%;
    margin-top:6px;
    padding:12px;
    border:none;
    border-radius:7px;
    background:var(--ink);
    color:var(--paper);
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.04em;
    cursor:pointer;
  }
  .add-btn:active{transform:translateY(1px);}

  /* ---------- Item list (tags) ---------- */
  .list-wrap{margin:20px 16px 0;}
  .list-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .list-head h2{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    letter-spacing:.03em;
    margin:0;
  }
  .list-head span{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel);}

  .empty{
    text-align:center;
    padding:34px 16px;
    color:var(--steel);
    font-size:13px;
    border:1px dashed var(--line);
    border-radius:10px;
    background:#fff;
  }

  .tag-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:10px;
    display:flex;
    overflow:hidden;
    position:relative;
  }
  .tag-num{
    width:46px;
    flex:none;
    background:var(--ink);
    color:var(--amber);
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .tag-num::after{
    content:"";
    position:absolute;
    top:8px;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--hole);
  }
  .tag-body{padding:10px 12px;flex:1;min-width:0;}
  .tag-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .tag-loc{font-weight:700;font-size:14px;}
  .tag-cat{font-size:11px;color:var(--steel);margin-top:2px;}
  .badge{
    font-size:11px;
    font-weight:700;
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
    color:#fff;
  }
  .badge.정상{background:var(--ok);}
  .badge.주의{background:var(--amber);}
  .badge.이상{background:var(--issue);}
  .tag-note{font-size:13px;color:var(--steel);margin-top:6px;line-height:1.45;}
  .tag-photos{display:flex;gap:6px;margin-top:8px;}
  .tag-photos img{width:44px;height:44px;object-fit:cover;border-radius:5px;border:1px solid var(--line);}
  .tag-del{
    position:absolute;
    top:8px;right:8px;
    border:none;background:none;
    color:var(--steel);
    font-size:16px;
    cursor:pointer;
    padding:2px 6px;
  }

  /* ---------- Bottom action bar ---------- */
  .action-bar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:#fff;
    border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex;
    gap:10px;
    max-width:720px;
    margin:0 auto;
  }
  .action-bar button{
    flex:1;
    padding:12px;
    border-radius:8px;
    border:none;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.03em;
    cursor:pointer;
  }
  .btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line) !important;}
  .btn-primary{background:var(--amber);color:var(--ink);}

  /* ---------- Report view ---------- */
  #report{display:none;}
  .report-doc{
    background:#fff;
    margin:16px;
    border:1px solid var(--line);
    border-radius:4px;
    padding:28px 22px;
  }
  .report-head{
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }
  .report-head .eyebrow2{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.14em;
    color:var(--steel);
    text-transform:uppercase;
    margin:0 0 4px;
  }
  .report-head h2{
    font-family:'Oswald',sans-serif;
    font-size:22px;
    margin:0;
  }
  .report-meta{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel);line-height:1.6;}
  .report-meta b{color:var(--ink);}

  .r-summary{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  .r-sum-box{
    flex:1;
    border:1px solid var(--line);
    border-radius:6px;
    text-align:center;
    padding:10px 4px;
  }
  .r-sum-box .n{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;}
  .r-sum-box .l{font-size:11px;color:var(--steel);margin-top:2px;}
  .r-sum-box.ok .n{color:var(--ok);}
  .r-sum-box.warn .n{color:var(--amber);}
  .r-sum-box.bad .n{color:var(--issue);}

  .r-item{
    border-top:1px solid var(--line);
    padding:16px 0;
    display:grid;
    grid-template-columns:110px 1fr;
    gap:14px;
  }
  .r-item:first-of-type{border-top:none;}
  .r-photos{display:flex;flex-direction:column;gap:6px;}
  .r-photos img{width:110px;height:80px;object-fit:cover;border-radius:5px;border:1px solid var(--line);}
  .r-no-photo{
    width:110px;height:80px;
    border:1px dashed var(--line);
    border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--steel);
    text-align:center;
  }
  .r-info-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .r-info-top .loc{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;}
  .r-info-top .cat{font-size:11px;color:var(--steel);margin-top:2px;}
  .r-info .note{font-size:13px;color:var(--ink);margin-top:8px;line-height:1.55;white-space:pre-wrap;}
  .r-info .idx{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--steel);}

  .r-sign{
    margin-top:26px;
    padding-top:16px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:flex-end;
    gap:40px;
    font-size:12px;
    color:var(--steel);
  }
  .r-sign div{text-align:center;}
  .r-sign .sig-line{width:110px;border-bottom:1px solid var(--ink);height:34px;margin-bottom:4px;}

  @media print{
    body{background:#fff;}
    .nameplate,.panel,.list-wrap,.action-bar{display:none !important;}
    #report{display:block !important;}
    .report-doc{border:none;margin:0;padding:0;}
    .app{max-width:100%;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- INPUT VIEW -->
  <div id="inputView">
    <header class="nameplate">
      <p class="eyebrow">FACILITY INSPECTION LOG</p>
      <h1>시설점검 사진등록</h1>
      <div class="np-grid">
        <div class="np-field">
          <label>시설명</label>
          <input id="siteName" type="text" placeholder="예: 서울숲엘타워" value="서울숲엘타워">
        </div>
        <div class="np-field">
          <label>점검자</label>
          <input id="inspectorName" type="text" placeholder="점검자명">
        </div>
        <div class="np-field">
          <label>점검일</label>
          <input id="inspectDate" type="date">
        </div>
        <div class="np-field">
          <label>구역/층</label>
          <input id="siteArea" type="text" placeholder="예: 지하1층 전기실">
        </div>
      </div>
    </header>

    <section class="panel">
      <p class="panel-title">점검 항목 등록</p>

      <div class="row2">
        <div class="field">
          <label>분류</label>
          <select id="itCategory">
            <option>전기설비</option>
            <option>소방설비</option>
            <option>CCTV</option>
            <option>주차설비</option>
            <option>방재/통신</option>
            <option>기타</option>
          </select>
        </div>
        <div class="field">
          <label>위치</label>
          <input id="itLocation" type="text" placeholder="예: 3층 분전반">
        </div>
      </div>

      <div class="field">
        <label>상태</label>
        <div class="status-toggle" id="statusToggle">
          <button type="button" data-status="정상" class="active">정상</button>
          <button type="button" data-status="주의">주의</button>
          <button type="button" data-status="이상">이상</button>
        </div>
      </div>

      <div class="field">
        <label>비고 / 조치사항</label>
        <textarea id="itNote" placeholder="점검 내용, 특이사항, 조치사항을 입력하세요"></textarea>
      </div>

      <div class="field">
        <label>사진 등록</label>
        <label class="photo-input">
          📷 사진 촬영 또는 첨부
          <input id="itPhoto" type="file" accept="image/*" capture="environment" multiple>
        </label>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button class="add-btn" id="addItemBtn">+ 점검항목 추가</button>
    </section>

    <section class="list-wrap">
      <div class="list-head">
        <h2>등록된 항목</h2>
        <span id="itemCount">0건</span>
      </div>
      <div id="itemList">
        <div class="empty">등록된 점검 항목이 없습니다.<br>위 양식으로 항목을 추가하세요.</div>
      </div>
    </section>
  </div>

  <!-- REPORT VIEW -->
  <div id="report">
    <div class="report-doc">
      <div class="report-head">
        <div>
          <p class="eyebrow2">Facility Inspection Report</p>
          <h2 id="rSiteName">서울숲엘타워</h2>
        </div>
        <div class="report-meta">
          점검일 &nbsp;<b id="rDate">-</b><br>
          점검자 &nbsp;<b id="rInspector">-</b><br>
          구역 &nbsp;&nbsp;&nbsp;<b id="rArea">-</b>
        </div>
      </div>

      <div class="r-summary">
        <div class="r-sum-box ok"><div class="n" id="cntOk">0</div><div class="l">정상</div></div>
        <div class="r-sum-box warn"><div class="n" id="cntWarn">0</div><div class="l">주의</div></div>
        <div class="r-sum-box bad"><div class="n" id="cntBad">0</div><div class="l">이상</div></div>
        <div class="r-sum-box"><div class="n" id="cntTotal">0</div><div class="l">전체</div></div>
      </div>

      <div id="rItems"></div>

      <div class="r-sign">
        <div><div class="sig-line"></div>점검자 서명</div>
        <div><div class="sig-line"></div>확인자 서명</div>
      </div>
    </div>
  </div>

</div>

<div class="action-bar" id="actionBar">
  <button class="btn-ghost" id="toReportBtn">보고서 보기</button>
  <button class="btn-primary" id="printBtn" style="display:none;">인쇄 / PDF 저장</button>
  <button class="btn-ghost" id="backBtn" style="display:none;">목록으로</button>
</div>

<script>
(function(){
  const items = [];
  let pendingPhotos = [];
  let idCounter = 1;

  const photoInput = document.getElementById('itPhoto');
  const photoPreview = document.getElementById('photoPreview');
  const statusToggle = document.getElementById('statusToggle');
  let currentStatus = '정상';

  statusToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    [...statusToggle.children].forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentStatus = btn.dataset.status;
  });

  photoInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        pendingPhotos.push(ev.target.result);
        renderPreview();
      };
      reader.readAsDataURL(file);
    });
    photoInput.value = '';
  });

  function renderPreview(){
    photoPreview.innerHTML = '';
    pendingPhotos.forEach((src, i) => {
      const div = document.createElement('div');
      div.className = 'thumb';
      div.innerHTML = `<img src="${src}"><button type="button" data-i="${i}">×</button>`;
      photoPreview.appendChild(div);
    });
    photoPreview.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', () => {
        pendingPhotos.splice(Number(b.dataset.i),1);
        renderPreview();
      });
    });
  }

  document.getElementById('addItemBtn').addEventListener('click', () => {
    const category = document.getElementById('itCategory').value;
    const location = document.getElementById('itLocation').value.trim();
    const note = document.getElementById('itNote').value.trim();

    if(!location){
      document.getElementById('itLocation').focus();
      return;
    }

    items.push({
      id: idCounter++,
      category, location, status: currentStatus, note,
      photos: pendingPhotos.slice()
    });

    document.getElementById('itLocation').value = '';
    document.getElementById('itNote').value = '';
    pendingPhotos = [];
    renderPreview();
    [...statusToggle.children].forEach(b=>b.classList.remove('active'));
    statusToggle.children[0].classList.add('active');
    currentStatus = '정상';

    renderList();
  });

  function renderList(){
    const wrap = document.getElementById('itemList');
    document.getElementById('itemCount').textContent = items.length + '건';
    if(items.length === 0){
      wrap.innerHTML = '<div class="empty">등록된 점검 항목이 없습니다.<br>위 양식으로 항목을 추가하세요.</div>';
      return;
    }
    wrap.innerHTML = items.map((it, idx) => `
      <div class="tag-card">
        <div class="tag-num">${String(idx+1).padStart(2,'0')}</div>
        <div class="tag-body">
          <button class="tag-del" data-id="${it.id}">✕</button>
          <div class="tag-top">
            <div>
              <div class="tag-loc">${escapeHtml(it.location)}</div>
              <div class="tag-cat">${escapeHtml(it.category)}</div>
            </div>
            <span class="badge ${it.status}">${it.status}</span>
          </div>
          ${it.note ? `<div class="tag-note">${escapeHtml(it.note)}</div>` : ''}
          ${it.photos.length ? `<div class="tag-photos">${it.photos.map(p=>`<img src="${p}">`).join('')}</div>` : ''}
        </div>
      </div>
    `).join('');

    wrap.querySelectorAll('.tag-del').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = Number(btn.dataset.id);
        const i = items.findIndex(x=>x.id===id);
        if(i>-1) items.splice(i,1);
        renderList();
      });
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function buildReport(){
    document.getElementById('rSiteName').textContent = document.getElementById('siteName').value || '시설명';
    document.getElementById('rDate').textContent = document.getElementById('inspectDate').value || '-';
    document.getElementById('rInspector').textContent = document.getElementById('inspectorName').value || '-';
    document.getElementById('rArea').textContent = document.getElementById('siteArea').value || '-';

    const ok = items.filter(i=>i.status==='정상').length;
    const warn = items.filter(i=>i.status==='주의').length;
    const bad = items.filter(i=>i.status==='이상').length;
    document.getElementById('cntOk').textContent = ok;
    document.getElementById('cntWarn').textContent = warn;
    document.getElementById('cntBad').textContent = bad;
    document.getElementById('cntTotal').textContent = items.length;

    const rItems = document.getElementById('rItems');
    if(items.length === 0){
      rItems.innerHTML = '<p style="color:#6B7785;font-size:13px;padding:20px 0;">등록된 점검 항목이 없습니다.</p>';
      return;
    }
    rItems.innerHTML = items.map((it, idx) => `
      <div class="r-item">
        <div class="r-photos">
          ${it.photos.length
            ? it.photos.map(p=>`<img src="${p}">`).join('')
            : '<div class="r-no-photo">사진 없음</div>'}
        </div>
        <div class="r-info">
          <div class="r-info-top">
            <div>
              <span class="idx">TAG-${String(idx+1).padStart(3,'0')}</span><br>
              <span class="loc">${escapeHtml(it.location)}</span>
              <div class="cat">${escapeHtml(it.category)}</div>
            </div>
            <span class="badge ${it.status}">${it.status}</span>
          </div>
          ${it.note ? `<div class="note">${escapeHtml(it.note)}</div>` : ''}
        </div>
      </div>
    `).join('');
  }

  document.getElementById('toReportBtn').addEventListener('click', () => {
    buildReport();
    document.getElementById('inputView').style.display = 'none';
    document.getElementById('report').style.display = 'block';
    document.getElementById('toReportBtn').style.display = 'none';
    document.getElementById('printBtn').style.display = 'block';
    document.getElementById('backBtn').style.display = 'block';
    window.scrollTo(0,0);
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    document.getElementById('inputView').style.display = 'block';
    document.getElementById('report').style.display = 'none';
    document.getElementById('toReportBtn').style.display = 'block';
    document.getElementById('printBtn').style.display = 'none';
    document.getElementById('backBtn').style.display = 'none';
    window.scrollTo(0,0);
  });

  document.getElementById('printBtn').addEventListener('click', () => window.print());

  // default date = today
  document.getElementById('inspectDate').valueAsDate = new Date();

  renderPreview();
  renderList();
})();
</script>
</body>
</html>
