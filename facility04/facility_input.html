<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시설점검 일일보고서 입력04</title>
<style>
:root{--ink:#1c2530;--paper:#f6f4ee;--line:#cfc9bb;--amber:#e2a63b;--steel:#6b7785;--ok:#3f7d68;--bad:#c1443c;}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,'Noto Sans KR',sans-serif;color:var(--ink)}
.app{max-width:820px;margin:0 auto;padding-bottom:90px}.head{background:var(--ink);color:#fff;padding:20px}.head h1{margin:0;font-size:24px}.head p{margin:5px 0 0;color:#ddd;font-size:12px}
.panel{margin:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:700;color:var(--steel);margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font-size:14px}.field textarea{min-height:75px;resize:vertical}
.sheet-preview{border:1px solid #333;background:#fff;margin-top:8px}.sheet-title{font-size:24px;font-weight:700;text-align:center;padding:20px 8px;border-bottom:1px solid #333}.meta-row{display:grid;grid-template-columns:110px 1fr;border-bottom:1px solid #333}.meta-row:last-child{border-bottom:0}.meta-label{padding:10px;text-align:center;font-weight:700;border-right:1px solid #333}.meta-value{padding:10px;white-space:pre-wrap;min-height:40px}
.items-title{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}.items-title h2{font-size:16px;margin:0}.add-btn,.save-btn,.link-btn{border:0;border-radius:7px;padding:11px 14px;font-weight:700;cursor:pointer}.add-btn{background:var(--amber);color:var(--ink)}.save-btn{background:var(--ink);color:#fff;width:100%;font-size:15px}.link-btn{background:#fff;border:1px solid var(--line);color:var(--ink)}
.item-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #333;border-left:1px solid #333}.item-card{border-right:1px solid #333;border-bottom:1px solid #333;background:#fff}.photo-box{height:230px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#fafafa}.photo-box img{width:100%;height:100%;object-fit:contain}.photo-box input{display:none}.photo-select{cursor:pointer;text-align:center;color:var(--steel);font-size:13px;padding:20px}.item-text{border-top:1px solid #333;padding:8px}.item-text textarea{width:100%;min-height:58px;border:1px solid #ddd;border-radius:4px;padding:8px;font-size:13px;resize:vertical}.item-tools{display:flex;justify-content:space-between;align-items:center;margin-top:5px}.item-no{font-size:11px;color:var(--steel)}.remove-btn{border:0;background:none;color:var(--bad);cursor:pointer;font-size:12px}
.status{margin-top:10px;padding:10px;border-radius:7px;font-size:13px;display:none}.status.show{display:block}.status.ok{background:#e7f1ec;color:#245c46}.status.err{background:#fbe6e4;color:#8a2c24}.status.wait{background:#fbf0dc;color:#8a5a0f}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;max-width:820px;margin:auto}.bottom .save-btn{flex:2}.bottom .link-btn{flex:1}
@media(max-width:600px){.grid{grid-template-columns:1fr}.item-grid{grid-template-columns:1fr}.photo-box{height:210px}.meta-row{grid-template-columns:90px 1fr}.head h1{font-size:21px}}
</style>
</head>
<body>
<div class="app">
  <header class="head"><h1>시설점검 일일보고서</h1><p>사진 + 설명을 항목별로 입력하고 날짜별 Google 시트 파일로 저장합니다.</p></header>

  <section class="panel">
    <div class="grid">
      <div class="field"><label>시설명</label><input id="siteName" value="서울숲엘타워"></div>
      <div class="field"><label>점검자</label><input id="inspector" placeholder="점검자명"></div>
      <div class="field"><label>점검일</label><input id="inspectDate" type="date"></div>
      <div class="field"><label>제목</label><input id="title" value="시설점검 보고서"></div>
    </div>
    <div class="field"><label>작업명</label><input id="jobName" placeholder="예: 지하1층 배수펌프 점검"></div>
    <div class="field"><label>세부내용</label><textarea id="details" placeholder="점검 및 작업 내용을 입력하세요"></textarea></div>
    <div class="field"><label>업체(작업자)</label><input id="vendor" placeholder="예: ○○전기 / 홍길동"></div>
  </section>

  <section class="panel">
    <div class="sheet-preview">
      <div class="sheet-title" id="pvTitle">시설점검 보고서</div>
      <div class="meta-row"><div class="meta-label">일시</div><div class="meta-value" id="pvDate"></div></div>
      <div class="meta-row"><div class="meta-label">작업명</div><div class="meta-value" id="pvJob"></div></div>
      <div class="meta-row"><div class="meta-label">세부내용</div><div class="meta-value" id="pvDetails"></div></div>
      <div class="meta-row"><div class="meta-label">업체(작업자)</div><div class="meta-value" id="pvVendor"></div></div>
    </div>

    <div class="items-title"><h2>사진 / 내용 항목</h2><button class="add-btn" id="addItemBtn">+ 항목 추가</button></div>
    <div class="item-grid" id="itemGrid"></div>
    <div id="status" class="status"></div>
  </section>
</div>

<div class="bottom">
  <button class="save-btn" id="saveBtn">날짜별 구글시트로 저장</button>
  <button class="link-btn" onclick="location.href='facility_list.html'">목록 보기</button>
</div>

<script>
const WEBAPP_URL='https://script.google.com/macros/s/AKfycbyra21XMyVeEpm6mEHWMdOrgP6X_PFilo0ki5TTSunvtPJ_UxwOHj-d8ifnTSojH8S6/exec';
const MAX_ITEMS=30;
let items=[];
let nextId=1;

function createItem(){
  if(items.length>=MAX_ITEMS){showStatus('최대 '+MAX_ITEMS+'개까지 추가할 수 있습니다.','err');return;}
  items.push({id:nextId++,text:'',photo:''});
  renderItems();
}
function removeItem(id){items=items.filter(x=>x.id!==id);renderItems();}
function renderItems(){
  const grid=document.getElementById('itemGrid');
  grid.innerHTML=items.map((it,i)=>`<div class="item-card">
    <div class="photo-box" id="photoBox-${it.id}">${it.photo?`<img src="${it.photo}">`:`<label class="photo-select" for="photo-${it.id}">📷<br>사진 촬영 또는 선택<br><small>항목 ${i+1}</small></label>`}<input id="photo-${it.id}" type="file" accept="image/*" capture="environment"></div>
    <div class="item-text"><textarea data-id="${it.id}" placeholder="text${i+1} / 사진 설명을 입력하세요">${escapeHtml(it.text)}</textarea><div class="item-tools"><span class="item-no">text${i+1}</span><button class="remove-btn" data-remove="${it.id}">삭제</button></div></div>
  </div>`).join('');

  items.forEach(it=>{
    const input=document.getElementById('photo-'+it.id);
    input.addEventListener('change',async e=>{
      const f=e.target.files&&e.target.files[0]; if(!f)return;
      try{it.photo=await compressImage(f);renderItems();}catch(err){showStatus('이미지 처리 실패: '+err.message,'err');}
    });
  });
  grid.querySelectorAll('textarea').forEach(el=>el.addEventListener('input',e=>{const it=items.find(x=>x.id===Number(e.target.dataset.id));if(it)it.text=e.target.value;}));
  grid.querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',()=>removeItem(Number(el.dataset.remove))));
}
function compressImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const maxW=1200,scale=Math.min(1,maxW/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',0.72));};img.onerror=reject;img.src=e.target.result;};r.onerror=reject;r.readAsDataURL(file);});}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function updatePreview(){document.getElementById('pvTitle').textContent=document.getElementById('title').value||'시설점검 보고서';document.getElementById('pvDate').textContent=document.getElementById('inspectDate').value;document.getElementById('pvJob').textContent=document.getElementById('jobName').value;document.getElementById('pvDetails').textContent=document.getElementById('details').value;document.getElementById('pvVendor').textContent=document.getElementById('vendor').value;}
function showStatus(msg,type){const s=document.getElementById('status');s.className='status show '+type;s.textContent=msg;}

async function saveReport(){
  const btn=document.getElementById('saveBtn');
  const payload={action:'saveReport',siteName:document.getElementById('siteName').value.trim(),inspector:document.getElementById('inspector').value.trim(),date:document.getElementById('inspectDate').value,title:document.getElementById('title').value.trim(),jobName:document.getElementById('jobName').value.trim(),details:document.getElementById('details').value.trim(),vendor:document.getElementById('vendor').value.trim(),items:items.map(x=>({text:x.text,photo:x.photo}))};
  if(!payload.date){showStatus('점검일을 입력하세요.','err');return;}
  if(!payload.jobName){showStatus('작업명을 입력하세요.','err');return;}
  if(!payload.items.length){showStatus('사진/내용 항목을 추가하세요.','err');return;}
  btn.disabled=true;btn.textContent='저장 중...';showStatus('Google Drive와 시트에 저장 중입니다. 사진이 많으면 잠시 걸릴 수 있습니다.','wait');
  try{
    const res=await fetch(WEBAPP_URL,{method:'POST',body:JSON.stringify(payload)});
    const text=await res.text();let json;try{json=JSON.parse(text);}catch(e){throw new Error('Apps Script 응답이 JSON이 아닙니다. 웹 앱 배포 권한을 확인하세요.');}
    if(json.result!=='success')throw new Error(json.message||'저장 실패');
    showStatus('저장 완료: '+json.fileName,'ok');
    if(json.spreadsheetUrl){setTimeout(()=>{if(confirm('저장되었습니다. 생성된 구글시트를 바로 열까요?'))window.open(json.spreadsheetUrl,'_blank');},200);}
  }catch(err){showStatus('저장 실패: '+err.message,'err');}
  finally{btn.disabled=false;btn.textContent='날짜별 구글시트로 저장';}
}

document.getElementById('addItemBtn').addEventListener('click',createItem);document.getElementById('saveBtn').addEventListener('click',saveReport);
['title','inspectDate','jobName','details','vendor'].forEach(id=>document.getElementById(id).addEventListener('input',updatePreview));
document.getElementById('inspectDate').valueAsDate=new Date();for(let i=0;i<4;i++)createItem();updatePreview();
</script>
</body>
</html>
