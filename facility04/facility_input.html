<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울숲엘타워</title>
<style>
      :root{--ink:#1c2530;--paper:#f6f4ee;--line:#cfc9bb;--amber:#e2a63b;--steel:#6b7785;--ok:#3f7d68;--bad:#c1443c;}
      *{box-sizing:border-box}
      body{margin:0;background:var(--paper);font-family:Arial,'Noto Sans KR',sans-serif;color:var(--ink)}
      .app{max-width:820px;margin:0 auto;padding-bottom:90px}
      .head{background:#1e3a8a;color:#fff;padding:20px}
      .head h1{margin:0;font-size:24px}
      .head p{margin:5px 0 0;color:#ddd;font-size:12px}
      .panel{margin:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
      .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .field{margin-bottom:10px}
      .field label{display:block;font-size:12px;font-weight:700;color:var(--steel);margin-bottom:5px}
      .field input,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font-size:14px}
      .field textarea{min-height:75px;resize:vertical}
      .sheet-preview{border:1px solid #333;background:#fff;margin-top:8px}
      .sheet-title{font-size:24px;font-weight:700;text-align:center;padding:20px 8px;border-bottom:1px solid #333}
      .meta-row{display:grid;grid-template-columns:110px 1fr;border-bottom:1px solid #333}
      .meta-row:last-child{border-bottom:0}
      .meta-label{padding:10px;text-align:center;font-weight:700;border-right:1px solid #333}
      .meta-value{padding:10px;white-space:pre-wrap;min-height:40px}
      .items-title{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
      .items-title h2{font-size:16px;margin:0}
      .add-btn,.save-btn,.link-btn{border:0;border-radius:7px;padding:11px 14px;font-weight:700;cursor:pointer}
      .add-btn{background:var(--amber);color:var(--ink)}
      .save-btn{background:var(--ink);color:#fff;width:100%;font-size:15px}
      .link-btn{background:#fff;border:1px solid var(--line);color:var(--ink)}
      .item-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #333;border-left:1px solid #333}
      .item-card{border-right:1px solid #333;border-bottom:1px solid #333;background:#fff}
      .photo-box{height:230px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#fafafa}
      .photo-box img{width:100%;height:100%;object-fit:contain}
      .photo-box input{display:none}
      .photo-select{cursor:pointer;text-align:center;color:var(--steel);font-size:13px;padding:20px}
      .photo-actions{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:16px}
      .photo-action-btn{display:inline-flex;align-items:center;justify-content:center;min-width:120px;padding:10px 12px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:700;cursor:pointer}
      .photo-action-btn.camera{background:var(--ink);color:#fff;border-color:var(--ink)}
      .photo-action-btn.gallery{background:#fff;color:var(--ink)}
      .photo-choice-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:9999;align-items:flex-end;justify-content:center;padding:14px}
      .photo-choice-modal.show{display:flex}
      .photo-choice-sheet{width:100%;max-width:520px;background:#fff;border-radius:14px;padding:14px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
      .photo-choice-title{text-align:center;font-weight:700;font-size:14px;margin:3px 0 12px}
      .photo-choice-option{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:14px;margin-top:8px;font-size:15px;font-weight:700;cursor:pointer}
      .photo-choice-option.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
      .photo-choice-cancel{width:100%;border:0;background:#eee;border-radius:9px;padding:12px;margin-top:10px;font-size:14px;cursor:pointer}
      .item-text{border-top:1px solid #333;padding:8px}
      .item-text textarea{width:100%;min-height:58px;border:1px solid #ddd;border-radius:4px;padding:8px;font-size:13px;resize:vertical}
      .item-tools{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
      .item-no{font-size:11px;color:var(--steel)}
      .remove-btn{border:0;background:none;color:var(--bad);cursor:pointer;font-size:12px}
      .status{margin-top:10px;padding:10px;border-radius:7px;font-size:13px;display:none}
      .status.show{display:block}
  .status.ok{background:#e7f1ec;color:#245c46}
      .status.err{background:#fbe6e4;color:#8a2c24}
      .status.wait{background:#fbf0dc;color:#8a5a0f}
      .bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;max-width:820px;margin:auto}
      .bottom .save-btn{flex:2}
      .bottom .link-btn{flex:1}

      .pdf-btn{background:#c1443c;color:#fff;border:0;border-radius:7px;padding:11px 14px;font-weight:700;cursor:pointer;width:100%}
      .bottom{flex-wrap:wrap}
      .bottom .save-btn{flex:1 1 100%}
      .bottom .pdf-btn{flex:1 1 calc(50% - 4px)}
      .bottom .link-btn{flex:1 1 calc(50% - 4px)}
      #printReport{display:none}

      @page{size:A4 portrait;margin:10mm}
      @media print{
        body{background:#fff}
        body > *:not(#printReport){display:none !important}
        #printReport{display:block !important;background:#fff;color:#000}
        .print-page{width:190mm;margin:0 auto;font-family:Arial,'Noto Sans KR',sans-serif}
        .print-title{text-align:center;font-size:22px;font-weight:700;padding:8mm 0 5mm;border-bottom:1px solid #000}
        .print-meta{border-left:1px solid #000;border-top:1px solid #000}
        .print-meta-row{display:grid;grid-template-columns:30mm 1fr;border-bottom:1px solid #000}
        .print-meta-label{font-weight:700;text-align:center;padding:3mm;border-right:1px solid #000}
        .print-meta-value{padding:3mm;white-space:pre-wrap}
        .print-items{display:grid;grid-template-columns:1fr 1fr;border-left:1px solid #000;border-top:1px solid #000;margin-top:4mm}
        .print-item{border-right:1px solid #000;border-bottom:1px solid #000;break-inside:avoid}
        .print-photo{height:72mm;display:flex;align-items:center;justify-content:center;padding:2mm}
        .print-photo img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
        .print-text{border-top:1px solid #000;padding:3mm;min-height:16mm;white-space:pre-wrap;font-size:11pt}
        .print-no{font-size:8pt;color:#555;margin-bottom:1mm}
      }

       @media(max-width:600px){
         .grid{grid-template-columns:1fr}
         .item-grid{grid-template-columns:1fr}
         .photo-box{height:210px}
         .meta-row{grid-template-columns:90px 1fr}
         .head h1{font-size:21px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div class="app">
  <header class="head"><h1>작업(공사) 보고서 입력</h1><p>사진 + 설명을 항목별로 입력하고 날짜별 Google 시트 파일로 저장합니다.</p></header>

  <section class="panel">
    <div class="grid">
      <!-- <div class="field"><label>시설명</label><input id="siteName" value="서울숲엘타워"></div>
      <div class="field"><label>점검자</label><input id="inspector" placeholder="점검자명"></div>   -->
      <div class="field"><label>점검일</label><input id="inspectDate" type="date"></div>
      <div class="field"><label>제목</label><input id="title" value="시설점검 보고서"></div>
    </div>
    <div class="field"><label>작업명</label><input id="jobName" placeholder="예: 지하1층 배수펌프 점검"></div>
    <div class="field"><label>세부내용</label><textarea id="details" placeholder="점검 및 작업 내용을 입력하세요"></textarea></div>
    <div class="field"><label>업체(작업자)</label><input id="vendor" placeholder="예: ○○전기 / 홍길동"></div>
  </section>

  <section class="panel">
    <div class="sheet-preview">
      <div class="sheet-title" id="pvTitle">작업(공사) 보고서</div>
      <div class="meta-row"><div class="meta-label">일시</div><div class="meta-value" id="pvDate"></div></div>
      <div class="meta-row"><div class="meta-label">작업명</div><div class="meta-value" id="pvJob"></div></div>
      <div class="meta-row"><div class="meta-label">세부내용</div><div class="meta-value" id="pvDetails"></div></div>
      <div class="meta-row"><div class="meta-label">업체(작업자)</div><div class="meta-value" id="pvVendor"></div></div>
    </div>

    <div class="items-title"><h2>사진 / 내용 항목</h2><button class="add-btn" id="addItemBtn">+ 항목 추가</button></div>
    <div class="item-grid" id="itemGrid"></div>
    <div id="status" class="status"></div>
  </section>
</div>


<div class="photo-choice-modal" id="photoChoiceModal">
  <div class="photo-choice-sheet">
    <div class="photo-choice-title">사진 입력 방법 선택</div>
    <button type="button" class="photo-choice-option primary" id="chooseCameraBtn">📷 사진 촬영</button>
    <button type="button" class="photo-choice-option" id="chooseGalleryBtn">🖼 갤러리에서 선택</button>
    <button type="button" class="photo-choice-cancel" id="closePhotoChoiceBtn">취소</button>
  </div>
</div>


<div id="printReport">
  <div class="print-page">
    <div class="print-title" id="prTitle">시설점검 보고서</div>
    <div class="print-meta">
     <!-- 상단 시설명   
   <div class="print-meta-row"><div class="print-meta-label">시설명</div><div class="print-meta-value" id="prSite"></div></div>
      <div class="print-meta-row"><div class="print-meta-label">점검자</div><div class="print-meta-value" id="prInspector"></div></div> 
     -->
      
      <div class="print-meta-row"><div class="print-meta-label">일시</div><div class="print-meta-value" id="prDate"></div></div>
      <div class="print-meta-row"><div class="print-meta-label">작업명</div><div class="print-meta-value" id="prJob"></div></div>
      <div class="print-meta-row"><div class="print-meta-label">세부내용</div><div class="print-meta-value" id="prDetails"></div></div>
      <div class="print-meta-row"><div class="print-meta-label">업체(작업자)</div><div class="print-meta-value" id="prVendor"></div></div>
    </div>
    <div class="print-items" id="prItems"></div>
  </div>
</div>

<div class="bottom">
  <button class="save-btn" id="saveBtn">날짜별 구글시트로 저장</button>
  <button class="pdf-btn" id="pdfBtn">PDF로 저장하기</button>
  <button class="link-btn" onclick="location.href='facility_list.html'">목록 보기</button>
</div>

<script>
const WEBAPP_URL='https://script.google.com/macros/s/AKfycbwhCT6h77a3g3Pi0NBLhGSBmItBOL31Demkth6qPoTUkI9lkx-_cpYYIf2IxQFZ5TNp/exec';
const REQUIRED_BACKEND_VERSION='2.1.0';
const MAX_ITEMS=30;
let items=[];
let nextId=1;

function createItem(){
  if(items.length>=MAX_ITEMS){showStatus('최대 '+MAX_ITEMS+'개까지 추가할 수 있습니다.','err');return;}
  items.push({id:nextId++,text:'',photo:''});
  renderItems();
}
function removeItem(id){items=items.filter(x=>x.id!==id);renderItems();}
function renderItems(){
  const grid=document.getElementById('itemGrid');

  grid.innerHTML=items.map((it,i)=>`
    <div class="item-card">
      <div class="photo-box" id="photoBox-${it.id}">
        ${
          it.photo
          ? `<img src="${it.photo}" alt="선택한 사진">`
          : `
            <div class="photo-actions">
              <button type="button" class="photo-action-btn camera photo-choice-btn" data-photo-choice="${it.id}">
                📷 사진촬영 / 이미지 선택
              </button>
              <div style="width:100%;text-align:center;color:var(--steel);font-size:11px;">
                항목 ${i+1}
              </div>
            </div>
          `
        }

        <input
          id="camera-${it.id}"
          type="file"
          accept="image/*"
          capture="environment"
        >

        <input
          id="gallery-${it.id}"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
        >
      </div>

      <div class="item-text">
        <textarea
          data-id="${it.id}"
          placeholder="text${i+1} / 사진 설명을 입력하세요"
        >${escapeHtml(it.text)}</textarea>

        <div class="item-tools">
          <span class="item-no">text${i+1}</span>
          <button class="remove-btn" data-remove="${it.id}">삭제</button>
        </div>
      </div>
    </div>
  `).join('');

  items.forEach(it=>{
    const handlePhoto = async (input) => {
      const f=input.files&&input.files[0];
      if(!f) return;

      try{
        it.photo=await compressImage(f);
        renderItems();
      }catch(err){
        showStatus('이미지 처리 실패: '+err.message,'err');
      }
    };

    const cameraInput=document.getElementById('camera-'+it.id);
    const galleryInput=document.getElementById('gallery-'+it.id);

    if(cameraInput){
      cameraInput.addEventListener('change',()=>handlePhoto(cameraInput));
    }

    if(galleryInput){
      galleryInput.addEventListener('change',()=>handlePhoto(galleryInput));
    }
  });

  grid.querySelectorAll('[data-photo-choice]').forEach(el=>
    el.addEventListener('click',()=>openPhotoChoice(el.dataset.photoChoice))
  );

  grid.querySelectorAll('textarea').forEach(el=>
    el.addEventListener('input',e=>{
      const it=items.find(x=>x.id===Number(e.target.dataset.id));
      if(it) it.text=e.target.value;
    })
  );

  grid.querySelectorAll('[data-remove]').forEach(el=>
    el.addEventListener('click',()=>removeItem(Number(el.dataset.remove)))
  );
}
function compressImage(file){
  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = e => {

      const img = new Image();

      img.onload = () => {

        // Google Sheet insertImage의 2MB 제한을 고려
        const MAX_WIDTH = 900;
        const MAX_HEIGHT = 900;

        let width = img.width;
        let height = img.height;

        const scale = Math.min(
          1,
          MAX_WIDTH / width,
          MAX_HEIGHT / height
        );

        width = Math.round(width * scale);
        height = Math.round(height * scale);

        const canvas =
          document.createElement('canvas');

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext('2d');

        // 흰색 배경
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(
          0,
          0,
          width,
          height
        );

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        let quality = 0.65;

        let dataUrl =
          canvas.toDataURL(
            'image/jpeg',
            quality
          );

        /*
         * base64 문자열을 약 1.5MB 이하로
         * 만들기 위해 품질을 단계적으로 감소
         */
        while(
          dataUrl.length > 1900000 &&
          quality > 0.35
        ){
          quality -= 0.08;

          dataUrl =
            canvas.toDataURL(
              'image/jpeg',
              quality
            );
        }

        resolve(dataUrl);

      };

      img.onerror = () => {
        reject(
          new Error(
            '선택한 이미지를 읽을 수 없습니다.'
          )
        );
      };

      img.src = e.target.result;

    };

    reader.onerror = () => {
      reject(
        new Error(
          '사진 파일을 읽지 못했습니다.'
        )
      );
    };

    reader.readAsDataURL(file);

  });
}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function updatePreview(){document.getElementById('pvTitle').textContent=document.getElementById('title').value||'시설점검 보고서';document.getElementById('pvDate').textContent=document.getElementById('inspectDate').value;document.getElementById('pvJob').textContent=document.getElementById('jobName').value;document.getElementById('pvDetails').textContent=document.getElementById('details').value;document.getElementById('pvVendor').textContent=document.getElementById('vendor').value;}
function showStatus(msg,type){const s=document.getElementById('status');s.className='status show '+type;s.textContent=msg;}

function getFieldValue(id, fallback=''){
  const el=document.getElementById(id);
  return el ? String(el.value || '').trim() : fallback;
}

function setTextIfExists(id, value){
  const el=document.getElementById(id);
  if(el) el.textContent=value;
}

async function checkBackend(){
  try{
    const res=await fetch(WEBAPP_URL+'?action=health&_='+Date.now());
    const text=await res.text();
    let json;
    try{json=JSON.parse(text);}catch(e){throw new Error('Apps Script 응답이 JSON이 아닙니다.');}
    if(json.result!=='success')throw new Error(json.message||'서버 확인 실패');
    if(json.version!==REQUIRED_BACKEND_VERSION){
      showStatus('Apps Script가 이전 버전입니다. 현재 서버 '+(json.version||'구버전')+' / 필요한 버전 '+REQUIRED_BACKEND_VERSION+' — Code.gs 저장 후 새 버전으로 재배포하세요.','err');
      return false;
    }
    showStatus('서버 연결 정상 · 버전 '+json.version+' · 저장된 보고서 '+(json.reportCount||0)+'건','ok');
    return true;
  }catch(err){
    showStatus('서버 연결 실패: '+err.message+' — WEBAPP_URL이 올바른 /exec 주소인지, Apps Script 웹앱이 모든 사용자 공개인지 확인하세요.','err');
    return false;
  }
}

async function saveReport(){
  const btn=document.getElementById('saveBtn');
  if(!(await checkBackend())) return;
  const payload={
    action:'saveReport',
    siteName:getFieldValue('siteName','서울숲엘타워'),
    inspector:getFieldValue('inspector',''),
    date:getFieldValue('inspectDate',''),
    title:getFieldValue('title','시설점검 보고서'),
    jobName:getFieldValue('jobName',''),
    details:getFieldValue('details',''),
    vendor:getFieldValue('vendor',''),
    items:items.map(x=>({text:x.text,photo:x.photo}))
  };
  if(!payload.date){showStatus('점검일을 입력하세요.','err');return;}
  if(!payload.jobName){showStatus('작업명을 입력하세요.','err');return;}
  if(!payload.items.length){showStatus('사진/내용 항목을 추가하세요.','err');return;}
  btn.disabled=true;btn.textContent='저장 중...';showStatus('Google Drive와 시트에 저장 중입니다. 사진이 많으면 잠시 걸릴 수 있습니다.','wait');
  try{
    const res=await fetch(WEBAPP_URL,{method:'POST',body:JSON.stringify(payload)});
    const text=await res.text();let json;try{json=JSON.parse(text);}catch(e){throw new Error('Apps Script 응답이 JSON이 아닙니다. 웹 앱 배포 권한을 확인하세요.');}
    if(json.result!=='success')throw new Error(json.message||'저장 실패');if(json.version!==REQUIRED_BACKEND_VERSION)throw new Error('Apps Script 구버전 응답입니다. 새 버전으로 재배포하세요.');
    showStatus('저장 완료: '+json.fileName,'ok');
    if(json.spreadsheetUrl){setTimeout(()=>{if(confirm('저장되었습니다. 생성된 구글시트를 바로 열까요?'))window.open(json.spreadsheetUrl,'_blank');},200);}
  }catch(err){showStatus('저장 실패: '+err.message,'err');}
  finally{btn.disabled=false;btn.textContent='날짜별 구글시트로 저장';}
}


let activePhotoItemId = null;

function openPhotoChoice(id){
  activePhotoItemId = Number(id);
  document.getElementById('photoChoiceModal').classList.add('show');
}
function closePhotoChoice(){
  document.getElementById('photoChoiceModal').classList.remove('show');
}
document.getElementById('chooseCameraBtn').addEventListener('click',()=>{
  if(activePhotoItemId===null)return;
  const el=document.getElementById('camera-'+activePhotoItemId);
  closePhotoChoice();
  if(el)el.click();
});
document.getElementById('chooseGalleryBtn').addEventListener('click',async()=>{
  if(activePhotoItemId===null)return;

  const el=document.getElementById('gallery-'+activePhotoItemId);
  closePhotoChoice();

  if(!el)return;

  /*
   * Android/Chrome에서는 showPicker()를 우선 사용해
   * 시스템 사진 선택기를 바로 띄웁니다.
   * 지원하지 않는 브라우저는 click()으로 자동 대체됩니다.
   */
  try{
    if(typeof el.showPicker==='function'){
      el.showPicker();
    }else{
      el.click();
    }
  }catch(err){
    el.click();
  }
});
document.getElementById('closePhotoChoiceBtn').addEventListener('click',closePhotoChoice);
document.getElementById('photoChoiceModal').addEventListener('click',e=>{
  if(e.target.id==='photoChoiceModal')closePhotoChoice();
});


function buildPrintReport(){
  setTextIfExists('prTitle', getFieldValue('title','시설점검 보고서') || '시설점검 보고서');
  setTextIfExists('prSite', getFieldValue('siteName','서울숲엘타워') || '-');
  setTextIfExists('prInspector', getFieldValue('inspector','') || '-');
  setTextIfExists('prDate', getFieldValue('inspectDate','') || '-');
  setTextIfExists('prJob', getFieldValue('jobName','') || '-');
  setTextIfExists('prDetails', getFieldValue('details','') || '-');
  setTextIfExists('prVendor', getFieldValue('vendor','') || '-');

  const prItems=document.getElementById('prItems');
  if(!prItems) return;

  prItems.innerHTML=items.map((it,i)=>`
    <div class="print-item">
      <div class="print-photo">${it.photo?`<img src="${it.photo}" alt="사진 ${i+1}">`:'<span>사진 없음</span>'}</div>
      <div class="print-text"><div class="print-no">text${i+1}</div>${escapeHtml(it.text||'')}</div>
    </div>
  `).join('');
}

async function saveAsPdf(){
  let reportEl=null;
  let oldStyle='';

  try{
    const date=getFieldValue('inspectDate','');
    const job=getFieldValue('jobName','');

    if(!date){
      showStatus('PDF 저장 전 점검일을 입력하세요.','err');
      return;
    }

    if(!job){
      showStatus('PDF 저장 전 작업명을 입력하세요.','err');
      return;
    }

    if(typeof html2pdf === 'undefined'){
      showStatus('PDF 생성 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하세요.','err');
      return;
    }

    buildPrintReport();

    reportEl=document.getElementById('printReport');
    if(!reportEl){
      showStatus('PDF 보고서 영역을 찾지 못했습니다.','err');
      return;
    }

    const safeJob=job.replace(/[\\/:*?"<>|]/g,'_').slice(0,40);
    const fileName=`${date}_${safeJob}_시설점검보고서.pdf`;

    showStatus('PDF 파일을 생성 중입니다...','wait');

    oldStyle=reportEl.getAttribute('style') || '';
    reportEl.style.display='block';
    reportEl.style.position='fixed';
    reportEl.style.left='-10000px';
    reportEl.style.top='0';
    reportEl.style.width='794px';
    reportEl.style.background='#fff';

    const imgs=Array.from(reportEl.querySelectorAll('img'));
    await Promise.all(imgs.map(img=>{
      if(img.complete) return Promise.resolve();
      return new Promise(resolve=>{
        const done=()=>resolve();
        img.addEventListener('load',done,{once:true});
        img.addEventListener('error',done,{once:true});
      });
    }));

    const options={
      margin:[8,8,8,8],
      filename:fileName,
      image:{type:'jpeg',quality:0.92},
      html2canvas:{
        scale:2,
        useCORS:true,
        backgroundColor:'#ffffff',
        logging:false
      },
      jsPDF:{
        unit:'mm',
        format:'a4',
        orientation:'portrait'
      },
      pagebreak:{
        mode:['css','legacy'],
        avoid:['.print-item']
      }
    };

    await html2pdf().set(options).from(reportEl).save();

    showStatus('PDF 저장을 시작했습니다. 스마트폰의 다운로드 폴더를 확인하세요.','ok');

  }catch(err){
    console.error(err);
    showStatus('PDF 저장 실패: '+err.message,'err');
  }finally{
    if(reportEl){
      if(oldStyle){
        reportEl.setAttribute('style',oldStyle);
      }else{
        reportEl.removeAttribute('style');
      }
    }
  }
}

document.getElementById('addItemBtn').addEventListener('click',createItem);document.getElementById('saveBtn').addEventListener('click',saveReport);document.getElementById('pdfBtn').addEventListener('click',saveAsPdf);
['title','inspectDate','jobName','details','vendor'].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.addEventListener('input',updatePreview);
});
const dateInput=document.getElementById('inspectDate');
if(dateInput) dateInput.valueAsDate=new Date();
for(let i=0;i<4;i++)createItem();
updatePreview();
checkBackend();
</script>
