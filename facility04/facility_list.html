<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울숲엘타워</title>
<style>
    :root{--ink:#1c2530;--paper:#f6f4ee;--line:#d7d1c4;--amber:#e2a63b;--steel:#6b7785;--bad:#c1443c;--ok:#3f7d68}
    *{box-sizing:border-box}
      body{margin:0;background:var(--paper);font-family:Arial,'Noto Sans KR',sans-serif;color:var(--ink)}
    .app{max-width:1100px;margin:auto;padding-bottom:40px}
      .head{background:var(--ink);color:#fff;padding:20px}
      .head h1{margin:0;font-size:24px}
      .head p{margin:5px 0 0;color:#d8d8d8;font-size:12px}
    .toolbar{padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap}
      .toolbar input{flex:1;min-width:200px;padding:10px;border:1px solid var(--line);border-radius:7px}
      .btn{padding:10px 13px;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
    .tabs{display:flex;gap:6px;padding:0 14px}
      .tab{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer}
      .tab.active{background:var(--amber);border-color:var(--amber);font-weight:700}
    .status{padding:24px 14px;text-align:center;color:var(--steel)}
      .status.error{color:var(--bad)}
      .status.ok{color:var(--ok)}
    .list{padding:14px}
      .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
      .card-top{display:flex;justify-content:space-between;gap:10px}
      .job{font-size:16px;font-weight:700}
      .date{font-size:12px;color:var(--steel);white-space:nowrap}
      .meta{font-size:12px;color:var(--steel);margin-top:5px}
      .detail{font-size:13px;margin-top:8px;white-space:pre-wrap}
      .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
      .mini{font-size:12px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;text-decoration:none;color:var(--ink);font-weight:700;cursor:pointer}
    .table-wrap{display:none;padding:14px;overflow:auto}
      .sheet-table{width:100%;border-collapse:collapse;background:#fff;min-width:1050px}
      .sheet-table th,.sheet-table td{border:1px solid #b8b8b8;padding:8px;font-size:12px;vertical-align:top}
      .sheet-table th{background:#eef1f4;position:sticky;top:0;z-index:1}
      .sheet-table a{color:#0b57d0}
    .note{margin:12px 14px 0;padding:10px 12px;border-radius:8px;background:#fff7e6;border:1px solid #ead2a0;color:#795300;font-size:12px;line-height:1.5}
    @media(max-width:600px){
      .head h1{font-size:21px}
      .card-top{flex-direction:column}
      .date{white-space:normal}}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <h2>작업(공사) 보고서 리스트</h2>
    <!-- <p>마스터 Google 시트의 '점검목록'을 JSONP 방식으로 직접 읽습니다. fetch/CORS 오류를 사용하지 않습니다.</p> -->
  </header>

  <div class="toolbar">
    <input id="search" placeholder="날짜 · 작업명 · 업체 · 세부내용 검색">
    <button class="btn" id="refreshBtn">새로고침</button>
    <a class="btn primary" href="facility_input.html">새 보고서</a>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="list">리스트</button>
    <button class="tab" data-view="table">구글시트형태</button>
  </div>

  <!-- <div class="note">※ 이 버전은 <b>fetch()</b>를 사용하지 않습니다. GitHub Pages의 CORS 문제를 피하기 위해 Google Sheets <b>JSONP</b> 방식으로 <b>점검목록</b>을 직접 읽습니다.</div> -->

  <div id="status" class="status">불러오는 중...</div>
  <div id="listView" class="list"></div>
  <div id="tableView" class="table-wrap"></div>
</div>

<script>
const SHEET_ID = '1r9PCcHqXIvCGHspVD40p4PjNXZStnfrrdcVi9rG3bnQ';
const SHEET_NAME = '점검목록';

// 구글시트 열기 비밀번호
const SHEET_OPEN_PASSWORD = '1234';

let reports = [];
let currentView = 'list';

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function gvizValue(cell){
  if(!cell) return '';
  if(cell.f !== undefined && cell.f !== null) return cell.f;
  if(cell.v === undefined || cell.v === null) return '';
  return cell.v;
}

function openSheetWithPassword(url){
  const pw = prompt('구글시트를 보려면 비밀번호를 입력하세요.');

  if(pw === null) return;

  if(pw !== SHEET_OPEN_PASSWORD){
    alert('비밀번호가 올바르지 않습니다.');
    return;
  }

  window.open(url, '_blank', 'noopener');
}

function loadData(){
  const status = document.getElementById('status');
  status.style.display = 'block';
  status.className = 'status';
  status.textContent = '점검목록 불러오는 중...';

  const callbackName = '__facilitySheetCallback_' + Date.now();
  const oldScript = document.getElementById('gvizJsonpScript');
  if (oldScript) oldScript.remove();

  let finished = false;
  const timer = setTimeout(() => {
    if (finished) return;
    finished = true;
    cleanup();
    showLoadError('Google 시트 응답 시간이 초과되었습니다. 시트 공유 설정과 시트 이름을 확인하세요.');
  }, 15000);

  function cleanup(){
    clearTimeout(timer);
    const sc = document.getElementById('gvizJsonpScript');
    if (sc) sc.remove();
    try { delete window[callbackName]; } catch(e) { window[callbackName] = undefined; }
  }

  window[callbackName] = function(json){
    if (finished) return;
    finished = true;
    cleanup();

    try {
      if (!json || !json.table) {
        throw new Error('Google 시트에서 올바른 데이터를 받지 못했습니다.');
      }

      if (json.status === 'error') {
        const msg = (json.errors || []).map(e => e.detailed_message || e.message || '').filter(Boolean).join(' / ');
        throw new Error(msg || 'Google 시트 조회 오류');
      }

      const rows = json.table.rows || [];

      reports = rows.map(r => {
        const c = r.c || [];
        return {
          reportId: gvizValue(c[0]),
          createdAt: gvizValue(c[1]),
          date: gvizValue(c[2]),
          title: gvizValue(c[3]),
          jobName: gvizValue(c[4]),
          details: gvizValue(c[5]),
          vendor: gvizValue(c[6]),
          siteName: gvizValue(c[7]),
          inspector: gvizValue(c[8]),
          itemCount: gvizValue(c[9]),
          spreadsheetId: gvizValue(c[10]),
          spreadsheetUrl: gvizValue(c[11]),
          coverPhoto: gvizValue(c[12])
        };
      }).filter(x => x.reportId || x.jobName || x.date).reverse();

      status.className = 'status ok';
      status.textContent = `불러오기 완료 · ${reports.length}건`;
      setTimeout(() => status.style.display = 'none', 1200);
      render();
    } catch(err) {
      showLoadError(err.message);
    }
  };

  const tqx = `out:json;responseHandler:${callbackName}`;
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&headers=1&tqx=${encodeURIComponent(tqx)}&_=${Date.now()}`;

  const script = document.createElement('script');
  script.id = 'gvizJsonpScript';
  script.src = url;
  script.async = true;
  script.onerror = function(){
    if (finished) return;
    finished = true;
    cleanup();
    showLoadError('Google 시트 연결에 실패했습니다. 점검기록 시트를 링크가 있는 모든 사용자 → 뷰어로 설정했는지 확인하세요.');
  };
  document.head.appendChild(script);
}

function showLoadError(message){
  const status = document.getElementById('status');
  status.style.display = 'block';
  status.className = 'status error';
  status.innerHTML = '불러오기 실패: ' + esc(message) + '<br><br>' +
    '확인사항: <b>점검기록</b> Google 시트 → 공유 → 일반 액세스 → <b>링크가 있는 모든 사용자 → 뷰어</b><br>' +
    '그리고 시트 아래쪽 탭 이름이 <b>점검목록</b>인지 확인하세요.';
  document.getElementById('listView').innerHTML = '';
  document.getElementById('tableView').innerHTML = '';
}

function filtered(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  if(!q) return reports;
  return reports.filter(r => [r.date,r.jobName,r.vendor,r.details,r.inspector,r.siteName,r.title].join(' ').toLowerCase().includes(q));
}

function renderList(arr){
  const el=document.getElementById('listView');
  if(!arr.length){el.innerHTML='<div class="status">표시할 보고서가 없습니다.</div>';return;}
  el.innerHTML=arr.map((r,idx)=>`
    <div class="card">
      <div class="card-top">
        <div><div class="job">${esc(r.jobName || r.title || '시설점검 보고서')}</div><div class="meta">${esc(r.vendor)}${r.inspector?' · '+esc(r.inspector):''}${r.siteName?' · '+esc(r.siteName):''} · 항목 ${esc(r.itemCount||0)}개</div></div>
        <div class="date">${esc(r.date)}</div>
      </div>
      ${r.details?`<div class="detail">${esc(r.details)}</div>`:''}
      <div class="actions">
        ${r.spreadsheetUrl?`<button class="mini" type="button" data-open-sheet="${idx}">구글시트 열기</button>`:''}
      </div>
    </div>`).join('');

  el.querySelectorAll('[data-open-sheet]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const row = arr[Number(btn.dataset.openSheet)];
      if(row && row.spreadsheetUrl){
        openSheetWithPassword(row.spreadsheetUrl);
      }
    });
  });
}

function renderTable(arr){
  const el=document.getElementById('tableView');
  if(!arr.length){el.innerHTML='<div class="status">표시할 보고서가 없습니다.</div>';return;}
  el.innerHTML=`<table class="sheet-table"><thead><tr>
    <th>점검일</th><th>제목</th><th>작업명</th><th>세부내용</th><th>업체(작업자)</th><th>시설명</th><th>점검자</th><th>항목수</th><th>등록일시</th><th>Google 시트</th>
  </tr></thead><tbody>${arr.map((r,idx)=>`<tr>
    <td>${esc(r.date)}</td><td>${esc(r.title)}</td><td>${esc(r.jobName)}</td><td>${esc(r.details)}</td><td>${esc(r.vendor)}</td><td>${esc(r.siteName)}</td><td>${esc(r.inspector)}</td><td>${esc(r.itemCount)}</td><td>${esc(r.createdAt)}</td><td>${r.spreadsheetUrl?`<button class="mini" type="button" data-table-open="${idx}">열기</button>`:''}</td>
  </tr>`).join('')}</tbody></table>`;

  el.querySelectorAll('[data-table-open]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const row = arr[Number(btn.dataset.tableOpen)];
      if(row && row.spreadsheetUrl){
        openSheetWithPassword(row.spreadsheetUrl);
      }
    });
  });
}

function render(){const arr=filtered();renderList(arr);renderTable(arr);}
function setView(v){currentView=v;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));document.getElementById('listView').style.display=v==='list'?'block':'none';document.getElementById('tableView').style.display=v==='table'?'block':'none';}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>setView(t.dataset.view)));
document.getElementById('search').addEventListener('input',render);
document.getElementById('refreshBtn').addEventListener('click',loadData);
setView('list'); loadData();
</script>
</body>
</html>
