<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울숲엘타워</title>
<style>
    :root{--ink:#1c2530;--paper:#f6f4ee;--line:#d7d1c4;--amber:#e2a63b;--steel:#6b7785;--bad:#c1443c;--ok:#3f7d68}
    *{box-sizing:border-box}
      body{margin:0;background:var(--paper);font-family:"Noto Sans KR", -apple-system, BlinkMacSystemFont,"Malgun Gothic", Roboto, sans-serif;color:var(--ink)}
    .app{max-width:1100px;margin:auto;padding-bottom:40px}
      .head{background:var(--ink);color:#fff;padding:20px}
      .head h1{margin:0;font-size:24px}
      .head p{margin:5px 0 0;color:#d8d8d8;font-size:12px}
    .toolbar{padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap}
      .toolbar input{flex:1;min-width:200px;padding:10px;border:1px solid var(--line);border-radius:7px}
      .btn{font-size:0.9rem;padding:10px 13px;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
      .btn.primary{font-size:0.9rem;padding:10px 13px;border:1px solid var(--line);background:#0e2568;border-radius:7px;font-weight:700;cursor:pointer;text-decoration:none;color:#fff}
    .tabs{display:flex;gap:6px;padding:0 14px}
      .tab{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer}
      .tab.active{background:var(--amber);border-color:var(--amber);font-weight:700}
    .status{padding:24px 14px;text-align:center;color:var(--steel)}
      .status.error{color:var(--bad)}
      .status.ok{color:var(--ok)}
    .list{padding:14px}
      .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
      .card-top{display:flex;justify-content:space-between;gap:10px}
      .job{font-size:16px;font-weight:700}
      .date{font-size:12px;color:var(--steel);white-space:nowrap}
      .meta{font-size:12px;color:var(--steel);margin-top:5px}
      .detail{font-size:13px;margin-top:8px;white-space:pre-wrap}
      .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
      .mini{font-size:12px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;text-decoration:none;color:var(--ink);font-weight:700;cursor:pointer}
      .mini.delete{background:#c1443c;color:#fff;border-color:#c1443c}
    .table-wrap{display:none;padding:14px;overflow:auto}
      .sheet-table{width:100%;border-collapse:collapse;background:#fff;min-width:1050px}
      .sheet-table th,.sheet-table td{border:1px solid #b8b8b8;padding:8px;font-size:12px;vertical-align:top}
      .sheet-table th{background:#eef1f4;position:sticky;top:0;z-index:1}
      .sheet-table a{color:#0b57d0}
    .note{margin:12px 14px 0;padding:10px 12px;border-radius:8px;background:#fff7e6;border:1px solid #ead2a0;color:#795300;font-size:12px;line-height:1.5}
    @media(max-width:600px){
      .head h1{font-size:21px}
      .card-top{flex-direction:column}
      .date{white-space:normal}}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <h2>작업(공사) 보고서</h2>
    <!-- <p>마스터 Google 시트의 '점검목록'을 JSONP 방식으로 직접 읽습니다. fetch/CORS 오류를 사용하지 않습니다.</p> -->
  </header>

  <div class="toolbar">
    <input id="search" placeholder="날짜 · 작업명 · 업체 · 세부내용 검색">
    <button class="btn" id="refreshBtn">새로고침</button>
    <a class="btn primary" href="facility_input.html">새 보고서</a>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="list">리스트</button>
    <button class="tab" data-view="table">구글시트형태</button>
  </div>

  <!-- <div class="note">※ 이 버전은 <b>fetch()</b>를 사용하지 않습니다. GitHub Pages의 CORS 문제를 피하기 위해 Google Sheets <b>JSONP</b> 방식으로 <b>점검목록</b>을 직접 읽습니다.</div> -->

  <div id="status" class="status">불러오는 중...</div>
  <div id="listView" class="list"></div>
  <div id="tableView" class="table-wrap"></div>
</div>

<script>
/*
 * 중요:
 * 이 버전은 마스터 Google 시트 '점검목록'을 직접 읽지 않습니다.
 * Apps Script의 action=list를 호출해서
 * report 폴더 안에 현재 실제 존재하는 보고서만 표시합니다.
 */
const WEBAPP_URL='https://script.google.com/macros/s/AKfycbyJoWKFsbszzFDsfnInYpuV12thtyXEUMJELHRMSPLTqjuspD6BLbCdgI08E67Dtdlv/exec';
const REQUIRED_BACKEND_VERSION='2.1.0';

// 구글시트 열기 비밀번호
const SHEET_OPEN_PASSWORD='1234';
const DELETE_PASSWORD='1234';

let reports=[];
let currentView='list';

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function openSheetWithPassword(url){
  const pw=prompt('구글시트를 보려면 비밀번호를 입력하세요.');

  if(pw===null)return;

  if(pw!==SHEET_OPEN_PASSWORD){
    alert('비밀번호가 올바르지 않습니다.');
    return;
  }

  window.open(url,'_blank','noopener');
}

async function deleteReport(report){
  if(!report || !report.reportId){
    alert('삭제할 보고서 정보가 없습니다.');
    return;
  }

  const pw=prompt('보고서를 삭제하려면 비밀번호를 입력하세요.');
  if(pw===null)return;

  if(pw!==DELETE_PASSWORD){
    alert('비밀번호가 올바르지 않습니다.');
    return;
  }

  const name=report.jobName||report.title||'보고서';

  if(!confirm(
    '정말 삭제하시겠습니까?\n\n'+
    name+'\n'+
    (report.date||'')+
    '\n\n삭제하면 report 폴더의 Google 시트와 관련 사진/PDF도 휴지통으로 이동합니다.'
  )){
    return;
  }

  const status=document.getElementById('status');
  status.style.display='block';
  status.className='status';
  status.textContent='보고서 삭제 중...';

  try{
    const res=await fetch(WEBAPP_URL,{
      method:'POST',
      body:JSON.stringify({
        action:'deleteReport',
        password:pw,
        reportId:report.reportId,
        spreadsheetId:report.spreadsheetId||''
      })
    });

    const text=await res.text();
    let json;

    try{
      json=JSON.parse(text);
    }catch(e){
      throw new Error('Apps Script 응답이 JSON이 아닙니다.');
    }

    if(json.result!=='success'){
      throw new Error(json.message||'삭제 실패');
    }

    alert('삭제되었습니다.');
    await loadData();

  }catch(err){
    status.className='status error';
    status.textContent='삭제 실패: '+err.message;
  }
}

async function loadData(){
  const status=document.getElementById('status');

  status.style.display='block';
  status.className='status';
  status.textContent='report 폴더의 보고서 목록 불러오는 중...';

  try{
    const url=WEBAPP_URL+'?action=list&_='+Date.now();

    const res=await fetch(url,{
      method:'GET',
      cache:'no-store',
      redirect:'follow'
    });

    if(!res.ok){
      throw new Error('HTTP '+res.status);
    }

    const text=await res.text();

    let json;

    try{
      json=JSON.parse(text);
    }catch(e){
      throw new Error('Apps Script 응답이 JSON이 아닙니다.');
    }

    if(json.result!=='success'){
      throw new Error(json.message||'보고서 목록 조회 실패');
    }

    if(json.version && json.version!==REQUIRED_BACKEND_VERSION){
      throw new Error(
        'Apps Script 버전이 다릅니다. 현재 '+json.version+
        ' / 필요한 버전 '+REQUIRED_BACKEND_VERSION+
        ' — Code.gs 저장 후 새 버전으로 재배포하세요.'
      );
    }

    reports=Array.isArray(json.reports)?json.reports:[];

    status.className='status ok';
    status.textContent='report 폴더 보고서 · '+reports.length+'건';

    setTimeout(()=>{
      status.style.display='none';
    },1200);

    render();

  }catch(err){
    showLoadError(err.message);
  }
}

function showLoadError(message){
  const status=document.getElementById('status');

  status.style.display='block';
  status.className='status error';
  status.innerHTML=
    '불러오기 실패: '+esc(message)+'<br><br>'+
    '확인사항: Apps Script의 <b>getReportList_()</b>가 report 폴더 기준으로 필터링되어 있는지 확인하고, '+
    '<b>새 버전으로 재배포</b>하세요.';

  document.getElementById('listView').innerHTML='';
  document.getElementById('tableView').innerHTML='';
}

function filtered(){
  const q=document.getElementById('search').value.trim().toLowerCase();

  if(!q)return reports;

  return reports.filter(r=>
    [
      r.date,
      r.jobName,
      r.vendor,
      r.details,
      r.inspector,
      r.siteName,
      r.title
    ].join(' ').toLowerCase().includes(q)
  );
}

function renderList(arr){
  const el=document.getElementById('listView');

  if(!arr.length){
    el.innerHTML='<div class="status">report 폴더에 표시할 보고서가 없습니다.</div>';
    return;
  }

  el.innerHTML=arr.map((r,idx)=>`
    <div class="card">
      <div class="card-top">
        <div>
          <div class="job">
            ${esc(r.jobName||r.title||'작업(공사) 보고서')}
          </div>

          <div class="meta">
            ${esc(r.vendor)}
            ${r.inspector?' · '+esc(r.inspector):''}
            ${r.siteName?' · '+esc(r.siteName):''}
            · 항목 ${esc(r.itemCount||0)}개
          </div>
        </div>

        <div class="date">${esc(r.date)}</div>
      </div>

      ${r.details?`<div class="detail">${esc(r.details)}</div>`:''}

      <div class="actions">
        ${
          r.spreadsheetUrl
            ? `<button class="mini" type="button" data-open-sheet="${idx}">구글시트 열기</button>`
            : ''
        }
        <button class="mini delete" type="button" data-delete-report="${idx}">삭제</button>
      </div>
    </div>
  `).join('');

  el.querySelectorAll('[data-open-sheet]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const row=arr[Number(btn.dataset.openSheet)];

      if(row&&row.spreadsheetUrl){
        openSheetWithPassword(row.spreadsheetUrl);
      }
    });
  });

  el.querySelectorAll('[data-delete-report]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const row=arr[Number(btn.dataset.deleteReport)];
      if(row) deleteReport(row);
    });
  });
}

function renderTable(arr){
  const el=document.getElementById('tableView');

  if(!arr.length){
    el.innerHTML='<div class="status">report 폴더에 표시할 보고서가 없습니다.</div>';
    return;
  }

  el.innerHTML=`
    <table class="sheet-table">
      <thead>
        <tr>
          <th>점검일</th>
          <th>제목</th>
          <th>작업명</th>
          <th>세부내용</th>
          <th>업체(작업자)</th>
          <th>시설명</th>
          <th>점검자</th>
          <th>항목수</th>
          <th>등록일시</th>
          <th>Google 시트</th><th>삭제</th>
        </tr>
      </thead>

      <tbody>
        ${
          arr.map((r,idx)=>`
            <tr>
              <td>${esc(r.date)}</td>
              <td>${esc(r.title)}</td>
              <td>${esc(r.jobName)}</td>
              <td>${esc(r.details)}</td>
              <td>${esc(r.vendor)}</td>
              <td>${esc(r.siteName)}</td>
              <td>${esc(r.inspector)}</td>
              <td>${esc(r.itemCount)}</td>
              <td>${esc(r.createdAt)}</td>

              <td>
                ${
                  r.spreadsheetUrl
                    ? `<button class="mini" type="button" data-table-open="${idx}">열기</button>`
                    : ''
                }
              </td>
              <td>
                <button class="mini delete" type="button" data-table-delete="${idx}">삭제</button>
              </td>
            </tr>
          `).join('')
        }
      </tbody>
    </table>
  `;

  el.querySelectorAll('[data-table-open]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const row=arr[Number(btn.dataset.tableOpen)];

      if(row&&row.spreadsheetUrl){
        openSheetWithPassword(row.spreadsheetUrl);
      }
    });
  });

  el.querySelectorAll('[data-table-delete]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const row=arr[Number(btn.dataset.tableDelete)];
      if(row) deleteReport(row);
    });
  });
}

function render(){
  const arr=filtered();

  renderList(arr);
  renderTable(arr);
}

function setView(v){
  currentView=v;

  document.querySelectorAll('.tab').forEach(t=>
    t.classList.toggle(
      'active',
      t.dataset.view===v
    )
  );

  document.getElementById('listView').style.display=
    v==='list'?'block':'none';

  document.getElementById('tableView').style.display=
    v==='table'?'block':'none';
}

document.querySelectorAll('.tab').forEach(t=>
  t.addEventListener(
    'click',
    ()=>setView(t.dataset.view)
  )
);

document.getElementById('search').addEventListener('input',render);
document.getElementById('refreshBtn').addEventListener('click',loadData);

setView('list');
loadData();
</script>
</body>
</html>
