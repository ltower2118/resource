<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서울숲엘타워</title>

<style>
:root{
  --navy:#173e63;
  --bg:#f3f6f9;
  --line:#dce3ea;
  --red:#b42318;
  --green:#087443;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:#17202a;
  font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,
              "Malgun Gothic",Roboto,sans-serif;
}

header{
  background:#0e2568;
  color:#fff;
  padding:18px 20px;
}

header h2{
  margin:0 0 5px;
}

header p{
  font-size:13px;
  margin:0;
  opacity:.88;
}

main{
  max-width:1500px;
  margin:auto;
  padding:14px;
}

.box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  margin-bottom:11px;
}

/* Apps Script URL 입력창은 사용하지 않으므로 숨김 */
.config{
  display:none !important;
}

.grid{
  display:grid;
  grid-template-columns:2fr repeat(4,1fr);
  gap:8px;
}

input,
select,
button{
  width:100%;
  padding:10px;
  border:1px solid #cbd5df;
  border-radius:8px;
  background:#fff;
  font-size:1rem;
}

button{
  border:0;
  background:#0e2568;
  color:#fff;
  cursor:pointer;
}

button:hover{
  opacity:.92;
}

.secondary{
  background:#5E81AC;
}

.stats{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.badge{
  background:#eaf0f6;
  border-radius:18px;
  padding:7px 10px;
  font-size:.9rem;
}

.good{
  color:var(--green);
}

.bad{
  color:var(--red);
}

.small{
  font-size:12px;
  color:#5c6773;
}

.hidden{
  display:none !important;
}

.tablewrap{
  overflow:auto;
  max-height:68vh;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:1250px;
  background:#fff;
}

th,
td{
  padding:9px;
  border-bottom:1px solid #e6ebef;
  text-align:left;
  vertical-align:top;
  font-size:.9rem;
}

th{
  position:sticky;
  top:0;
  background:#eaf0f6;
  z-index:2;
}

tr:hover td{
  background:#f8fbfd;
}

mark{
  background:#fff09a;
}

/* ==============================
   로딩 영역
   ============================== */

#loading{
  text-align:center;
  padding:42px 20px;
  font-weight:700;
  color:#5c6773;
}

/* 회전 로딩 아이콘 */
.loader{
  width:46px;
  height:46px;
  margin:0 auto 14px;

  border:5px solid #dce3ea;
  border-top-color:#0e2568;

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{
  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }
}

.loading-title{
  font-size:1rem;
  font-weight:700;
  color:#273747;
}

.loading-sub{
  margin-top:7px;
  font-size:12px;
  font-weight:400;
  color:#7a8793;
}


/* 우측 하단 맨 위로 이동 버튼 */
.top-btn{
  position:fixed;
  right:18px;
  bottom:22px;
  width:44px;
  height:44px;
  border:none;
  border-radius:50%;
  background:#0e2568;
  color:#fff;
  font-size:22px;
  font-weight:700;
  cursor:pointer;
  display:none;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.22);
  z-index:9999;
  opacity:.94;
}

.top-btn.show{
  display:flex;
}

.top-btn:hover{
  opacity:.92;
}

/* 모바일 */
@media(max-width:800px){

  main{
    padding:8px;
  }

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .wide{
    grid-column:1/-1;
  }

  header{
    padding:14px;
  }

  .loader{
    width:42px;
    height:42px;
  }

  .top-btn{
    right:12px;
    bottom:16px;
    width:42px;
    height:42px;
  }
}
</style>
</head>

<body>

<header>
  <h2>서울숲엘타워 소방점검 검색</h2>
  <p>2017–2025 종합·작동점검 / 원본·신고자료 통합 검색</p>
</header>

<main>

<!--
Apps Script URL을 코드에 직접 넣기 때문에
이 영역은 CSS에서 숨김 처리되어 있습니다.
-->
<div id="config" class="box config">

  <b>Apps Script 웹앱 연결</b>

  <div
    class="small"
    style="margin:6px 0 9px"
  >
    Apps Script를 웹 앱으로 배포한 뒤
    <b>/exec</b> 주소를 입력하세요.
  </div>

  <div
    style="
      display:grid;
      grid-template-columns:1fr 130px;
      gap:8px
    "
  >

    <input
      id="apiUrl"
      placeholder="https://script.google.com/macros/s/...../exec"
    >

    <button onclick="saveApi()">
      저장/연결
    </button>

  </div>

</div>


<!-- 검색 영역 -->
<div class="box">

  <div class="grid">

    <input
      class="wide"
      id="q"
      placeholder="통합검색: 3층, 1306호, 타임게이트, 감지기, 스프링클러등..."
      oninput="render()"
    >

    <select
      id="year"
      onchange="render()"
    >
      <option value="">
        전체 연도
      </option>
    </select>

    <select
      id="kind"
      onchange="render()"
    >
      <option value="">
        전체 점검종류
      </option>
    </select>

    <select
      id="report"
      onchange="render()"
    >
      <option value="">
        전체 신고구분
      </option>
    </select>

    <select
      id="category"
      onchange="render()"
    >
      <option value="">
        전체 구분
      </option>
    </select>

  </div>


  <div
    style="
      display:flex;
      gap:8px;
      margin-top:8px
    "
  >

    <button
      class="secondary"
      onclick="resetFilters()"
    >
      필터 초기화
    </button>

    <button onclick="loadData()">
      새로고침
    </button>

    <button onclick="exportCsv()">
      검색결과 CSV 저장
    </button>

  </div>


  <div class="stats">

    <span
      class="badge"
      id="count"
    >
      0건
    </span>

    <span
      class="badge"
      id="range"
    >
      연도 -
    </span>

    <span
      class="badge"
      id="updated"
    >
      업데이트 -
    </span>

    <span
      class="badge"
      id="status"
    >
      연결 대기
    </span>

  </div>

</div>


<!-- 검색 결과 -->
<div class="tablewrap">

  <div id="loading">

    <div class="loader"></div>

    <div class="loading-title">
      구글시트 데이터를 불러오는 중...
    </div>

    <div class="loading-sub">
      잠시만 기다려 주세요.
    </div>

  </div>


  <table
    id="table"
    class="hidden"
  >

    <thead>
      <tr id="head"></tr>
    </thead>

    <tbody id="body"></tbody>

  </table>

</div>

</main>


<button
  id="topBtn"
  class="top-btn"
  type="button"
  aria-label="맨 위로 이동"
  onclick="scrollToTop()"
>
  ↑
</button>


<script>

/* =========================================
   Apps Script 웹앱 주소
   ========================================= */

const APP_SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbxdOkiFs0HIwbnv2i2T9sSNCNNJl-DHw513qblVXMS1fdFSFcJq2tTAcZHk7Jh2an3u/exec';


/* =========================================
   테이블 항목
   ========================================= */

const HEAD = [
  "연도",
  "점검종류",
  "신고구분",
  "구분",
  "상세구분",
  "점검내역",
  "보완대책",
  "관련법규",
  "원본파일",
  "처리상태",
  "비고"
];


let data = [];
let filtered = [];


const $ = id =>
  document.getElementById(id);


/* =========================================
   Apps Script URL
   ========================================= */

function apiUrl(){

  return (
    APP_SCRIPT_URL ||
    localStorage.getItem('fireInspectionApi') ||
    ''
  );

}


/* =========================================
   수동 URL 저장
   현재 화면에서는 숨김 상태
   ========================================= */

function saveApi(){

  const u =
    $('apiUrl').value.trim();

  if(!u){

    alert(
      'Apps Script /exec URL을 입력하세요.'
    );

    return;
  }

  localStorage.setItem(
    'fireInspectionApi',
    u
  );

  loadData();

}


/* =========================================
   로딩 애니메이션 표시
   ========================================= */

function showLoading(message){

  $('table').classList.add('hidden');

  $('loading').classList.remove('hidden');

  $('loading').innerHTML = `

    <div class="loader"></div>

    <div class="loading-title">
      ${message || '구글시트 데이터를 불러오는 중...'}
    </div>

    <div class="loading-sub">
      잠시만 기다려 주세요.
    </div>

  `;

}


/* =========================================
   Google Sheet 데이터 불러오기
   ========================================= */

async function loadData(){

  const u = apiUrl();

  if(!u){

    $('status').textContent =
      '연결 대기';

    return;
  }


  /* 로딩 애니메이션 시작 */

  showLoading(
    '구글시트 데이터를 불러오는 중...'
  );


  $('status').textContent =
    '데이터 불러오는 중...';

  $('status').className =
    'badge';


  try{

    const res =
      await fetch(
        u,
        {
          method:'GET',
          cache:'no-store'
        }
      );


    if(!res.ok){

      throw new Error(
        'HTTP ' + res.status
      );

    }


    const json =
      await res.json();


    if(!json.ok){

      throw new Error(
        json.error ||
        'API 오류'
      );

    }


    data =
      Array.isArray(json.data)
        ? json.data
        : [];


    populate();

    render();


    $('updated').textContent =
      '업데이트 ' +
      (json.updatedAt || '-');


    $('status').textContent =
      '구글시트 연결됨';


    $('status').className =
      'badge good';


    /* 로딩 애니메이션 종료 */

    $('loading')
      .classList
      .add('hidden');


    $('table')
      .classList
      .remove('hidden');


  }
  catch(e){

    console.error(e);


    /* 오류가 나면 회전 아이콘 제거 */

    $('loading').innerHTML = `

      <div
        style="
          font-size:32px;
          margin-bottom:10px
        "
      >
        ⚠
      </div>

      <div class="bad">
        불러오기 실패
      </div>

      <div
        class="small"
        style="margin-top:7px"
      >
        ${esc(e.message)}
      </div>

    `;


    $('status').textContent =
      '연결 실패';


    $('status').className =
      'badge bad';

  }

}


/* =========================================
   필터 목록 생성
   ========================================= */

/* =========================================
   구분명 표준화
   - 띄어쓰기 차이
   - 유사 표현
   - 과거 표기
   를 하나의 구분명으로 통합
   ========================================= */

function normalizeCategory(value){

  const s = String(value || '')
    .replace(/\s+/g,'')
    .trim();

  const map = {

    /* 피난구조설비 */
    '피난구조설비':'피난구조설비',
    '피난구조설비류':'피난구조설비',
    '피난설비':'피난구조설비',
    '피난구조':'피난구조설비',

    /* 소화설비 */
    '소화설비':'소화설비',
    '소화설비류':'소화설비',

    /* 경보설비 */
    '경보설비':'경보설비',
    '경보설비류':'경보설비',

    /* 소화용수설비 */
    '소화용수설비':'소화용수설비',
    '소화용수':'소화용수설비',

    /* 소화활동설비 */
    '소화활동설비':'소화활동설비',
    '소화활동':'소화활동설비',

    /* 기타 자주 쓰는 표현 */
    '방화시설':'방화시설',
    '방화설비':'방화시설',

    '기타':'기타'
  };

  return map[s] || s;
}


function uniq(k){

  const values =
    data
      .map(
        x =>
          String(
            x[k] || ''
          ).trim()
      )
      .filter(Boolean);


  /*
   * '구분' 셀렉트만 표준화하여
   * 피난구조 설비 / 피난구조설비 / 피난설비
   * 같은 중복 표현을 하나로 표시합니다.
   */
  if(k === '구분'){

    return [

      ...new Set(

        values.map(
          v =>
            normalizeCategory(v)
        )

      )

    ].sort(
      (a,b) =>
        a.localeCompare(
          b,
          'ko',
          {
            numeric:true
          }
        )
    );

  }


  return [

    ...new Set(values)

  ].sort(
    (a,b) =>
      a.localeCompare(
        b,
        'ko',
        {
          numeric:true
        }
      )
  );

}


function fill(id,key){

  const s = $(id);

  const label =
    s.options[0].text;


  s.innerHTML =

    `<option value="">
      ${label}
    </option>`

    +

    uniq(key)
      .map(
        v =>
          `<option value="${esc(v)}">
            ${esc(v)}
          </option>`
      )
      .join('');

}


function populate(){

  fill(
    'year',
    '연도'
  );

  fill(
    'kind',
    '점검종류'
  );

  fill(
    'report',
    '신고구분'
  );

  fill(
    'category',
    '구분'
  );

}


/* =========================================
   HTML 문자 처리
   ========================================= */

function esc(v){

  return String(v ?? '')
    .replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );

}


/* =========================================
   검색어 강조
   ========================================= */

function highlight(v,q){

  let s = esc(v);

  if(!q){
    return s;
  }


  const z =
    q.replace(
      /[.*+?^${}()|[\]\\]/g,
      '\\$&'
    );


  return s.replace(
    new RegExp(
      z,
      'gi'
    ),
    m =>
      `<mark>${m}</mark>`
  );

}


/* =========================================
   검색 결과 표시
   ========================================= */

function render(){

  const q =
    $('q')
      .value
      .trim()
      .toLowerCase();


  const y =
    $('year').value;


  const k =
    $('kind').value;


  const r =
    $('report').value;


  const c =
    $('category').value;


  filtered =
    data.filter(
      x =>

        (
          !y ||
          String(
            x['연도']
          ) === y
        )

        &&

        (
          !k ||
          x['점검종류'] === k
        )

        &&

        (
          !r ||
          x['신고구분'] === r
        )

        &&

        (
          !c ||
          normalizeCategory(
            x['구분']
          ) === c
        )

        &&

        (
          !q ||

          HEAD.some(
            h =>
              String(
                x[h] || ''
              )
                .toLowerCase()
                .includes(q)
          )
        )

    );


  $('head').innerHTML =

    HEAD
      .map(
        h =>
          `<th>${h}</th>`
      )
      .join('');


  $('body').innerHTML =

    filtered
      .map(
        x =>

          '<tr>'

          +

          HEAD
            .map(
              h =>
                `<td>
                  ${highlight(
                    x[h],
                    q
                  )}
                </td>`
            )
            .join('')

          +

          '</tr>'

      )
      .join('');


  $('count').textContent =
    filtered.length +
    '건';


  const ys =
    filtered
      .map(
        x =>
          parseInt(
            x['연도']
          )
      )
      .filter(
        Number.isFinite
      );


  $('range').textContent =

    ys.length

      ?

      Math.min(...ys)
      +
      '–'
      +
      Math.max(...ys)

      :

      '연도 -';

}


/* =========================================
   필터 초기화
   ========================================= */

function resetFilters(){

  [
    'q',
    'year',
    'kind',
    'report',
    'category'
  ]
  .forEach(
    id =>
      $(id).value=''
  );


  render();

}


/* =========================================
   CSV 저장
   ========================================= */

function exportCsv(){

  const rows = [

    HEAD,

    ...filtered.map(
      x =>
        HEAD.map(
          h =>
            x[h] || ''
        )
    )

  ];


  const txt =

    rows
      .map(
        r =>
          r.map(
            v =>
              '"'
              +
              String(v)
                .replaceAll(
                  '"',
                  '""'
                )
              +
              '"'
          )
          .join(',')
      )
      .join('\r\n');


  const blob =
    new Blob(
      [
        '\ufeff' +
        txt
      ],
      {
        type:
          'text/csv;charset=utf-8'
      }
    );


  const a =
    document.createElement('a');


  a.href =
    URL.createObjectURL(
      blob
    );


  a.download =
    '서울숲엘타워_소방점검_검색결과.csv';


  a.click();


  URL.revokeObjectURL(
    a.href
  );

}


/* =========================================
   맨 위로 이동 버튼
   ========================================= */

function getTableScroller(){
  return document.querySelector('.tablewrap');
}

function scrollToTop(){
  const scroller=getTableScroller();

  if(scroller && scroller.scrollTop > 0){
    scroller.scrollTo({
      top:0,
      behavior:'smooth'
    });
    return;
  }

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}

function updateTopButton(){
  const btn=document.getElementById('topBtn');
  const scroller=getTableScroller();

  if(!btn){
    return;
  }

  const tableScrolled =
    scroller ? scroller.scrollTop > 120 : false;

  const pageScrolled =
    window.scrollY > 350;

  if(tableScrolled || pageScrolled){
    btn.classList.add('show');
  }else{
    btn.classList.remove('show');
  }
}

window.addEventListener(
  'scroll',
  updateTopButton,
  {passive:true}
);

window.addEventListener(
  'DOMContentLoaded',
  ()=>{
    const scroller=getTableScroller();

    if(scroller){
      scroller.addEventListener(
        'scroll',
        updateTopButton,
        {passive:true}
      );
    }

    updateTopButton();
  }
);


/* =========================================
   페이지 시작
   ========================================= */

window.addEventListener(
  'DOMContentLoaded',
  () => {

    /* 고정 Apps Script URL 사용 */

    if(
      document.getElementById(
        'apiUrl'
      )
    ){
      $('apiUrl').value =
        apiUrl();
    }


    if(
      apiUrl()
    ){

      loadData();

    }

  }
);

</script>

</body>
</html>
