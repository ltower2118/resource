<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서울숲엘타워 통합자료</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f9;font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;color:#1c2530}
header{background:#0e2568;color:#fff;padding:18px}
main{max-width:1500px;margin:auto;padding:12px}
.box,.file{background:#fff;padding:12px;border-radius:10px;margin-bottom:10px}
.g{display:grid;grid-template-columns:260px 1fr 110px;gap:8px}
input,select,button{width:100%;padding:11px;border:1px solid #ccd5df;border-radius:7px;font-size:1rem}
button{background:#0e2568;color:#fff;font-weight:700;cursor:pointer}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tools button{width:auto}
.status{padding:8px 2px;color:#64717d;font-size:.9rem}
.err{color:#b42318}
.file-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.file-head h2{margin:0;font-size:1.1rem}
.meta{font-size:.8rem;color:#64717d}
.row{border:1px solid #d5dce5;border-radius:8px;margin-top:8px;overflow:auto}
.row-title{background:#eaf0f6;padding:7px 9px;font-size:.82rem;font-weight:700}
table{width:100%;border-collapse:collapse;min-width:800px}
td{border:1px solid #d7dde5;padding:7px;font-size:.9rem}
mark{background:#fff09a}
.open{display:inline-block;margin-top:7px;padding:7px 10px;border:1px solid #bfc8d4;border-radius:6px;text-decoration:none;color:#0e2568;font-weight:700;font-size:.85rem}
.busy{display:none;position:fixed;inset:0;background:rgba(10,22,50,.45);z-index:9999;align-items:center;justify-content:center}
.busy.show{display:flex}
.busy-box{background:#fff;padding:24px;border-radius:12px;text-align:center;min-width:220px}
.spinner{width:44px;height:44px;margin:0 auto 12px;border:5px solid #dbe2ef;border-top-color:#0e2568;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.g{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h2 style="margin:0">서울숲엘타워 통합자료</h2></header>

<div class="busy" id="busy">
  <div class="busy-box">
    <div class="spinner"></div>
    <div id="busyText">처리 중...</div>
  </div>
</div>

<main>
  <div class="box">
    <div class="g">
      <select id="f"><option value="all">전체 파일</option></select>
      <input id="q" placeholder="예: 1101호 스프링클러" onkeydown="if(event.key==='Enter')searchFiles()">
      <button onclick="searchFiles()">검색</button>
    </div>

    <div class="tools">
      <button onclick="loadFiles()">파일목록 새로고침</button>
      <button onclick="syncDb()">Excel DB 동기화</button>
    </div>

    <div id="stat" class="status">초기화 중...</div>
  </div>

  <div id="r"></div>
</main>

<script>
const APP_SCRIPT_URL='여기에_APPS_SCRIPT_WEBAPP_URL';
const $=id=>document.getElementById(id);

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  }[c]));
}

function busy(text){
  $('busyText').textContent=text||'처리 중...';
  $('busy').classList.add('show');
}

function unbusy(){
  $('busy').classList.remove('show');
}

async function api(params){
  const u=new URL(APP_SCRIPT_URL);

  Object.entries(params).forEach(([k,v])=>
    u.searchParams.set(k,String(v))
  );

  u.searchParams.set('_',Date.now());

  const res=await fetch(u.toString(),{
    method:'GET',
    cache:'no-store',
    redirect:'follow'
  });

  if(!res.ok) throw new Error('HTTP '+res.status);

  const text=await res.text();

  let j;
  try{j=JSON.parse(text)}
  catch(e){throw new Error('Apps Script 응답이 JSON이 아닙니다.')}

  if(!j.ok) throw new Error(j.error||'Apps Script 오류');

  return j;
}

async function loadFiles(){
  busy('파일목록 불러오는 중...');

  try{
    const j=await api({action:'files'});
    const files=j.files||[];

    $('f').innerHTML=
      '<option value="all">전체 파일</option>'+
      files.map(x=>
        `<option value="${esc(x.id)}">${esc(x.name)}</option>`
      ).join('');

    $('stat').className='status';
    $('stat').textContent='Excel '+files.length+'개';

  }catch(err){
    showErr(err);
  }finally{
    unbusy();
  }
}

async function syncDb(){
  if(!confirm('total 폴더의 Excel 변경사항을 검색DB에 반영할까요?')) return;

  busy('Excel 검색DB 동기화 중...');

  try{
    const j=await api({action:'sync'});

    $('stat').className='status';
    $('stat').textContent=
      `동기화 완료 · 전체 ${j.totalFiles} / 신규 ${j.added} / 갱신 ${j.updated} / 변경없음 ${j.skipped} / 실패 ${j.failed}`;

    await loadFiles();

  }catch(err){
    showErr(err);
  }finally{
    unbusy();
  }
}

async function searchFiles(){
  busy('검색 중...');

  try{
    const q=$('q').value.trim();

    const j=await api({
      action:'search',
      q:q,
      fileId:$('f').value
    });

    $('stat').className='status';
    $('stat').textContent=
      `검색 ${j.totalMatches}건 / ${j.fileMatches}개 파일`;

    render(j.results||[],q);

  }catch(err){
    showErr(err);
  }finally{
    unbusy();
  }
}

function hi(v,q){
  let s=esc(v);

  q.split(/\s+/).filter(Boolean).forEach(term=>{
    const z=term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    s=s.replace(new RegExp(z,'gi'),m=>'<mark>'+m+'</mark>');
  });

  return s;
}

function render(files,q){
  if(!files.length){
    $('r').innerHTML='<div class="box" style="text-align:center;color:#64717d">검색 결과가 없습니다.</div>';
    return;
  }

  $('r').innerHTML=files.map(f=>`
    <section class="file">
      <div class="file-head">
        <div>
          <h2>${esc(f.name)} — ${f.matches}건</h2>
          <a class="open" href="${esc(f.url)}" target="_blank" rel="noopener">원본 Excel 열기</a>
        </div>
        <div class="meta">${esc(f.modifiedTime)}</div>
      </div>

      ${(f.rows||[]).map(row=>`
        <div class="row">
          <div class="row-title">${esc(row.sheet)} · ${row.rowNumber}행</div>
          <table><tbody><tr>
            ${(row.cells||[]).map(c=>`<td>${hi(c,q)}</td>`).join('')}
          </tr></tbody></table>
        </div>
      `).join('')}
    </section>
  `).join('');
}

function showErr(err){
  console.error(err);
  $('stat').className='status err';
  $('stat').textContent='오류: '+(err.message||err);
}

window.addEventListener('DOMContentLoaded',loadFiles);
</script>
</body>
</html>
