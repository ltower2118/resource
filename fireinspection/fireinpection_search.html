<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서울숲엘타워 소방점검 검색</title>
<style>
:root{--navy:#173e63;--bg:#f3f6f9;--line:#dce3ea;--red:#b42318;--green:#087443}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17202a;font-family:Arial,"Noto Sans KR",sans-serif}
header{background:var(--navy);color:#fff;padding:18px 20px}header h1{font-size:21px;margin:0 0 5px}header p{font-size:13px;margin:0;opacity:.88}
main{max-width:1500px;margin:auto;padding:14px}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px}
.config{background:#fff8e7}.grid{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px}
input,select,button{width:100%;padding:10px;border:1px solid #cbd5df;border-radius:8px;background:#fff;font-size:14px}
button{border:0;background:var(--navy);color:#fff;cursor:pointer}.secondary{background:#5d6975}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badge{background:#eaf0f6;border-radius:18px;padding:7px 10px;font-size:13px}
.good{color:var(--green)}.bad{color:var(--red)}.small{font-size:12px;color:#5c6773}.hidden{display:none}
.tablewrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:1250px;background:#fff}th,td{padding:9px;border-bottom:1px solid #e6ebef;text-align:left;vertical-align:top;font-size:13px}
th{position:sticky;top:0;background:#eaf0f6;z-index:2}tr:hover td{background:#f8fbfd}mark{background:#fff09a}
#loading{text-align:center;padding:28px}
@media(max-width:800px){main{padding:8px}.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}header{padding:14px}}
</style>
</head>
<body>
<header>
<h1>서울숲엘타워 소방점검 검색</h1>
<p>2017–2025 종합·작동점검 / 원본·신고자료 통합 검색</p>
</header>
<main>

<div id="config" class="box config">
<b>Apps Script 웹앱 연결</b>
<div class="small" style="margin:6px 0 9px">Apps Script를 웹 앱으로 배포한 뒤 <b>/exec</b> 주소를 입력하세요. 주소는 이 브라우저에 저장됩니다.</div>
<div style="display:grid;grid-template-columns:1fr 130px;gap:8px">
<input id="apiUrl" placeholder="https://script.google.com/macros/s/...../exec">
<button onclick="saveApi()">저장/연결</button>
</div>
</div>

<div class="box">
<div class="grid">
<input class="wide" id="q" placeholder="통합검색: 살수반경, 살수장애, 1306호, 타임게이트, 감지기 미설치..." oninput="render()">
<select id="year" onchange="render()"><option value="">전체 연도</option></select>
<select id="kind" onchange="render()"><option value="">전체 점검종류</option></select>
<select id="report" onchange="render()"><option value="">전체 신고구분</option></select>
<select id="category" onchange="render()"><option value="">전체 구분</option></select>
</div>
<div style="display:flex;gap:8px;margin-top:8px">
<button class="secondary" onclick="resetFilters()">필터 초기화</button>
<button onclick="loadData()">구글시트 새로고침</button>
<button onclick="exportCsv()">검색결과 CSV 저장</button>
</div>
<div class="stats">
<span class="badge" id="count">0건</span>
<span class="badge" id="range">연도 -</span>
<span class="badge" id="updated">업데이트 -</span>
<span class="badge" id="status">연결 대기</span>
</div>
</div>

<div class="tablewrap">
<div id="loading">Apps Script URL을 연결해주세요.</div>
<table id="table" class="hidden">
<thead><tr id="head"></tr></thead>
<tbody id="body"></tbody>
</table>
</div>
</main>

<script>
// 고정 URL 방식으로 쓰려면 아래 따옴표 안에 /exec URL을 직접 넣어도 됩니다.
const APP_SCRIPT_URL = '';

const HEAD = ["연도","점검종류","신고구분","구분","상세구분","점검내역","보완대책","관련법규","원본파일","처리상태"];
let data=[], filtered=[];
const $=id=>document.getElementById(id);

function apiUrl(){
  return APP_SCRIPT_URL || localStorage.getItem('fireInspectionApi') || '';
}
function saveApi(){
  const u=$('apiUrl').value.trim();
  if(!u){alert('Apps Script /exec URL을 입력하세요.');return;}
  localStorage.setItem('fireInspectionApi',u);
  loadData();
}
async function loadData(){
  const u=apiUrl();
  $('apiUrl').value=u;
  if(!u){$('status').textContent='연결 대기';return;}
  $('loading').classList.remove('hidden'); $('table').classList.add('hidden');
  $('loading').textContent='구글시트 데이터를 불러오는 중...';
  try{
    const res=await fetch(u,{method:'GET',cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json=await res.json();
    if(!json.ok) throw new Error(json.error||'API 오류');
    data=Array.isArray(json.data)?json.data:[];
    populate(); render();
    $('updated').textContent='업데이트 '+(json.updatedAt||'-');
    $('status').textContent='구글시트 연결됨';
    $('status').className='badge good';
    $('config').classList.add('hidden');
    $('loading').classList.add('hidden'); $('table').classList.remove('hidden');
  }catch(e){
    $('loading').textContent='불러오기 실패: '+e.message;
    $('status').textContent='연결 실패'; $('status').className='badge bad';
    $('config').classList.remove('hidden');
  }
}
function uniq(k){
  return [...new Set(data.map(x=>String(x[k]||'').trim()).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,'ko',{numeric:true}));
}
function fill(id,key){
  const s=$(id), label=s.options[0].text;
  s.innerHTML=`<option value="">${label}</option>`+
    uniq(key).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
}
function populate(){fill('year','연도');fill('kind','점검종류');fill('report','신고구분');fill('category','구분');}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function highlight(v,q){
  let s=esc(v); if(!q)return s;
  const z=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return s.replace(new RegExp(z,'gi'),m=>`<mark>${m}</mark>`);
}
function render(){
  const q=$('q').value.trim().toLowerCase(), y=$('year').value, k=$('kind').value,
        r=$('report').value, c=$('category').value;
  filtered=data.filter(x=>
    (!y||String(x['연도'])===y)&&(!k||x['점검종류']===k)&&
    (!r||x['신고구분']===r)&&(!c||x['구분']===c)&&
    (!q||HEAD.some(h=>String(x[h]||'').toLowerCase().includes(q)))
  );
  $('head').innerHTML=HEAD.map(h=>`<th>${h}</th>`).join('');
  $('body').innerHTML=filtered.map(x=>'<tr>'+HEAD.map(h=>`<td>${highlight(x[h],q)}</td>`).join('')+'</tr>').join('');
  $('count').textContent=filtered.length+'건';
  const ys=filtered.map(x=>parseInt(x['연도'])).filter(Number.isFinite);
  $('range').textContent=ys.length?Math.min(...ys)+'–'+Math.max(...ys):'연도 -';
}
function resetFilters(){['q','year','kind','report','category'].forEach(id=>$(id).value='');render();}
function exportCsv(){
  const rows=[HEAD,...filtered.map(x=>HEAD.map(h=>x[h]||''))];
  const txt=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='서울숲엘타워_소방점검_검색결과.csv';a.click();URL.revokeObjectURL(a.href);
}
window.addEventListener('DOMContentLoaded',()=>{
  $('apiUrl').value=apiUrl();
  if(apiUrl()) loadData();
});
</script>
</body>
</html>
