<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울숲엘타워</title>
<style>
  :root {
    --color-bg: #fff;
    --color-surface: #ffffff;
    --color-navy: #1c2b39;
    --color-navy-soft: #2c3e4f;
    --color-steel: #5c7080;
    --color-steel-light: #e2e6e9;
    --color-line: #dfe3e2;
    --color-amber: #f2a900;
    --color-amber-dark: #c98700;
    --color-danger: #c0392b;
    --color-ok: #2f6f4e;

    --font-display: "Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Malgun Gothic", Roboto, sans-serif; 
    --font-body: "Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Malgun Gothic", Roboto, sans-serif; 
    --font-mono: "Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Malgun Gothic", Roboto, sans-serif; 

    --radius: 6px;
    --shadow-card: 0 1px 2px rgba(28,43,57,0.06), 0 1px 8px rgba(28,43,57,0.04);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    color: var(--color-navy);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }

  header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background-color: white;
    color: black;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    box-shadow: 0 0px 0px rgba(0,0,0,0.1);
    z-index: 1000;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
  }

  .home-btn svg {
    transition: transform 0.2s ease;
  }
  .home-btn:hover svg {
    transform: scale(1.1);
  }

  .title {
    font-weight: bold;
    font-size: 1.5rem;
    color: #1e3a8a;
  }

  .text2 {
    font-size: 0.95rem;
    color: #454444;
  }

  .page-head {
    padding: 28px 0 16px;
    margin-bottom: 24px;
  }

  .page-head p {
    margin: 6px 0 0;
    color: var(--color-steel);
    font-size: 0.9rem;
  }

  .panel {
    background: var(--color-surface);
    border-radius: var(--radius);
    padding: 18px 18px 18px;
    margin-bottom: 22px;
    border: 1px solid rgba(0, 0, 0, 0.20);
  }

  .panel_wide {
    background: #f1f1f1;
    padding: 18px 22px 18px;
    margin-bottom: 22px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
  }
  @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }

  .form-field { 
    display: flex; 
    flex-direction: column; 
    gap: 6px; 
    color: #383434;
  }

  .form-field.full { 
    grid-column: 1 / -1; 
    color: #383434;
  }

  .form-field label {
    font-size: 1.1rem;
    font-weight: bold;
    color: #383434;
  }

  .form-field input,
  .form-field select,
  .form-field textarea {
    border: 1px solid var(--color-line);
    border-radius: 4px;
    padding: 9px 10px;
    font-size: 1.1rem;
    font-family: var(--font-body);
    background: #f3f4f6;
    color: var(--color-navy);
  }

  .form-field textarea { resize: vertical; min-height: 70px; }

  .form-field input:focus,
  .form-field select:focus,
  .form-field textarea:focus {
    outline: 2px solid var(--color-amber);
    outline-offset: 1px;
    border-color: var(--color-amber);
  }

  /* ---------- 날짜 입력 필드 커스텀 스타일 ---------- */
  .date-input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .date-input-wrapper input[type="date"] {
    width: 100%;
    padding-right: 40px; /* 우측 아이콘 공간 */
    cursor: pointer;
  }

  /* 비어있을 때 '날짜선택하기' 텍스트 표시 */
  .date-input-wrapper input[type="date"]:invalid::-webkit-datetime-edit {
    color: transparent;
  }
  .date-input-wrapper input[type="date"]:invalid:before {
    content: attr(data-placeholder);
    color: #6b7280;
  }

  /* 브라우저 기본 달력 아이콘 영역 확장 (전체 클릭 가능) */
  .date-input-wrapper input[type="date"]::-webkit-calendar-picker-indicator {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: auto;
    height: auto;
    color: transparent;
    background: transparent;
    cursor: pointer;
  }

  /* 우측 우측 날짜 선택 도구 아이콘 */
  .date-input-wrapper .calendar-icon {
    position: absolute;
    right: 12px;
    pointer-events: none;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    min-width: 100%;
    justify-content: center;
    gap: 6px;
    background: #1e3a8a;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 4px;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { background: #527cf6; }
  .btn:disabled { background: var(--color-steel-light); color: var(--color-steel); cursor: not-allowed; }

  .btn.secondary {
    background: #dadada;
    color: #111111;
    border: 1px solid var(--color-line);
    min-width: auto;
  }
  .btn.secondary:hover { background: #b8b9bb; }

  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 14px;
  }

  .toolbar select, .toolbar input[type="search"] {
    border: 1px solid var(--color-line);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 0.9rem;
    background: #fff;
  }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  table.data-table th {
    text-align: left;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-steel);
    border-bottom: 2px solid var(--color-navy);
    padding: 8px 8px;
    white-space: nowrap;
  }

  table.data-table td {
    padding: 10px 8px;
    border-bottom: 1px solid var(--color-line);
    vertical-align: top;
  }

  table.data-table tbody tr:hover { background: #e8edfb; }

  .badge {
    display: inline-block;
    font-size: 0.9rem;
    font-family: var(--font-mono);
    padding: 2px 7px;
    border-radius: 3px;
    background: var(--color-steel-light);
    color: var(--color-navy);
  }
  .badge.elec { background: #ccddf9; color: #1e3a8a; }
  .badge.fire { background: #fbdedb; color: var(--color-danger); }
  .badge.comm { background: #e1f7dc; color: #1c5d8a; }
  .badge.mech { background: #e6e6e6; color: var(--color-ok); }

  .status-msg {
    font-size: 12.5px;
    padding: 8px 10px;
    border-radius: 4px;
    margin-top: 10px;
    display: none;
  }
  .status-msg.ok { display: block; background: #d6dffb; color: #1e3a8a; font-size: 1.1rem; }
  .status-msg.err { display: block; background: #fbdedb; color: #1e3a8a; font-size: 1.1rem; }
  .status-msg.pending { display: block; background: var(--color-steel-light); color: var(--color-steel); font-size: 1.1rem; }

  .empty-state {
    text-align: center;
    padding: 32px 12px;
    color: var(--color-steel);
    font-size: 13px;
  }

  .setup-note {
    background: #fdecc8;
    border: 1px solid var(--color-amber);
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 12.5px;
    color: var(--color-navy);
    margin-bottom: 18px;
  }

  .footer-note {
    margin-top: 40px;
    padding-top: 14px;
    border-top: 1px solid var(--color-line);
    font-size: 11.5px;
    color: var(--color-steel);
    text-align: center;
  }
</style>
</head>

<header>
  <h1>서울숲엘타워</h1>
  <a href="index.html" class="home-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="black" stroke-width="2" viewBox="0 0 24 24">
      <path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H10v7H5a1 1 0 0 1-1-1V9.5z"/>
    </svg>
  </a>
</header>

<body>

<main class="wrap">

  <div class="page-head">
    <br><br><br>
    <div class="title">작업 입력하기 </div>
    <p>구글시트에 자동 저장되고, 아래 목록에서 바로 조회할 수 있습니다.</p>
  </div>

  <div class="setup-note" id="setupNote">
    ⚠ 최초 1회 설정 필요: 이 파일 맨 아래 &lt;script&gt; 안의 <code>SCRIPT_URL</code>에
    구글 Apps Script 웹앱 URL을 넣어야 저장/조회가 동작합니다.
  </div>

  <div class="panel">
    <form id="historyForm">
      <div class="form-grid">
        <div class="form-field">
          <label for="date">날짜</label>
          <div style="height: 3px; background-color: #383434; margin: 0px 0;"></div>
          
          <!-- 우측 날짜 선택 도구 아이콘 포함 패널 -->
          <div class="date-input-wrapper">
            <input 
              type="date" 
              id="date" 
              data-placeholder="날짜선택하기" 
              required 
              onclick="try{this.showPicker();}catch(e){}">
            <svg class="calendar-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
        </div>

        <div class="form-field">
          <label for="category">구분</label>
          <div style="height: 1px; background-color: #383434; margin: 0px 0;"></div>
          <select id="category" required>
            <option value="">선택</option>
            <option value="전기">전기</option>
            <option value="소방">소방</option>
            <option value="통신">통신</option>
            <option value="기계">기계</option>
            <option value="기타">기타</option>
          </select>
        </div>
        
        <div class="form-field">
          <label for="location">위치 / 내용</label>
          <div style="height: 1px; background-color: #383434; margin: 0px 0;"></div>
          <input type="text" id="location" placeholder="예: 옥상 / 전기실 / 지하2층 주차장" required>
        </div>
        <div class="form-field full">
          <label for="content">작업내용</label>
          <div style="height: 1px; background-color: #383434; margin: 0px 0;"></div>
          <textarea id="content" placeholder="점검/고장/조치 내용을 입력하세요" required></textarea>
        </div>
        <div class="form-field">
          <label for="handler">작업자</label>
          <div style="height: 1px; background-color: #383434; margin: 0px 0;"></div>
          <input type="text" id="handler" placeholder="예: 홍길동" required>
        </div>
        <div class="form-field full">
          <label for="note">비고</label>
          <div style="height: 1px; background-color: #383434; margin: 0px 0;"></div>
          <textarea id="note" placeholder="특이사항, 후속조치 필요 여부 등 (선택)"></textarea>
        </div>
      </div>
      <div style="margin-top:16px;">
        <button type="submit" class="btn" id="submitBtn">저장하기</button>
      </div>
      <div class="status-msg" id="formStatus"></div>
    </form>
  </div>
</main>

<div class="panel_wide" style="max-width: 1080px; margin: 0 auto 22px;">
  <div class="title">이력조회하기</div>
  <p class="text2">아래 목록에서 바로 조회할 수 있습니다.</p>
  <div style="height: 1px; background-color: #ccc; margin: 20px 0;"></div>
  <div class="toolbar">
    <select id="catFilter">
      <option value="">전체 구분</option>
      <option value="전기">전기</option>
      <option value="소방">소방</option>
      <option value="통신">통신</option>
      <option value="기계">기계</option>
      <option value="기타">기타</option>
    </select>
    <input type="search" id="searchBox" placeholder="위치/작업내용/작업자 검색" style="min-width:220px">
    <button class="btn secondary" id="refreshBtn" type="button">새로고침</button>
  </div>
  <table class="data-table">
    <thead>
      <tr>
        <th>날짜</th>
        <th>구분</th>
        <th>위치 / 내용</th>
        <th>작업내용</th>
        <th>작업자</th>
        <th>비고</th>
      </tr>
    </thead>
    <tbody id="listBody"></tbody>
  </table>
  <div class="empty-state" id="emptyState" style="display:none;">등록된 이력이 없습니다.</div>
</div>

<p class="footer-note">서울숲엘타워 관리단 · 전기과 내부 자료 · 무단 외부 공유 금지</p>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbweYKQzJozN4HtV1HZbnFtbM7FcqTz491aK-EnRmEBVk_NflVxD7fxMAs8740prwVgZ-g/exec";

const badgeClass = { "전기": "elec", "소방": "fire", "통신": "comm", "기계": "mech", "기타": "" };

function formatDateOnly(value) {
  if (!value) return '';
  const d = new Date(value);
  if (!isNaN(d.getTime())) {
    const y = d.getFullYear();
    const mo = String(d.getMonth() + 1).padStart(2, '0');
    const da = String(d.getDate()).padStart(2, '0');
    return y + '.' + mo + '.' + da;
  }
  const m = String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[1] + '.' + m[2] + '.' + m[3] : String(value);
}

function isConfigured() {
  return SCRIPT_URL && SCRIPT_URL.indexOf("https://script.google.com") === 0;
}

if (isConfigured()) {
  document.getElementById('setupNote').style.display = 'none';
}

let allRows = [];

async function loadHistory() {
  const listBody = document.getElementById('listBody');
  const emptyState = document.getElementById('emptyState');
  if (!isConfigured()) {
    listBody.innerHTML = '';
    emptyState.style.display = 'block';
    emptyState.textContent = 'SCRIPT_URL 설정 후 이력이 표시됩니다.';
    return;
  }
  try {
    const res = await fetch(SCRIPT_URL + '?action=list');
    const json = await res.json();
    if (!json.success) throw new Error(json.error || '조회 실패');
    allRows = json.data || [];
    renderList();
  } catch (err) {
    listBody.innerHTML = '';
    emptyState.style.display = 'block';
    emptyState.textContent = '이력을 불러오지 못했습니다 (' + err.message + ')';
  }
}

function renderList() {
  const cat = document.getElementById('catFilter').value;
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const listBody = document.getElementById('listBody');
  const emptyState = document.getElementById('emptyState');

  const filtered = allRows.filter(function (row) {
    const matchesCat = !cat || row['구분'] === cat;
    const haystack = [row['위치/내용'], row['작업내용'], row['작업자']].join(' ').toLowerCase();
    const matchesText = !q || haystack.includes(q);
    return matchesCat && matchesText;
  }).sort(function (a, b) {
    return formatDateOnly(b['날짜']).localeCompare(formatDateOnly(a['날짜']));
  });

  listBody.innerHTML = '';
  if (filtered.length === 0) {
    emptyState.style.display = 'block';
    emptyState.textContent = '조건에 맞는 이력이 없습니다.';
    return;
  }
  emptyState.style.display = 'none';

  filtered.forEach(function (row) {
    const tr = document.createElement('tr');
    const cls = badgeClass[row['구분']] || '';
    tr.innerHTML =
      '<td>' + formatDateOnly(row['날짜']) + '</td>' +
      '<td><span class="badge ' + cls + '">' + (row['구분'] || '') + '</span></td>' +
      '<td>' + (row['위치/내용'] || '') + '</td>' +
      '<td>' + (row['작업내용'] || '') + '</td>' +
      '<td>' + (row['작업자'] || '') + '</td>' +
      '<td>' + (row['비고'] || '') + '</td>';
    listBody.appendChild(tr);
  });
}

document.getElementById('catFilter').addEventListener('change', renderList);
document.getElementById('searchBox').addEventListener('input', renderList);
document.getElementById('refreshBtn').addEventListener('click', loadHistory);

document.getElementById('historyForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const statusEl = document.getElementById('formStatus');
  const submitBtn = document.getElementById('submitBtn');

  if (!isConfigured()) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = '먼저 SCRIPT_URL을 설정해야 저장할 수 있습니다.';
    return;
  }

  const payload = {
    date: document.getElementById('date').value,
    category: document.getElementById('category').value,
    location: document.getElementById('location').value,
    content: document.getElementById('content').value,
    handler: document.getElementById('handler').value,
    note: document.getElementById('note').value
  };

  submitBtn.disabled = true;
  statusEl.className = 'status-msg pending';
  statusEl.textContent = '저장 중...';

  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error || '저장 실패');

    statusEl.className = 'status-msg ok';
    statusEl.textContent = '저장되었습니다.';
    document.getElementById('historyForm').reset();
    loadHistory();
  } catch (err) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = '저장 중 오류가 발생했습니다: ' + err.message;
  } finally {
    submitBtn.disabled = false;
  }
});

// 초기화
loadHistory();
</script>

</body>
</html>
