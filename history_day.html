<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울숲엘타워</title>
<style>
  body { font-family: "Pretendard Variable", "Noto Sans KR", sans-serif; padding: 20px; }
  .form-field { display: flex; gap: 8px; margin-bottom: 16px; }
  .form-field input { flex: 1; padding: 9px 10px; border: 1px solid #dfe3e2; border-radius: 4px; font-size: 1.1rem; }
  .btn { background: #1e3a8a; color: #fff; border: none; padding: 10px 18px; border-radius: 4px; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
  .btn:hover { background: #527cf6; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; border-bottom: 2px solid #1c2b39; padding: 8px; }
  td { padding: 10px 8px; border-bottom: 1px solid #dfe3e2; vertical-align: top; }
  mark { background: #fdecc8; }
</style>
</head>
<body>
  <h1>일일 점검일지 검색</h1>
  <div class="form-field">
    <input type="text" id="searchBox" placeholder="검색어 입력..." onkeydown="if(event.key==='Enter') searchData()">
    <button class="btn" onclick="searchData()">검색</button>
  </div>

  <div id="subSearchBox" style="display:none; flex-direction:column; gap:8px; margin-bottom:16px;">
    <input type="text" id="subSearchInput" placeholder="검색 결과 내에서 세부검색..." style="width:100%; padding:9px 10px; border:1px solid #dfe3e2; border-radius:4px; font-size:1.1rem;" onkeydown="if(event.key==='Enter') subSearchData()">
    <button class="btn" onclick="subSearchData()">세부검색</button>
    <button class="btn" style="background:#888;" onclick="resetSubSearch()">초기화</button>
  </div>
  <div id="resultCount" style="margin-bottom:10px; color:#5c7080; font-size:0.95rem;"></div>

  <table id="logTable" style="display:none;">
    <thead>
      <tr>
        <th>날짜</th>
        <th>요일</th>
        <th>작성자</th>
        <th>업무사항</th>
        <th>향후 추진사항</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/10jiv1BSN8DzlEcXxIoThB8qQi3kbnP_NNjShQLGGEs4/gviz/tq?tqx=out:json";

    // 구글 시트가 날짜 셀을 "Date(2018,1,22,0,0,0)" 형태 문자열로 주는 걸
    // "2018.2.22" 형태로 바꿔주는 함수 (월은 0부터 시작하므로 +1 필요)
    function parseGoogleDate(value) {
      if (typeof value !== "string" || !value.startsWith("Date(")) {
        return value; // 날짜 타입이 아니면 원본 그대로 반환
      }
      const nums = value.match(/\d+/g).map(Number);
      const [y, m, d] = nums; // m은 0-indexed
      return `${y}.${m + 1}.${d}`;
    }

    function formatTasks(text) {
      if (!text) return "";
      // 각 번호(1. 2. 3. ...) 앞에 줄바꿈을 넣어 항목별로 줄이 나뉘게 함
      return String(text).replace(/(\d+\.)/g, "<br>$1").replace(/^<br>/, "");
    }

    function highlightText(text, keyword) {
      if (!keyword) return text;
      const regex = new RegExp(`(${keyword})`, "gi");
      return String(text).replace(regex, "<mark>$1</mark>");
    }

    // 시트 전체 데이터를 파싱해서 배열로 보관 (매 검색마다 다시 fetch하지 않도록)
    let allRows = [];
    let firstSearchResults = []; // 1차 검색 결과 (세부검색의 대상이 됨)
    let firstKeyword = "";

    function loadAllRows() {
      if (allRows.length > 0) {
        return Promise.resolve(allRows);
      }
      return fetch(sheetUrl)
        .then(res => res.text())
        .then(data => {
          const json = JSON.parse(data.substr(47).slice(0, -2));
          allRows = json.table.rows.map(r => ({
            date: parseGoogleDate(r.c[0]?.v || ""),
            day: r.c[1]?.v || "",
            author: r.c[2]?.v || "",
            task: r.c[3]?.v || "",
            next: r.c[4]?.v || ""
          }));
          return allRows;
        });
    }

    function rowMatches(row, keyword) {
      const rowText = `${row.date} ${row.day} ${row.author} ${row.task} ${row.next}`.toLowerCase();
      return rowText.includes(keyword);
    }

    function renderRows(rows, keywords) {
      let html = "";
      rows.forEach(row => {
        let dateHtml = row.date, dayHtml = row.day, authorHtml = row.author,
            taskHtml = formatTasks(row.task), nextHtml = row.next;
        keywords.forEach(kw => {
          if (!kw) return;
          dateHtml = highlightText(dateHtml, kw);
          dayHtml = highlightText(dayHtml, kw);
          authorHtml = highlightText(authorHtml, kw);
          taskHtml = highlightText(taskHtml, kw);
          nextHtml = highlightText(nextHtml, kw);
        });
        html += `<tr>
          <td>${dateHtml}</td>
          <td>${dayHtml}</td>
          <td>${authorHtml}</td>
          <td>${taskHtml}</td>
          <td>${nextHtml}</td>
        </tr>`;
      });
      document.getElementById("tableBody").innerHTML = html;
      document.getElementById("logTable").style.display = html ? "table" : "none";
      document.getElementById("resultCount").textContent = rows.length ? `검색결과 ${rows.length}건` : "검색결과 없음";
    }

    function searchData() {
      const keyword = document.getElementById("searchBox").value.trim().toLowerCase();
      firstKeyword = keyword;
      loadAllRows().then(rows => {
        firstSearchResults = rows.filter(row => rowMatches(row, keyword));
        renderRows(firstSearchResults, [keyword]);
        // 결과가 있으면 세부검색창 표시, 세부검색 입력값 초기화
        document.getElementById("subSearchInput").value = "";
        document.getElementById("subSearchBox").style.display = firstSearchResults.length ? "flex" : "none";
      });
    }

    function subSearchData() {
      const subKeyword = document.getElementById("subSearchInput").value.trim().toLowerCase();
      const filtered = subKeyword
        ? firstSearchResults.filter(row => rowMatches(row, subKeyword))
        : firstSearchResults;
      renderRows(filtered, [firstKeyword, subKeyword]);
    }

    function resetSubSearch() {
      document.getElementById("subSearchInput").value = "";
      renderRows(firstSearchResults, [firstKeyword]);
    }
  </script>
</body>
</html>
