<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <style>
        /* 기본 스타일 및 컬러셋 정의 (서브페이지의 세련된 톤 적용) */
        :root {
            --bg-color: #f4f6f9;
            --primary-color: #1e3d59; /* 신뢰감을 주는 모던 네이비 */
            --secondary-color: #17b890; /* 세련된 포인트 그린 */
            --text-dark: #333333;
            --text-light: #ffffff;
            --card-bg: #ffffff;
            --footer-bg: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Pretendard Variable", Pretendard,"Noto Sans KR", -apple-system, BlinkMacSystemFont,"Malgun Gothic", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* 상단 헤더 / 타이틀 영역 */
        header {
            background: #1e3a8a;
            color: var(--text-light);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 4px solid var(--secondary-color);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.85;
        }

        /* 메인 컨테이너 */
        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 25px 15px 60px 15px;
        }

        /* 메뉴 섹션 제목 */
        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 15px 0 15px 5px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 그리드 형태의 카드 메뉴 레이아웃 (반응형) */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        /* 가로 스크롤 가능한 카드 메뉴 레이아웃 */
        .menu-grid.horizontal-scroll {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            gap: 15px;
            margin-bottom: 30px;
            scroll-behavior: smooth;
            padding: 5px 0;
            scrollbar-width: none;
            padding-right: 15px;
        }

        /* Firefox 스크롤바 숨기기 */
        .menu-grid.horizontal-scroll {
            -ms-overflow-style: none;
        }

        /* Chrome, Safari, Edge 스크롤바 숨기기 */
        .menu-grid.horizontal-scroll::-webkit-scrollbar {
            display: none;
        }

        /* 시각적인 카드 메뉴 스타일 */
        .menu-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            text-decoration: none;
            color: var(--text-dark);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.03);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            }

            .menu-card img{
                width:200px;
                height:200px;
                object-fit:contain;
            }

            .menu-card span{
                display:block;
                font-size:20px;
                font-weight:600;
                margin-top:10px;
            }
        /* 가로 스크롤 카드 - 첫 번째 카드 크게 */
        .menu-grid.horizontal-scroll .menu-card {
            min-width: 320px;
            flex-shrink: 0;
            padding: 30px 20px;
        }

        /* 첫 번째 카드만 더 크게 */
        .menu-grid.horizontal-scroll .menu-card:first-child {
            min-width: 320px;
            min-height: 400px;
            padding: 40px 25px;
        }

        /* 마우스 호버 효과 */
        .menu-card:hover {
            transform: translateY(1px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border-color: var(--secondary-color);
        }

        /* 이모지 아이콘 스타일 */
        .menu-icon {
            font-size: 2.2rem;
            margin-bottom: 12px;
            transition: transform 0.3s ease;
        }

        .menu-grid.horizontal-scroll .menu-card:first-child .menu-icon {
            font-size: 3rem;
        }

        .menu-card:hover .menu-icon {
            transform: scale(1.15);
        }

        /* 메뉴 텍스트 스타일 */
        .menu-title {
            font-size: 1.0rem;
            font-weight: 600;
            color: #222;
        }

        .menu-grid.horizontal-scroll .menu-card:first-child .menu-title {
            font-size: 1.0rem;
        }

        /* 안내 및 알림 배너 스타일 */
        .info-banner {
            background-color: #eef7f4;
            border-left: 4px solid var(--secondary-color);
            padding: 15px;
            border-radius: 4px 12px 12px 4px;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .info-banner h3 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

     
        /* foot 섹션 */
        .copyright { font-size: 0.9rem; color: #969697; margin: 0 0 12px 0;  border-bottom: 2px ; padding-bottom: 6px; text-align: center;}

        /* 모바일 최적화 미디어 쿼리 */
        @media (max-width: 480px) {
            header { padding: 30px 15px; }
            header h1 { font-size: 1.5rem; }
            .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .menu-card { padding: 18px 10px; }
            .menu-icon { font-size: 1.8rem; }
            .menu-title { font-size: 0.9rem; }
        }
    </style>
</head>
