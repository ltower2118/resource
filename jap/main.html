<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일본어 플래시카드</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17202a;--muted:#6b7280;--main:#2563eb;--danger:#dc2626;--line:#e5e7eb}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.topbar{height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);z-index:10}
.title{font-size:17px;font-weight:800}.top-right{display:flex;align-items:center;gap:6px}
.counter-btn{border:0;background:#eef2f7;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:800;color:#374151}
.icon-btn{width:40px;height:40px;border:0;border-radius:12px;background:transparent;font-size:22px}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;padding:7px;touch-action:pan-y}
.track{position:relative;width:100%;height:100%}
.flash{position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 5px 20px rgba(0,0,0,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 18px;user-select:none;-webkit-user-select:none;touch-action:pan-y;will-change:transform,opacity;transition:transform .22s cubic-bezier(.22,.61,.36,1),opacity .22s ease}
.flash.dragging{transition:none}.hidden{display:none!important}
.type{position:absolute;top:15px;left:15px;font-size:12px;color:var(--main);font-weight:800;padding:5px 9px;background:#eff6ff;border-radius:999px}
.jp{
  width:100%;
  max-width:100%;
  max-height:52vh;
  overflow:auto;
  padding:8px 4px;
  font-size:clamp(24px,9vw,72px);
  font-weight:800;
  line-height:1.45;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word;
  user-select:text;
  -webkit-user-select:text;
  cursor:text;
}
.reading{font-size:clamp(17px,3vw,23px);color:var(--muted);margin-top:13px}
.answer{display:none;width:min(92%,700px);margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}.answer.show{display:block}
.ko{font-size:clamp(23px,5vw,34px);font-weight:750;line-height:1.45}.memo{font-size:16px;color:var(--muted);margin-top:10px;white-space:pre-wrap}
.hint{position:absolute;bottom:15px;left:0;right:0;font-size:12px;color:#9ca3af}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px;background:#fff;border:1px solid var(--line);border-radius:22px}
.menu{position:fixed;top:58px;right:10px;z-index:30;width:min(92vw,340px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.menu-row{display:flex;gap:8px;margin-bottom:8px}.menu input,.menu select,.menu button{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:11px;background:#fff}.menu button{font-weight:700}.menu button.primary{background:var(--main);color:#fff;border-color:var(--main)}
.status{font-size:12px;color:var(--muted);padding:5px 3px 0}
.list-screen{position:fixed;inset:54px 0 0;z-index:20;background:var(--bg);overflow:auto;padding:10px}
.list-head{position:sticky;top:-10px;z-index:2;display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:8px 2px 10px}.close-btn,.mini{border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:8px 10px;font-weight:700}.danger{color:var(--danger)}
.listItem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:8px;display:flex;gap:8px;align-items:center}.listText{flex:1;min-width:0}.listText b{font-size:18px}.small{font-size:13px;color:var(--muted);margin-top:4px}
dialog{border:0;border-radius:20px;padding:0;width:min(94vw,600px);max-height:90dvh;box-shadow:0 20px 60px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(0,0,0,.45)}
.modal,.jump-box{padding:20px;overflow:auto}.modal h2,.jump-box h2{margin:0 0 12px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px}.field textarea{min-height:76px;resize:vertical}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.modal-actions button{padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-weight:700}.modal-actions .primary{background:var(--main);color:#fff;border-color:var(--main)}

.jump-controls{display:grid;grid-template-columns:1fr auto;gap:8px}.jump-controls input{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:13px;font-size:18px;text-align:center}.jump-controls button{border:0;border-radius:11px;padding:0 18px;background:var(--main);color:#fff;font-weight:800}
.quick-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px;max-height:42vh;overflow:auto}.quick-numbers button{border:1px solid #dbe1e8;background:#fff;border-radius:10px;min-height:42px;font-weight:700}.quick-numbers button.current{background:var(--main);color:#fff;border-color:var(--main)}.jump-close{width:100%;margin-top:12px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:11px;font-weight:700}

.select-tools{
  position:fixed;z-index:60;display:flex;gap:6px;
  background:#17202a;padding:6px;border-radius:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.28);
}
.select-tools button{
  border:0;background:#fff;color:#17202a;border-radius:8px;
  padding:8px 10px;font-size:13px;font-weight:800;white-space:nowrap;
}
.select-tools button:active{transform:scale(.96)}


.lookup-box{
  position:fixed;z-index:70;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:min(90vw,420px);background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.28);
}
.lookup-word{font-size:30px;font-weight:800;margin-bottom:8px}
.lookup-kana{font-size:22px;color:var(--main);font-weight:750;margin-bottom:10px}
.lookup-meaning{font-size:18px;line-height:1.5;margin-bottom:14px}
.lookup-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lookup-actions button{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:10px;font-weight:700}
.lookup-loading{color:var(--muted);font-size:14px}


.jp.jp-medium{font-size:clamp(26px,6.5vw,50px)}
.jp.jp-long{font-size:clamp(20px,4.8vw,38px)}
.jp.jp-xlong{font-size:clamp(17px,3.8vw,30px);line-height:1.55}


/* Gemini AI */
.gemini-card-btn{
  position:absolute;left:14px;bottom:13px;z-index:4;
  border:1px solid #d8dee8;background:#fff;color:#445;
  border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800;
  box-shadow:0 2px 8px rgba(0,0,0,.06)
}
.gemini-card-btn:active{transform:scale(.97)}
.gemini-overlay{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;padding:12px;
  background:rgba(0,0,0,.48)
}
.gemini-overlay.show{display:flex}
.gemini-panel{
  width:min(96vw,720px);height:min(88dvh,860px);
  background:#fff;border-radius:18px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.28);
  display:flex;flex-direction:column
}
.gemini-head{
  flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);background:#fff
}
.gemini-title{font-size:14px;font-weight:800}
.gemini-head-actions{display:flex;gap:6px}
.gemini-mini-btn{
  border:1px solid #cbd5e1;background:#fff;color:#334155;
  border-radius:9px;padding:7px 9px;font-size:12px;font-weight:800
}
.gemini-close{
  border:0;background:#eef2f7;width:34px;height:34px;
  border-radius:10px;font-size:20px;line-height:1
}
.gemini-frame-wrap{position:relative;flex:1;min-height:0;background:#f8fafc}
.gemini-frame{width:100%;height:100%;border:0;background:#fff}
.gemini-help{
  position:absolute;inset:auto 12px 12px 12px;padding:9px 10px;
  border-radius:10px;background:rgba(255,255,255,.92);
  border:1px solid #e5e7eb;color:#64748b;font-size:11px;line-height:1.45;
  pointer-events:none

  .gemini-panel{width:100%;height:92dvh;border-radius:16px}
  .gemini-card-btn{left:10px;bottom:10px}
}

@media(max-width:520px){.stage{padding:5px}.flash{border-radius:19px;padding:24px 14px}.jp{font-size:clamp(22px,10vw,54px);max-height:50vh}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="title">🇯🇵 일본어11</div><div class="top-right"><button id="counter" class="counter-btn" onclick="openJump()">0 / 0</button><button class="icon-btn" onclick="toggleMenu()">☰</button></div></header>
<main class="stage"><div class="track">
<div id="empty" class="empty">카드를 불러오는 중입니다…</div>
<div id="flash" class="flash hidden">
<div id="cardType" class="type"></div><div id="cardJp" class="jp"></div><div id="cardReading" class="reading"></div>
<div id="answer" class="answer"><div id="cardKo" class="ko"></div><div id="cardMemo" class="memo"></div></div>
<button type="button" class="gemini-card-btn" onclick="openGemini()">✦ Gemini AI</button>
<div class="hint">터치: 뜻 보기 · 좌우 밀기: 카드 이동<br>Made by Ai & Ha You Sin</div>

</div></div></main>
</div>

  <button type="button" onclick="speakSelected()">🔊 발음</button>
  <button type="button" onclick="lookupSelected()">あ 히라가나·뜻</button>
  <button type="button" onclick="translateSelected()">Google 번역</button>

  <div id="lookupWord" class="lookup-word"></div>

  <div class="lookup-actions">
    <button type="button" onclick="speakLookup()">🔊 발음 듣기</button>

<div id="geminiOverlay" class="gemini-overlay" aria-hidden="true">
  <div class="gemini-panel" role="dialog" aria-modal="true" aria-label="Gemini AI">
    <div class="gemini-head">
      <div class="gemini-title">✦ Gemini AI</div>
      <div class="gemini-head-actions">
        <button type="button" class="gemini-mini-btn" onclick="openGeminiNewWindow()">새 창</button>
        <button type="button" class="gemini-close" onclick="closeGemini()" aria-label="닫기">×</button>
      </div>
    </div>
    <div class="gemini-frame-wrap">
      <iframe id="geminiFrame" class="gemini-frame" title="Gemini 공유 대화"
        referrerpolicy="strict-origin-when-cross-origin"

        Gemini 공유대화가 이 창 안에서 열리지 않는 경우 <b>새 창</b> 버튼을 이용하세요.

<div id="menu" class="menu hidden">
<div class="menu-row"><input id="search" placeholder="검색"></div>
<div class="menu-row"><select id="filter"><option value="all">전체</option><option value="단어">단어</option><option value="문장">문장</option></select></div>
<div class="menu-row"><button class="primary" onclick="openAdd()">＋ 새 카드</button><button onclick="editCurrent()">수정</button></div>
<div class="menu-row"><button onclick="showList()">목록</button><button onclick="syncCards(true)">↻ 동기화</button></div>
<div id="syncStatus" class="status">준비</div>
</div>

<section id="listView" class="list-screen hidden"><div class="list-head"><b>카드 목록</b><button class="close-btn" onclick="hideList()">닫기</button></div><div id="list"></div></section>

<dialog id="jumpDialog"><div class="jump-box"><h2>카드 번호 이동</h2><div class="jump-controls"><input id="jumpInput" type="number" min="1" inputmode="numeric"><button onclick="jumpFromInput()">이동</button></div><div id="quickNumbers" class="quick-numbers"></div><button class="jump-close" onclick="jumpDialog.close()">닫기</button></div></dialog>

<dialog id="editor"><form class="modal" onsubmit="saveCard(event)">
<h2 id="editorTitle">새 카드</h2><input id="id" type="hidden">
<div class="field"><label>종류</label><select id="type"><option>단어</option><option>문장</option></select></div>
<div class="field"><label>일본어</label><input id="jp" placeholder="例: 日本語"></div>
<div class="field"><label>읽는 법</label><input id="reading" placeholder="예: 니혼고"></div>
<div class="field"><label>한국어 뜻</label><input id="ko" placeholder="예: 일본어"></div>
<div class="field"><label>메모</label><textarea id="memo"></textarea></div>
<div class="modal-actions"><button type="button" onclick="editor.close()">취소</button><button class="primary" type="submit">바로 저장</button></div>
</form></dialog>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbz8N3ge2yOEmytvCf75-8OOrTdQPxK16ZvBYQItW-osw3gegHGJ1kYlAJke8hTASanY/exec';
// Gemini 공유 대화 주소를 여기에 고정 입력하세요.
const GEMINI_SHARE_URL='https://share.gemini.google/mqLQ1GumPdpM';
const CACHE_KEY='jp_flashcards_cache_v9';
let cards=[],viewCards=[],current=0;
let startX=0,startY=0,currentX=0,dragging=false,moved=false,animating=false;
let selectedJapanese='';
const $=id=>document.getElementById(id);

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let cacheSaveTimer=null;
function loadCache(){
  try{
    const x=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(Array.isArray(x)&&x.length){
      cards=normalizeCards(x);
      applyFilter(false);
      $('syncStatus').textContent='저장된 카드 표시 · 최신 확인 중…';
      return true;
    }
  }catch(_){}
  return false;
}
function saveCache(){
  clearTimeout(cacheSaveTimer);
  cacheSaveTimer=setTimeout(()=>{
    try{
      localStorage.setItem(CACHE_KEY,JSON.stringify(cards));
    }catch(_){}
  },250);
}

function normalizeCard(c,index=0){
  c=c||{};
  return {
    id:String(c.id??c.ID??c.no??c.row??index+1),
    type:String(c.type||c.kind||'단어').trim()||'단어',
    jp:String(c.jp??c.japanese??c.word??'').trim(),
    reading:String(c.reading??c.kana??c.yomi??'').trim(),
    ko:String(c.ko??c.meaning??c.korean??'').trim(),
    memo:String(c.memo??c.note??'').trim()
  };
}

function normalizeCards(list){
  if(!Array.isArray(list))return [];
  return list
    .map((c,i)=>normalizeCard(c,i))
    // 한 칸이라도 내용이 있으면 카드로 유지
    .filter(c=>c.jp||c.ko||c.reading||c.memo);
}

function cardsSignature(list){
  if(!Array.isArray(list)||!list.length)return '0';
  const first=list[0]||{};
  const last=list[list.length-1]||{};
  return [
    list.length,
    first.id||'',
    first.jp||'',
    last.id||'',
    last.jp||''
  ].join('|');
}

async function request(action,data={}){
 const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data}),cache:'no-store'});
 const j=await r.json();if(!j.ok)throw new Error(j.error||'요청 실패');return j;
}
let syncRunning=false;
let lastSyncSignature='';

async function syncCards(manual=false){
  if(syncRunning){
    if(manual)$('syncStatus').textContent='이미 동기화 중…';
    return;
  }

  syncRunning=true;
  $('syncStatus').textContent=manual?'최신 자료 동기화 중…':'시트 확인 중…';

  try{
    const j=await request('list');
    const nextCards=normalizeCards(j.cards||[]);
    const nextSig=cardsSignature(nextCards);

    if(nextSig!==lastSyncSignature || !cards.length){
      cards=nextCards;
      lastSyncSignature=nextSig;
      saveCache();

      // 현재 카드만 즉시 갱신하고, 목록 화면은 열려 있을 때만 렌더링
      applyFilter(false);
    }

    $('syncStatus').textContent='최신 동기화 완료 · '+cards.length+'개';

  }catch(e){
    $('syncStatus').textContent=
      cards.length
        ? '연결 지연 · 저장된 카드 사용'
        : '연결 실패';

    if(!cards.length){
      $('empty').textContent=e.message||'카드를 불러오지 못했습니다.';
    }
  }finally{
    syncRunning=false;
  }
}
function applyFilter(renderListToo=true){
  const q=$('search').value.trim().toLowerCase();
  const f=$('filter').value;

  viewCards=cards.filter(c=>{
    const hit=!q||
      [c.jp,c.ko,c.reading,c.memo]
        .join(' ')
        .toLowerCase()
        .includes(q);

    return hit&&(f==='all'||c.type===f);
  });

  current=Math.min(
    current,
    Math.max(0,viewCards.length-1)
  );

  render();

  // 목록 화면이 실제로 열려 있을 때만 대량 DOM 생성
  if(
    renderListToo &&
    !$('listView').classList.contains('hidden')
  ){
    renderList();
  }
}
function fitJapaneseText(text=''){
 const el=$('cardJp');
 el.classList.remove('jp-medium','jp-long','jp-xlong');
 const len=Array.from(String(text)).length;
 if(len>80)el.classList.add('jp-xlong');
 else if(len>45)el.classList.add('jp-long');
 else if(len>20)el.classList.add('jp-medium');
}

function render(){
 hideSelectTools();
 if(!viewCards.length){$('empty').classList.remove('hidden');$('flash').classList.add('hidden');$('counter').textContent='0 / 0';return}
 const c=viewCards[current];$('empty').classList.add('hidden');$('flash').classList.remove('hidden');
 $('cardType').textContent=c.type||'단어';
 $('cardJp').textContent=c.jp||c.reading||c.ko||'(내용 없음)';
 fitJapaneseText(c.jp||c.reading||c.ko||'');
 $('cardReading').textContent=c.reading||'';
 $('cardKo').textContent=c.ko||'';
 $('cardMemo').textContent=c.memo||'';
 $('answer').classList.remove('show');
 $('counter').textContent=`${current+1} / ${viewCards.length}`;
 $('flash').style.transform='translateX(0)';$('flash').style.opacity='1';
}

function hideSelectTools(){
  $('selectTools').classList.add('hidden');
}
function getSelectedJapanese(){
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0)return '';
  const text=sel.toString().trim();
  if(!text)return '';
  const range=sel.getRangeAt(0);
  const node=range.commonAncestorContainer.nodeType===1
    ?range.commonAncestorContainer
    :range.commonAncestorContainer.parentElement;
  if(!node||!$('cardJp').contains(node))return '';
  return text;
}
function showSelectionTools(){
  setTimeout(()=>{
    const text=getSelectedJapanese();
    if(!text){hideSelectTools();return;}
    selectedJapanese=text;
    const sel=window.getSelection();
    const rect=sel.getRangeAt(0).getBoundingClientRect();
    const box=$('selectTools');
    box.classList.remove('hidden');

    const boxW=box.offsetWidth||150;
    const boxH=box.offsetHeight||44;
    let left=rect.left+(rect.width/2)-(boxW/2);
    let top=rect.top-boxH-10;

    left=Math.max(8,Math.min(window.innerWidth-boxW-8,left));
    if(top<8)top=Math.min(window.innerHeight-boxH-8,rect.bottom+10);

    box.style.left=left+'px';
    box.style.top=top+'px';
  },30);
}

/* 스마트폰/브라우저 내장 일본어 음성: 별도 다운로드 없음 */
function speakSelected(){
  const text=selectedJapanese||getSelectedJapanese();
  if(!text)return;
  hideSelectTools();

  if(!('speechSynthesis' in window)){
    alert('이 브라우저에서는 음성 읽기를 지원하지 않습니다.');
    return;
  }

  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';
  u.rate=.85;

  const voices=speechSynthesis.getVoices();
  const ja=voices.find(v=>
    String(v.lang||'').toLowerCase().startsWith('ja')
  );
  if(ja)u.voice=ja;

  speechSynthesis.speak(u);
}


let lookupText='';

async function lookupSelected(){
  const text=selectedJapanese||getSelectedJapanese();
  if(!text)return;
  hideSelectTools();
  lookupText=text;

  $('lookupWord').textContent=text;
  $('lookupKana').textContent='';
  $('lookupMeaning').textContent='';
  $('lookupLoading').classList.remove('hidden');
  $('lookupBox').classList.remove('hidden');

  try{
    const j=await request('lookup',{text:text});
    $('lookupKana').textContent=j.kana||'';
    $('lookupMeaning').textContent=j.meaning||'';
  }catch(e){
    $('lookupMeaning').textContent='히라가나/뜻을 불러오지 못했습니다.';
  }finally{
    $('lookupLoading').classList.add('hidden');
  }
}

function closeLookup(){
  $('lookupBox').classList.add('hidden');
}

function speakLookup(){
  if(!lookupText||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(lookupText);
  u.lang='ja-JP';
  u.rate=.85;
  speechSynthesis.speak(u);
}

/* 선택한 일본어만 Google 번역 새 창으로 열기 */
function translateSelected(){
  const text=selectedJapanese||getSelectedJapanese();
  if(!text)return;
  hideSelectTools();
  const url='https://translate.google.com/?sl=ja&tl=ko&text='+
    encodeURIComponent(text)+'&op=translate';
  window.open(url,'_blank','noopener,noreferrer');
}

$('cardJp').addEventListener('pointerup',e=>{
  /* 텍스트 선택이 있으면 카드 뒤집기/스와이프보다 선택 도구 우선 */
  setTimeout(()=>{
    if(getSelectedJapanese()){
      moved=true;
      showSelectionTools();
    }
  },0);
});

$('cardJp').addEventListener('touchend',()=>{
  setTimeout(()=>{
    if(getSelectedJapanese()){
      moved=true;
      showSelectionTools();
    }
  },120);
});

document.addEventListener('selectionchange',()=>{
  const text=getSelectedJapanese();
  if(!text)hideSelectTools();
});

function flipCard(){if(!animating&&!moved)$('answer').classList.toggle('show')}

const flash=$('flash');
flash.addEventListener('pointerdown',e=>{if(animating||!viewCards.length)return;dragging=true;moved=false;startX=e.clientX;startY=e.clientY;currentX=0;flash.classList.add('dragging');try{flash.setPointerCapture(e.pointerId)}catch(_){}});
flash.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(!moved&&Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>8){dragging=false;flash.classList.remove('dragging');return}if(Math.abs(dx)>6)moved=true;currentX=dx;flash.style.transform=`translateX(${dx}px)`;flash.style.opacity=Math.max(.55,1-Math.abs(dx)/((flash.clientWidth||1)*1.4))});
flash.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;flash.classList.remove('dragging');const threshold=Math.min(90,flash.clientWidth*.16);if(Math.abs(currentX)>=threshold)swipe(currentX<0?1:-1);else{flash.style.transform='translateX(0)';flash.style.opacity='1';if(!moved)flipCard();setTimeout(()=>moved=false,0)}});
flash.addEventListener('pointercancel',()=>{dragging=false;flash.classList.remove('dragging');flash.style.transform='translateX(0)';flash.style.opacity='1'});
function swipe(step){if(animating)return;animating=true;const w=flash.clientWidth;flash.style.transform=`translateX(${step>0?-w:w}px)`;flash.style.opacity='0';setTimeout(()=>{current=(current+step+viewCards.length)%viewCards.length;render();flash.classList.add('dragging');flash.style.transform=`translateX(${step>0?w:-w}px)`;flash.style.opacity='0';void flash.offsetWidth;flash.classList.remove('dragging');requestAnimationFrame(()=>{flash.style.transform='translateX(0)';flash.style.opacity='1'});setTimeout(()=>{animating=false;moved=false},230)},190)}


function getGeminiUrl(){
  const url=String(GEMINI_SHARE_URL||'').trim();

  if(
    !url ||
    url.includes('여기에_공유주소_ID')
  ){
    alert(
      'HTML의 GEMINI_SHARE_URL에 실제 Gemini 공유 대화 주소를 입력하세요.'
    );
    return '';
  }

  return url;
}

function openGemini(){
  const url=getGeminiUrl();
  if(!url)return;

  hideSelectTools();

  const overlay=$('geminiOverlay');
  const frame=$('geminiFrame');

  frame.src=url;
  overlay.classList.add('show');
  overlay.setAttribute('aria-hidden','false');
}

function closeGemini(){
  const overlay=$('geminiOverlay');
  const frame=$('geminiFrame');

  overlay.classList.remove('show');
  overlay.setAttribute('aria-hidden','true');

  // 닫을 때 iframe 해제
  frame.src='about:blank';
}

function openGeminiNewWindow(){
  const url=getGeminiUrl();
  if(!url)return;

  window.open(
    url,
    '_blank',
    'noopener,noreferrer'
  );
}

$('geminiOverlay').addEventListener('pointerdown',e=>{
  if(e.target.id==='geminiOverlay'){
    closeGemini();
  }
});

document.addEventListener('keydown',e=>{
  if(
    e.key==='Escape' &&
    $('geminiOverlay').classList.contains('show')
  ){
    closeGemini();
  }
});

function toggleMenu(){hideSelectTools();$('menu').classList.toggle('hidden')}
document.addEventListener('pointerdown',e=>{if(!$('menu').classList.contains('hidden')&&!$('menu').contains(e.target)&&!e.target.closest('.icon-btn'))$('menu').classList.add('hidden')});

function openJump(){if(!viewCards.length)return;$('jumpInput').value=current+1;$('jumpInput').max=viewCards.length;$('quickNumbers').innerHTML=Array.from({length:viewCards.length},(_,i)=>`<button class="${i===current?'current':''}" onclick="jumpTo(${i+1})">${i+1}</button>`).join('');jumpDialog.showModal();setTimeout(()=>$('quickNumbers').querySelector('.current')?.scrollIntoView({block:'center'}),20)}
function jumpFromInput(){const n=parseInt($('jumpInput').value,10);if(n>=1&&n<=viewCards.length)jumpTo(n)}
function jumpTo(n){current=n-1;render();jumpDialog.close()}

function openAdd(){$('menu').classList.add('hidden');$('editorTitle').textContent='새 카드';['id','jp','reading','ko','memo'].forEach(x=>$(x).value='');$('type').value='단어';editor.showModal()}
function editCurrent(){$('menu').classList.add('hidden');if(viewCards.length)openEdit(viewCards[current].id)}
function openEdit(id){const c=cards.find(x=>String(x.id)===String(id));if(!c)return;$('editorTitle').textContent='카드 수정';$('id').value=c.id;$('type').value=c.type||'단어';$('jp').value=c.jp||'';$('reading').value=c.reading||'';$('ko').value=c.ko||'';$('memo').value=c.memo||'';editor.showModal()}

async function saveCard(e){
  e.preventDefault();

  const card={
    id:$('id').value,
    type:$('type').value,
    jp:$('jp').value.trim(),
    reading:$('reading').value.trim(),
    ko:$('ko').value.trim(),
    memo:$('memo').value.trim()
  };

  if(!card.jp&&!card.reading&&!card.ko&&!card.memo){
    alert('일본어, 읽는 법, 한국어 뜻, 메모 중 하나 이상 입력하세요.');
    return;
  }

  try{
    const action=card.id?'update':'add';
    const j=await request(action,{card});

    if(action==='add'&&j.card&&j.card.id){
      card.id=j.card.id;
    }

    const normalized=normalizeCard(card,cards.length);
    const i=cards.findIndex(x=>String(x.id)===String(normalized.id));

    if(i>=0)cards[i]={...cards[i],...normalized};
    else cards.push(normalized);

    saveCache();
    editor.close();
    applyFilter(false);
    $('syncStatus').textContent='저장 완료';

    // 저장 직후 전체 재동기화는 잠깐 뒤에 실행하여 UI를 먼저 반응시킴
    setTimeout(()=>syncCards(false),350);

  }catch(err){
    alert(err.message);
  }
}
async function deleteCard(id){if(!confirm('이 카드를 삭제할까요?'))return;try{await request('delete',{id});cards=cards.filter(x=>String(x.id)!==String(id));saveCache();applyFilter();$('syncStatus').textContent='삭제 완료'}catch(e){alert(e.message)}}

function showList(){$('menu').classList.add('hidden');renderList();$('listView').classList.remove('hidden')}
function hideList(){$('listView').classList.add('hidden')}
function renderList(){const box=$('list');if(!viewCards.length){box.innerHTML='<div class="listItem">카드가 없습니다.</div>';return}box.innerHTML=viewCards.map(c=>`<div class="listItem"><div class="listText"><b>${esc(c.jp)}</b><div>${esc(c.ko)}</div><div class="small">${esc(c.type||'단어')} ${c.reading?'· '+esc(c.reading):''}</div></div><button class="mini" onclick="openEdit('${c.id}')">수정</button><button class="mini danger" onclick="deleteCard('${c.id}')">삭제</button></div>`).join('')}

$('search').addEventListener('input',()=>applyFilter(true));
$('filter').addEventListener('change',()=>applyFilter(true));

/* 핵심: 캐시를 먼저 즉시 표시하고 시트 동기화는 뒤에서 시작 */
const hadCache=loadCache();
if(!hadCache){$('empty').textContent='카드를 불러오는 중입니다…'}
setTimeout(()=>syncCards(false),0);
</script>
