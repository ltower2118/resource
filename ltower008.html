<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏢 지식산업센터 엑셀 연동형 통합 제어 허브</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; }
        body { background-color: #0f172a; padding: 12px; margin: 0; color: #f8fafc; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* 다크모드 헤더 */
        .hub-header { text-align: center; padding: 15px 0; border-bottom: 1px solid #334155; margin-bottom: 15px; }
        .hub-header h1 { margin: 0; font-size: 1.25rem; color: #38bdf8; font-weight: bold; }
        .hub-header p { margin: 4px 0 0 0; font-size: 0.8rem; color: #94a3b8; }

        .group-title { font-size: 0.9rem; font-weight: bold; color: #94a3b8; margin: 20px 0 10px 4px; letter-spacing: 0.5px; }

        /* 🚨 상황 맞춤형 긴급 시나리오 카드 */
        .scenario-container { display: flex; flex-direction: column; gap: 8px; }
        .scenario-card { display: flex; align-items: center; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-decoration: none; color: #f8fafc; transition: all 0.15s; }
        .scenario-card:active { background: #334155; transform: scale(0.99); }
        .scenario-badge { width: 42px; height: 42px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin-right: 12px; flex-shrink: 0; }
        .scenario-info { display: flex; flex-direction: column; }
        .scenario-question { font-size: 0.9rem; font-weight: bold; color: #e2e8f0; }
        .scenario-action { font-size: 0.75rem; color: #38bdf8; margin-top: 3px; }

        .bg-danger { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.3) !important; }
        .bg-danger .scenario-badge { background: #ef4444; }
        .bg-danger .scenario-action { color: #fca5a5; }

        /* 📊 엑셀 CSV 데이터 표 렌더링 스타일 */
        .excel-table-wrapper { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px; overflow-x: auto; }
        .excel-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; color: #e2e8f0; text-align: left; min-width: 400px; }
        .excel-table th { background: #0f172a; color: #38bdf8; font-weight: bold; padding: 10px 8px; border-bottom: 2px solid #334155; }
        .excel-table td { padding: 10px 8px; border-bottom: 1px solid #334155; line-height: 1.4; }
        .excel-table tr:last-child td { border-bottom: none; }
        
        /* 배지 스타일 */
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; background: #475569; color: white; }
        
        .loading-text { text-align: center; font-size: 0.85rem; color: #94a3b8; padding: 20px 0; }
        .error-text { text-align: center; font-size: 0.85rem; color: #f87171; padding: 20px 0; }
   // index.html 맨 아래 <script> 안의 fetch 부분을 이 코드로 교체하세요.

const csvFileName = "facility_list.csv"; 

fetch(csvFileName)
    .then(response => {
        if (!response.ok) {
            throw new Error("엑셀 CSV 파일을 찾을 수 없습니다.");
        }
        // 원래 response.text()였던 부분을 arrayBuffer()로 받아옵니다 (글자 깨짐 방지)
        return response.arrayBuffer();
    })
    .then(buffer => {
        // 💡 한국어 엑셀 전용 CP949(EUC-KR) 디코더로 한글 깨짐을 강제 해결합니다.
        const decoder = new TextDecoder("cp949");
        const text = decoder.decode(buffer);

        const lines = text.split("\n").map(line => line.trim()).filter(line => line.length > 0);
        if (lines.length === 0) {
            document.getElementById("table-container").innerHTML = "<div class='error-text'>❌ 엑셀 파일에 데이터가 없습니다.</div>";
            return;
        }

        let html = "<table class='excel-table'><thead><tr>";
        const headers = parseCSVLine(lines[0]);
        headers.forEach(header => {
            html += `<th>${header}</th>`;
        });
        html += "</tr></thead><tbody>";

        for (let i = 1; i < lines.length; i++) {
            const columns = parseCSVLine(lines[i]);
            if (columns.length === headers.length || columns.length > 1) {
                html += "<tr>";
                columns.forEach((col, index) => {
                    if(index === 0) {
                        html += `<td><span class='badge'>${col}</span></td>`;
                    } else {
                        html += `<td>${col}</td>`;
                    }
                });
                html += "</tr>";
            }
        }
        html += "</tbody></table>";
        document.getElementById("table-container").innerHTML = html;
    })
    .catch(error => {
        console.error(error);
        document.getElementById("table-container").innerHTML = 
            `<div class='error-text'>❌ 엑셀 연동 실패<br><span style='font-size:0.75rem; color:#64748b; font-weight:normal;'>파일이 없거나 인코딩 오류입니다.</span></div>`;
    });
 </style>
</head>
<body>

<div class="container">
    
    <div class="hub-header">
        <h1>🏢 서울숲엘타워 통합 시설제어반</h1>
        <p>엑셀 데이터 실시간 동기화 스마트 대시보드</p>
    </div>

    <div class="group-title">🚨 현장 상황별 비상 대응 매뉴얼</div>
    <div class="scenario-container">
        <a href="index5.html" class="scenario-card bg-danger">
            <div class="scenario-badge">⚡</div>
            <div class="scenario-info">
                <span class="scenario-question">건물 전체 불이 꺼지고 정전이 발생했습니까?</span>
                <span class="scenario-action">➡️ [클릭] 7페이지 분량 완벽 복전 시퀀스 매뉴얼 열기</span>
            </div>
        </a>
    </div>

    <div class="group-title">📊 엑셀 데이터 연동: 전반 시설물 및 관리대장</div>
    <div class="excel-table-wrapper">
        <div id="table-container">
            <div class="loading-text">🔄 facility_list.csv 파일에서 데이터를 불러오는 중...</div>
        </div>
    </div>

    <div class="group-title">📞 원터치 긴급 콜센터</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <a href="tel:123" style="display: flex; align-items: center; justify-content: center; gap: 6px; background: #334155; color: #fca5a5; padding: 12px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: bold; border: 1px solid #ef4444;">
            📞 한전 고장 (123)
        </a>
        <a href="tel:0222420110" style="display: flex; align-items: center; justify-content: center; gap: 6px; background: #334155; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: bold; border: 1px solid #475569;">
            🛗 승강기 고장 (AS)
        </a>
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 깃허브 저장소에 올린 CSV 파일 이름
        const csvFileName = "facility_list.CSV"; 

        fetch(csvFileName)
            .then(response => {
                if (!response.ok) {
                    throw new Error("엑셀 CSV 파일을 찾을 수 없거나 불러오지 못했습니다.");
                }
                return response.text();
            })
            .then(text => {
                const lines = text.split("\n").map(line => line.trim()).filter(line => line.length > 0);
                if (lines.length === 0) {
                    document.getElementById("table-container").innerHTML = "<div class='error-text'>❌ 엑셀 파일에 데이터가 없습니다.</div>";
                    return;
                }

                let html = "<table class='excel-table'><thead><tr>";
                
                // 1. 헤더 행 처리 (첫 번째 줄)
                const headers = parseCSVLine(lines[0]);
                headers.forEach(header => {
                    html += `<th>${header}</th>`;
                });
                html += "</tr></thead><tbody>";

                // 2. 데이터 행 처리 (두 번째 줄부터 끝까지)
                for (let i = 1; i < lines.length; i++) {
                    const columns = parseCSVLine(lines[i]);
                    if (columns.length === headers.length || columns.length > 1) {
                        html += "tr";
                        columns.forEach((col, index) => {
                            // 첫 번째 열(분류)은 예쁘게 배지 처리해주는 보너스 디자인
                            if(index === 0) {
                                html += `<td><span class='badge'>${col}</span></td>`;
                            } else {
                                html += `<td>${col}</td>`;
                            }
                        });
                        html += "</tr>";
                    }
                }
                html += "</tbody></table>";
                document.getElementById("table-container").innerHTML = html;
            })
            .catch(error => {
                console.error(error);
                document.getElementById("table-container").innerHTML = 
                    `<div class='error-text'>❌ 엑셀 연동 실패<br><span style='font-size:0.75rem; color:#94a3b8;'>저장소 메인 폴더에 [facility_list.csv] 파일이 있는지 확인해 주세요.</span></div>`;
            });

        // 엑셀 내 쉼표(,) 데이터 깨짐 방지 파서 함수
        function parseCSVLine(text) {
            let p = '', r = [];
            let q = false;
            for (let i = 0; i < text.length; i++) {
                let c = text.charAt(i);
                if (c === '"') { q = !q; }
                else if (c === ',' && !q) { r.push(p); p = ''; }
                else { p += c; }
            }
            r.push(p);
            return r;
        }
    });
</script>

</body>
</html>
