<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>현장 작업 매뉴얼</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#1b2531;font-family:system-ui,'Malgun Gothic',sans-serif}header{background:#153d6a;color:#fff;padding:18px}header>div,main{max-width:1120px;margin:auto}header h1{font-size:22px;margin:0}header small{color:#e3e9f2}main{padding:16px}.card{background:#fff;border-radius:10px;padding:16px;margin:12px 0;box-shadow:0 2px 9px #142d4210}#search{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.item{padding:15px 8px;border-bottom:1px solid #e6ebf0;cursor:pointer}.item:hover{background:#f5f8fc}.item:last-child{border:0}.muted{font-size:13px;color:#687688}.hidden{display:none!important}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.btn{border:0;border-radius:7px;padding:10px 14px;background:#dfe8f5;color:#173b69;cursor:pointer;font:inherit}.btn.primary{background:#18317a;color:#fff}.manual-sheet{background:white;border:1px solid #222;overflow:hidden}.sheet-title{border-bottom:1px solid #222;text-align:center;padding:18px 10px;font-weight:800;font-size:24px}.sheet-meta{display:grid;grid-template-columns:105px minmax(0,1fr) 105px minmax(0,1fr);border-bottom:1px solid #222}.sheet-meta .label,.sheet-meta .value{padding:11px 9px;min-width:0;overflow-wrap:anywhere;border-right:1px solid #222}.sheet-meta>*:last-child{border-right:0}.sheet-meta .label{background:#e7edf5;font-weight:700}.sheet-meta .value{white-space:pre-wrap}.sheet-meta.full{grid-template-columns:105px minmax(0,1fr)}.sheet-head{display:grid;grid-template-columns:65px 36% minmax(0,1fr) 23%;background:#e7edf5;border-bottom:1px solid #222;font-weight:700;text-align:center}.sheet-head>div{padding:10px 5px;border-right:1px solid #222}.sheet-head>div:last-child{border-right:0}.sheet-step{display:grid;grid-template-columns:65px 36% minmax(0,1fr) 23%;border-bottom:1px solid #222;min-height:245px}.sheet-step:last-child{border-bottom:0}.sheet-step>div{border-right:1px solid #222;min-width:0}.sheet-step>div:last-child{border-right:0}.step-no{display:flex;align-items:center;justify-content:center;font-weight:700}.step-photo{display:flex;align-items:center;justify-content:center;padding:10px;min-height:220px}.step-photo img{width:100%;max-height:340px;object-fit:contain;display:block;cursor:zoom-in}.photo-missing{color:#8a94a4;font-size:13px;text-align:center}.step-desc,.step-caution{padding:14px 12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.step-desc strong{display:block;margin-bottom:9px}.step-caution{background:#fffdf6}.step-caution strong{display:block;margin-bottom:8px;color:#7a4b0b}.step-caution.empty{background:white}.sheet-footer{text-align:center;padding:10px;color:#687688;font-size:12px}.notice{color:#9b3d35;font-size:13px;margin:8px 0}.image-dialog{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:100;padding:18px;cursor:zoom-out}.image-dialog.show{display:flex}.image-dialog img{max-width:100%;max-height:94vh;object-fit:contain}@media(max-width:700px){main{padding:9px}.card{padding:11px}.sheet-title{font-size:20px}.sheet-meta{grid-template-columns:83px 1fr 83px 1fr;font-size:13px}.sheet-meta.full{grid-template-columns:83px 1fr}.sheet-meta .label,.sheet-meta .value{padding:9px 6px}.sheet-head{display:none}.sheet-step{display:grid;grid-template-columns:45px minmax(0,1fr);min-height:0}.step-no{grid-row:1 / span 3;border-right:1px solid #222}.sheet-step .step-photo,.sheet-step .step-desc,.sheet-step .step-caution{grid-column:2;border-right:0}.step-photo{min-height:190px;padding:9px}.step-photo img{max-height:360px}.step-desc,.step-caution{border-top:1px solid #222;padding:12px}.step-caution{min-height:45px}}@media print{header,#home,.actions,#error,.image-dialog{display:none!important}body{background:white}main{max-width:none;padding:0}.card{padding:0;margin:0;box-shadow:none}.manual-sheet{border:1px solid #222}.sheet-step{break-inside:avoid;page-break-inside:avoid}.step-photo img{max-height:250px}@page{size:A4 portrait;margin:9mm}}
</style>
</head>
<body>
<header><div><h1>현장 작업 매뉴얼7</h1><small>사진으로 보는 표준작업지침서</small></div></header>
<main>
<div id="home"><input id="search" placeholder="매뉴얼 제목 또는 설비 검색" aria-label="매뉴얼 검색"><div id="list" class="card">매뉴얼을 불러오는 중...</div></div>
<div id="detail" class="hidden"><div class="actions"><button class="btn" id="back" type="button">← 목록으로</button><button class="btn primary" id="copy" type="button">이 매뉴얼 주소 복사</button><button class="btn" id="print" type="button">인쇄 / PDF 저장</button></div><article id="content" class="card"></article></div>
<p id="error" class="notice" role="status"></p>
</main>
<div id="imageDialog" class="image-dialog" role="dialog" aria-label="사진 확대"><img id="largeImage" alt="확대 사진"></div>
<script>
'use strict';
// 직원용 공개 Apps Script /exec 주소. 기존 주소 유지.
const API_URL='https://script.google.com/macros/s/AKfycbxae0ODjghlDSbwj2qG_5JF3wybQ8Fsph0Nq9e3uyGUBULPKahBujlsdnUmoHcDVK3UrA/exec';
let manuals=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
 const q=$('search').value.trim().toLowerCase();
 const a=manuals.filter(m=>String(m.title||'').concat(' ',m.category||'').toLowerCase().includes(q));
 $('list').innerHTML=a.map(m=>`<div class="item" role="button" tabindex="0" data-id="${esc(m.id)}"><strong>${esc(m.title)}</strong><div class="muted">${esc(m.category)} · ${(m.steps||[]).length}단계 · ${esc(m.updated)}</div></div>`).join('')||'<p>검색 결과가 없습니다.</p>';
 $('list').querySelectorAll('.item').forEach(el=>{const go=()=>location.hash=encodeURIComponent(el.dataset.id);el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
}
function route(){
 let id='';try{id=decodeURIComponent(location.hash.slice(1));}catch(e){id=location.hash.slice(1);}
 const m=manuals.find(x=>String(x.id)===id);
 $('home').classList.toggle('hidden',!!m);$('detail').classList.toggle('hidden',!m);
 if(!m)return;
 const steps=Array.isArray(m.steps)?m.steps:[];
 $('content').innerHTML=`<div class="manual-sheet"><div class="sheet-title">현장 작업 매뉴얼</div><div class="sheet-meta full"><div class="label">제목</div><div class="value"><strong>${esc(m.title)}</strong></div></div><div class="sheet-meta"><div class="label">분류</div><div class="value">${esc(m.category||'-')}</div><div class="label">최종 수정일</div><div class="value">${esc(m.updated||'-')}</div></div><div class="sheet-head"><div>순서</div><div>현장 사진</div><div>작업 설명</div><div>주의사항</div></div>${steps.map((s,i)=>`<section class="sheet-step"><div class="step-no">${i+1}</div><div class="step-photo">${s.image?`<img loading="lazy" src="${esc(s.image)}" alt="작업 ${i+1} 사진" data-zoom="1" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span class=&quot;photo-missing&quot;>사진을 표시할 수 없습니다</span>')">`:'<span class="photo-missing">사진 없음</span>'}</div><div class="step-desc"><strong>${esc(s.name||'작업 '+(i+1))}</strong>${esc(s.description||'')}</div><div class="step-caution ${s.caution?'':'empty'}">${s.caution?`<strong>주의사항</strong>${esc(s.caution)}`:''}</div></section>`).join('')}<div class="sheet-footer">현장 작업 매뉴얼 · 총 ${steps.length}단계</div></div>`;
 $('content').querySelectorAll('[data-zoom]').forEach(img=>img.onclick=()=>{$('largeImage').src=img.src;$('imageDialog').classList.add('show');});
 window.scrollTo(0,0);
}
function sopCallback(data){if(data&&data.error){$('list').textContent='매뉴얼을 불러오지 못했습니다.';$('error').textContent=String(data.error);return;}manuals=Array.isArray(data&&data.items)?data.items:[];render();route();}
window.sopCallback=sopCallback;
$('search').addEventListener('input',render);
$('back').onclick=()=>{location.hash='';route();};
$('copy').onclick=()=>{const url=location.href;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>alert('매뉴얼 주소를 복사했습니다.')).catch(()=>prompt('주소를 복사하세요',url));}else prompt('주소를 복사하세요',url);};
$('print').onclick=()=>window.print();
$('imageDialog').onclick=()=>{$('imageDialog').classList.remove('show');$('largeImage').removeAttribute('src');};
window.addEventListener('hashchange',route);
if(API_URL.includes('PASTE_')){$('list').textContent='Apps Script 주소를 입력하세요.';}else{const script=document.createElement('script');script.src=API_URL+(API_URL.includes('?')?'&':'?')+'callback=sopCallback&t='+Date.now();script.onerror=()=>{$('list').textContent='목록을 불러오지 못했습니다.';$('error').textContent='Apps Script 배포 URL과 공개 권한을 확인하세요.';};document.head.appendChild(script);}
</script>
</body></html>
