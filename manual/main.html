<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>현장 작업 매뉴얼</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;color:#172333;background:#f3f6fa}header{background:#153d6a;color:white;padding:20px}header div,main{max-width:1000px;margin:auto}h1{font-size:23px;margin:0}main{padding:18px}input{width:100%;padding:14px;border:1px solid #d2d9e2;border-radius:12px;font:inherit}.card{background:white;border-radius:14px;padding:17px;margin:12px 0;box-shadow:0 2px 8px #142d4210}.item{cursor:pointer;border-bottom:1px solid #e9edf1;padding:16px 4px}.item:last-child{border:0}.item:hover{background:#f6f9fc}.muted{color:#667687;font-size:13px}.back{border:0;background:#dce7f3;color:#143c67;border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer}.step{border-top:1px solid #e4e8ef;padding:22px 0}.step img{width:100%;max-height:620px;object-fit:contain;background:#f3f5f8;border-radius:10px}.step p{white-space:pre-wrap;line-height:1.8}.caution{background:#fff5df;padding:12px;border-radius:9px}.hidden{display:none}@media(min-width:760px){.step{display:grid;grid-template-columns:48% 1fr;gap:24px}.step img{grid-column:1}.step .copy{grid-column:2}.step:not(:has(img)) .copy{grid-column:1/-1}}@media print{header,#search,#back{display:none!important}body{background:white}.card{box-shadow:none}}</style></head><body><header><div><h1>현장 작업 매뉴얼v4</h1><small>사진으로 보는 표준작업지침서</small></div></header><main><div id="home"><input id="search" placeholder="매뉴얼 제목 또는 설비 검색" oninput="render()"><div id="list" class="card">매뉴얼을 불러오는 중...</div></div><div id="detail" class="hidden"><button id="back" class="back" onclick="history.back()">← 목록으로</button><article id="content" class="card"></article><button class="back" onclick="copyLink()">이 매뉴얼 주소 복사</button></div><p id="error" class="muted"></p></main><script>
// 아래 주소만 본인의 Apps Script 웹 앱 /exec 주소로 바꾸세요.
const API_URL='https://script.google.com/macros/s/AKfycbznyXDqoD60SANMOEbFbKfbbTAu92uwOaRK6Lkpi0yVtItEqR1yaXfQT606s_60PjFnDQ/exec';
let manuals=[];const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=$('search').value.toLowerCase().trim(),a=manuals.filter(m=>(m.title+' '+m.category).toLowerCase().includes(q));$('list').innerHTML=a.map(m=>`<div class="item" data-id="${esc(m.id)}"><strong>${esc(m.title)}</strong><div class="muted">${esc(m.category)} · ${m.steps.length}단계 · ${esc(m.updated)}</div></div>`).join('')||'<p>검색 결과가 없습니다.</p>';document.querySelectorAll('.item').forEach(el=>el.onclick=()=>location.hash=encodeURIComponent(el.dataset.id));}
function route(){const id=decodeURIComponent(location.hash.slice(1));const m=manuals.find(x=>x.id===id);$('home').classList.toggle('hidden',!!m);$('detail').classList.toggle('hidden',!m);if(!m)return;$('content').innerHTML=`<div class="muted">${esc(m.category)} · ${esc(m.updated)}</div><h2>${esc(m.title)}</h2>${m.steps.map((s,i)=>`<section class="step">${s.image?`<img loading="lazy" src="${esc(s.image)}" alt="${i+1}단계 사진">`:''}<div class="copy"><h3>${i+1}. ${esc(s.name)}</h3><p>${esc(s.description)}</p>${s.caution?`<div class="caution"><strong>주의사항</strong><p>${esc(s.caution)}</p></div>`:''}</div></section>`).join('')}`;window.scrollTo(0,0);}
function copyLink(){navigator.clipboard.writeText(location.href).then(()=>alert('매뉴얼 주소를 복사했습니다.')).catch(()=>prompt('주소를 복사하세요',location.href));}
function sopCallback(data){manuals=data.items||[];render();route();}
window.addEventListener('hashchange',route);
if(API_URL.includes('PASTE_')){$('list').textContent='설치 안내에 따라 Apps Script URL을 입력하세요.';}else{const script=document.createElement('script');script.src=API_URL+(API_URL.includes('?')?'&':'?')+'callback=sopCallback&t='+Date.now();script.onerror=()=>$('error').textContent='매뉴얼을 불러오지 못했습니다. Apps Script 배포 주소와 공개 권한을 확인하세요.';document.head.appendChild(script);}
</script></body></html>
