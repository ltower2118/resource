<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>현장 작업 매뉴얼</title>
<style>
:root{--line:#b8c1cb;--navy:#173e69;--ink:#172333;--paper:#fff;--pale:#f0f4fa}
*{box-sizing:border-box}body{margin:0;background:#f1f4f8;color:var(--ink);font-family:system-ui,'Malgun Gothic',sans-serif}header{background:var(--navy);color:white;padding:18px 20px}header>div,main{max-width:1080px;margin:auto}header h1{margin:0;font-size:22px}header small{opacity:.85}header.hidden{display:none}main{padding:14px}.hidden{display:none!important}.card{background:white;border-radius:12px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #142d4210}input{width:100%;padding:14px;border:1px solid #d1d8e1;border-radius:10px;font:inherit}.item{display:block;padding:15px 8px;border-bottom:1px solid #e7ebf0;cursor:pointer}.item:last-child{border-bottom:0}.item:hover{background:#f5f8fb}.muted{color:#647487;font-size:13px}.tools{display:flex;gap:7px;margin:0 0 9px}.tools button{border:1px solid #d9e1eb;background:#f8fafc;color:#334b66;border-radius:7px;padding:7px 10px;font-size:12px;cursor:pointer}.document{background:#fff;border:1px solid var(--line);width:100%;overflow:hidden}.doc-title{font-size:22px;font-weight:750;text-align:center;padding:20px 10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.meta{display:grid;grid-template-columns:80px minmax(0,1fr) 110px 135px;border-bottom:1px solid var(--line)}.meta>*{padding:10px 9px;border-right:1px solid var(--line);font-size:13px;min-width:0;overflow-wrap:anywhere}.meta>*:last-child{border-right:0}.meta .label{background:var(--pale);font-weight:650}.tablehead{display:grid;grid-template-columns:55px minmax(0,42%) minmax(0,1fr);background:var(--pale);border-bottom:1px solid var(--line);text-align:center;font-weight:650;font-size:13px}.tablehead>*{padding:10px 5px;border-right:1px solid var(--line)}.tablehead>*:last-child{border-right:0}.step{display:grid;grid-template-columns:55px minmax(0,42%) minmax(0,1fr);border-bottom:1px solid var(--line);min-height:175px}.step:last-child{border-bottom:0}.number{border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700}.photoarea{border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:9px;min-height:170px}.photoarea img{display:block;max-width:100%;max-height:430px;width:auto;height:auto;object-fit:contain;cursor:zoom-in}.nophoto{font-size:12px;color:#9ba7b5}.copy{padding:15px 17px;white-space:normal;min-width:0}.stepname{font-size:16px;font-weight:700;line-height:1.55;overflow-wrap:anywhere}.description{white-space:pre-wrap;line-height:1.75;margin-top:12px;overflow-wrap:anywhere}.caution{border-top:1px solid #dfe4e9;margin-top:15px;padding-top:12px}.caution strong{display:block;color:#945315;margin-bottom:7px}.caution div{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}#error{color:#a32d2d;margin-top:12px}.lightbox{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:20;padding:22px;cursor:zoom-out}.lightbox img{max-width:100%;max-height:95vh;object-fit:contain}
@media(max-width:650px){main{padding:10px}.card{padding:10px}.doc-title{font-size:20px;padding:17px 8px}.meta{grid-template-columns:65px minmax(0,1fr) 83px 95px}.meta>*{padding:9px 5px;font-size:11px}.tablehead{display:none}.step{grid-template-columns:40px minmax(0,1fr)}.number{grid-row:1/3}.photoarea{grid-column:2;border-right:0;border-bottom:1px solid var(--line);padding:10px;min-height:100px}.photoarea img{width:100%;max-height:none;max-width:100%;height:auto}.copy{grid-column:2;padding:13px 14px}.stepname{font-size:16px}.description,.caution div{font-size:15px}}
</style></head><body>
<header id="siteHeader"><div><h1>현장 작업 매뉴얼13</h1><small>사진으로 보는 표준작업지침서</small></div></header>
<main><section id="home"><input id="search" placeholder="매뉴얼 제목 또는 설비 검색" aria-label="매뉴얼 검색"><div id="list" class="card">매뉴얼을 불러오는 중...</div></section>
<section id="detail" class="hidden"><nav class="tools"><button id="back" type="button">← 목록으로</button><button id="copy" type="button">이 매뉴얼 주소 복사</button></nav><article id="content" class="document"></article></section><p id="error" role="alert"></p></main>
<div id="lightbox" class="lightbox hidden" role="dialog" aria-label="사진 확대" tabindex="-1"><img id="largeImage" alt="확대 사진"></div>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbxae0ODjghlDSbwj2qG_5JF3wybQ8Fsph0Nq9e3uyGUBULPKahBujlsdnUmoHcDVK3UrA/exec';
let manuals=[];const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=s=>/^https:\/\//i.test(String(s||''))?esc(s):'';
function render(){const q=$('search').value.toLocaleLowerCase().trim();const a=manuals.filter(m=>String(m.title+' '+m.category).toLocaleLowerCase().includes(q));$('list').innerHTML=a.map(m=>`<div class="item" data-id="${esc(m.id)}"><strong>${esc(m.title)}</strong><div class="muted">${esc(m.category)} · ${(m.steps||[]).length}단계 · ${esc(m.updated)}</div></div>`).join('')||'<p>검색 결과가 없습니다.</p>'}
function route(){let id='';try{id=decodeURIComponent(location.hash.slice(1))}catch(e){}const m=manuals.find(x=>x.id===id);$('home').classList.toggle('hidden',!!m);$('detail').classList.toggle('hidden',!m);$('siteHeader').classList.toggle('hidden',!!m);document.title=m?m.title+' | 현장 작업 매뉴얼':'현장 작업 매뉴얼';if(!m)return;
const steps=(m.steps||[]).map((s,i)=>`<section class="step"><div class="number">${i+1}</div><div class="photoarea">${safeUrl(s.image)?`<img loading="lazy" src="${safeUrl(s.image)}" alt="${i+1}단계 현장 사진" data-zoom="${safeUrl(s.image)}">`:'<span class="nophoto">사진 없음</span>'}</div><div class="copy"><div class="stepname">${esc(s.name)}</div>${s.description?`<div class="description">${esc(s.description)}</div>`:''}${s.caution?`<div class="caution"><strong>주의사항</strong><div>${esc(s.caution)}</div></div>`:''}</div></section>`).join('');
$('content').innerHTML=`<div class="doc-title">${esc(m.title)}</div><div class="meta"><div class="label">분류</div><div>${esc(m.category)}</div><div class="label">최종 수정일</div><div>${esc(m.updated)}</div></div><div class="tablehead"><div>순서</div><div>현장 사진</div><div>작업 설명 / 주의사항</div></div>${steps}`;window.scrollTo(0,0)}
function sopCallback(data){if(data&&data.error){$('error').textContent=data.error;return}manuals=Array.isArray(data?.items)?data.items:[];render();route()}
window.sopCallback=sopCallback;
$('search').addEventListener('input',render);
$('list').addEventListener('click',e=>{const el=e.target.closest('[data-id]');if(el)location.hash=encodeURIComponent(el.dataset.id)});
$('back').addEventListener('click',()=>{location.hash='';route()});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);alert('주소를 복사했습니다.')}catch(e){prompt('주소를 복사하세요',location.href)}});
$('content').addEventListener('click',e=>{const img=e.target.closest('img[data-zoom]');if(!img)return;$('largeImage').src=img.dataset.zoom;$('lightbox').classList.remove('hidden');$('lightbox').focus()});
$('lightbox').addEventListener('click',()=>{$('lightbox').classList.add('hidden');$('largeImage').removeAttribute('src')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('lightbox').classList.add('hidden')});
window.addEventListener('hashchange',route);
const script=document.createElement('script');script.src=API_URL+'?callback=sopCallback&t='+Date.now();script.onerror=()=>{$('list').textContent='매뉴얼 목록을 불러오지 못했습니다.';$('error').textContent='Apps Script 배포 주소와 공개 권한을 확인하세요.'};document.head.appendChild(script);
</script></body></html>
