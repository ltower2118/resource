<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>현장 작업 매뉴얼</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;color:#172333;background:#f3f6fa}header{background:#153d6a;color:white;padding:20px}header>div,main{max-width:1100px;margin:auto}h1{font-size:23px;margin:0}main{padding:16px}input{width:100%;padding:14px;border:1px solid #d2d9e2;border-radius:12px;font:inherit}.card{background:#fff;border-radius:12px;padding:17px;margin:12px 0;box-shadow:0 2px 8px #142d4210}.item{cursor:pointer;border-bottom:1px solid #e9edf1;padding:16px 4px}.item:last-child{border:0}.item:hover{background:#f6f9fc}.muted{color:#667687;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:0;background:#e0e9f6;color:#143c67;border-radius:8px;padding:11px 14px;font:inherit;cursor:pointer}.btn.primary{background:#18317a;color:#fff}.hidden{display:none!important}.paper{background:#fff;border:1px solid #4c5360}.paper-title{font-size:24px;font-weight:800;text-align:center;padding:22px 12px;border-bottom:1px solid #4c5360;overflow-wrap:anywhere}.meta-row{display:grid;grid-template-columns:125px minmax(0,1fr) 125px minmax(0,1fr);border-bottom:1px solid #4c5360}.meta-label{background:#f2f5fa;font-weight:700;padding:11px;border-right:1px solid #4c5360}.meta-value{padding:11px;overflow-wrap:anywhere}.meta-value:not(:last-child){border-right:1px solid #4c5360}.steps-head,.step-row{display:grid;grid-template-columns:65px minmax(0,42%) minmax(0,1fr)}.steps-head{background:#e8edf5;font-weight:700;text-align:center;border-bottom:1px solid #4c5360}.steps-head>div{padding:12px 6px;border-right:1px solid #4c5360}.steps-head>div:last-child{border-right:0}.step-row{border-bottom:1px solid #4c5360;min-height:230px}.step-row:last-child{border-bottom:0}.step-row>div{border-right:1px solid #4c5360}.step-row>div:last-child{border-right:0}.step-no{display:flex;align-items:center;justify-content:center;font-weight:700}.step-photo{display:flex;align-items:center;justify-content:center;padding:9px;background:#fff;min-height:220px}.step-photo img{max-width:100%;width:100%;max-height:390px;object-fit:contain;cursor:zoom-in}.photo-empty{color:#85909b;font-size:13px}.step-copy{padding:17px;white-space:normal;overflow-wrap:anywhere}.step-name{font-weight:750;font-size:17px;margin-bottom:10px}.step-description{white-space:pre-wrap;line-height:1.75}.caution{border-top:1px solid #d5dbe4;margin-top:17px;padding-top:13px}.caution-title{font-weight:750;color:#9a4b00;margin-bottom:7px}.caution-text{white-space:pre-wrap;line-height:1.65}.image-modal{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;cursor:zoom-out}.image-modal img{max-width:100%;max-height:95vh;object-fit:contain}.status{color:#a13b32;font-size:13px;padding:8px 0}
@media(max-width:680px){main{padding:9px}.card{padding:11px}.paper-title{font-size:20px;padding:16px 8px}.meta-row{grid-template-columns:86px 1fr 94px 1fr}.meta-label,.meta-value{font-size:12px;padding:9px 5px}.steps-head{display:none}.step-row{grid-template-columns:45px minmax(0,1fr)}.step-no{grid-row:1/3}.step-photo{min-height:170px}.step-photo img{max-height:320px}.step-copy{grid-column:2;padding:12px;border-top:1px solid #4c5360}.step-row>.step-photo{border-right:0}.step-name{font-size:16px}}
@media print{@page{size:A4;margin:9mm}body{background:#fff}header,#home,.toolbar,#error,.image-modal{display:none!important}main{padding:0;max-width:none}.card{margin:0;padding:0;box-shadow:none;border:0}.paper-title{font-size:19px}.step-row{break-inside:avoid;page-break-inside:avoid;min-height:140px}.step-photo{min-height:140px}.step-photo img{max-height:240px}.step-copy{padding:10px}.steps-head,.step-row{grid-template-columns:45px 40% 1fr}}
</style></head><body>
<header><div><h1>현장 작업 매뉴얼11</h1><small>사진으로 보는 표준작업지침서</small></div></header>
<main><div id="home"><input id="search" placeholder="매뉴얼 제목 또는 설비 검색" aria-label="매뉴얼 검색"><div id="list" class="card">매뉴얼을 불러오는 중...</div></div>
<div id="detail" class="hidden"><div class="toolbar"><button class="btn" id="back">← 목록으로</button><button class="btn primary" id="copy">이 매뉴얼 주소 복사</button><button class="btn" id="print">인쇄 / PDF 저장</button></div><article id="content" class="card"></article></div><p id="error" class="status" role="status"></p></main>
<div id="imageModal" class="image-modal hidden" role="dialog" aria-label="사진 크게 보기"><img id="largeImage" alt="확대 사진"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxae0ODjghlDSbwj2qG_5JF3wybQ8Fsph0Nq9e3uyGUBULPKahBujlsdnUmoHcDVK3UrA/exec';
let manuals=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=$('search').value.toLowerCase().trim();const found=manuals.filter(m=>(String(m.title||'')+' '+String(m.category||'')).toLowerCase().includes(q));$('list').innerHTML=found.map(m=>`<div class="item" data-id="${esc(m.id)}"><strong>${esc(m.title)}</strong><div class="muted">${esc(m.category)} · ${Array.isArray(m.steps)?m.steps.length:0}단계 · ${esc(m.updated)}</div></div>`).join('')||'<p>검색 결과가 없습니다.</p>';document.querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>{location.hash=encodeURIComponent(el.dataset.id);}));}
function route(){let id='';try{id=decodeURIComponent(location.hash.slice(1));}catch(e){id=location.hash.slice(1);}const m=manuals.find(x=>String(x.id)===id);$('home').classList.toggle('hidden',!!m);$('detail').classList.toggle('hidden',!m);if(!m){if(id&&manuals.length)$('error').textContent='매뉴얼을 찾을 수 없거나 비공개 상태입니다.';else $('error').textContent='';return;}$('error').textContent='';document.title=String(m.title||'매뉴얼')+' | 현장 작업 매뉴얼';const steps=Array.isArray(m.steps)?m.steps:[];$('content').innerHTML=`<div class="paper"><div class="paper-title">${esc(m.title||'제목 없음')}</div><div class="meta-row"><div class="meta-label">분류</div><div class="meta-value">${esc(m.category||'-')}</div><div class="meta-label">최종 수정일</div><div class="meta-value">${esc(m.updated||'-')}</div></div><div class="steps-head"><div>순서</div><div>현장 사진</div><div>작업 설명</div></div>${steps.map((s,i)=>`<section class="step-row"><div class="step-no">${i+1}</div><div class="step-photo">${s.image?`<img src="${esc(s.image)}" alt="작업 ${i+1} 사진" loading="lazy" data-large="${esc(s.image)}">`:'<span class="photo-empty">사진 없음</span>'}</div><div class="step-copy"><div class="step-name">${esc(s.name||'작업 '+(i+1))}</div><div class="step-description">${esc(s.description||'')}</div>${s.caution?`<div class="caution"><div class="caution-title">주의사항</div><div class="caution-text">${esc(s.caution)}</div></div>`:''}</div></section>`).join('')}</div>`;$('content').querySelectorAll('[data-large]').forEach(img=>img.addEventListener('click',()=>{$('largeImage').src=img.getAttribute('data-large');$('imageModal').classList.remove('hidden');}));window.scrollTo(0,0);}
function sopCallback(data){if(data&&data.error){$('list').textContent='목록을 불러오지 못했습니다.';$('error').textContent=data.error;return;}manuals=Array.isArray(data&&data.items)?data.items:[];render();route();}
$('search').addEventListener('input',render);$('back').addEventListener('click',()=>{location.hash='';document.title='현장 작업 매뉴얼';route();});$('copy').addEventListener('click',()=>{const u=location.href;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(()=>alert('매뉴얼 주소를 복사했습니다.')).catch(()=>prompt('주소를 복사하세요',u));else prompt('주소를 복사하세요',u);});$('print').addEventListener('click',()=>window.print());$('imageModal').addEventListener('click',()=>{$('imageModal').classList.add('hidden');$('largeImage').removeAttribute('src');});window.addEventListener('hashchange',route);
const script=document.createElement('script');script.src=API_URL+(API_URL.includes('?')?'&':'?')+'callback=sopCallback&t='+Date.now();script.onerror=()=>{$('list').textContent='매뉴얼 목록을 불러오지 못했습니다.';$('error').textContent='Apps Script 공개 배포 주소와 권한을 확인하세요.';};document.head.appendChild(script);
</script></body></html>
