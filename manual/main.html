<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>현장 작업 매뉴얼</title>
<style>
:root{--navy:#173e69;--ink:#172333;--muted:#657589;--line:#e4e9ef;--bg:#f4f6f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
    header{background:var(--navy);color:#fff;padding:20px}
    header>div,main{max-width:1020px;margin:auto}
    header h1{font-size:22px;margin:0}
    header small{opacity:.86}
    .hidden{display:none!important}main{padding:16px}
    .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 9px #1723330d;margin:12px 0}
    input{font:inherit;width:100%;padding:14px;border:1px solid #d5dce5;border-radius:10px}
    .item{padding:17px 7px;border-bottom:1px solid var(--line);cursor:pointer}
    .item:last-child{border:0}
    .item:hover{background:#f7f9fc}
    .item strong{font-size:16px}
    .muted{color:var(--muted);font-size:13px;margin-top:5px}
    .tools{display:flex;gap:7px;margin-bottom:12px}
    .tools button{border:1px solid #dce3ec;border-radius:8px;background:#fff;color:#34516d;font:inherit;font-size:12px;padding:8px 11px;cursor:pointer}.document{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #1723330d}.doc-head{padding:23px 22px 18px}.doc-title{font-size:24px;line-height:1.4;font-weight:750;overflow-wrap:anywhere;letter-spacing:-.5px}.doc-meta{font-size:13px;color:var(--muted);margin-top:11px;display:flex;gap:6px;flex-wrap:wrap}.doc-meta .dot{opacity:.5}.steps{padding:0 22px 12px}.step{padding:24px 0 27px;border-top:1px solid var(--line)}.step-label{font-size:12px;font-weight:750;letter-spacing:.06em;color:#54718f;margin-bottom:13px}.step-layout{display:grid;grid-template-columns:minmax(0,44%) minmax(0,1fr);gap:24px;align-items:start}.step.no-photo .step-layout{display:block}.photoarea{min-width:0}.photoarea img{display:block;max-width:100%;max-height:550px;width:auto;height:auto;object-fit:contain;border-radius:9px;cursor:zoom-in;background:#f4f6f9}.step-copy{min-width:0}.stepname{font-size:19px;line-height:1.5;font-weight:750;overflow-wrap:anywhere}.description{font-size:15px;white-space:pre-wrap;line-height:1.85;margin-top:12px;overflow-wrap:anywhere}.caution{margin-top:17px;padding:12px 14px;background:#fff7e9;border-radius:9px;border-left:3px solid #d9a04c}.caution strong{display:block;font-size:13px;color:#935514;margin-bottom:6px}.caution div{white-space:pre-wrap;font-size:14px;line-height:1.75;overflow-wrap:anywhere}.lightbox{position:fixed;inset:0;z-index:30;background:#000e;display:flex;align-items:center;justify-content:center;padding:15px;cursor:zoom-out}.lightbox img{max-width:100%;max-height:96vh;object-fit:contain}#error{color:#ad3030;font-size:13px}
@media(max-width:700px){main{padding:10px}
    .card{padding:12px}
    .document{border-radius:12px}
    .doc-head{padding:21px 17px 17px}
    .doc-title{font-size:21px}
    .doc-meta{font-size:12px}
    .steps{padding:0 15px 8px}
    .step{padding:21px 0 24px}
    .step-label{margin-bottom:12px;font-size:13px}
    .step-layout{display:block}
    .photoarea{margin-bottom:16px}
    .photoarea img{width:100%;height:auto;max-height:none;border-radius:7px}
    .stepname{font-size:18px}
    .description{font-size:15px;margin-top:9px;line-height:1.8}
    .caution{margin-top:14px}
    .tools button{font-size:12px}}
</style></head><body>
<header id="siteHeader"><div>
    <h1>현장 작업 매뉴얼17</h1><small>사진으로 보는 표준작업지침서</small></div>
    </header>
<main><section id="home"><input id="search" placeholder="매뉴얼 제목 또는 설비 검색" aria-label="매뉴얼 검색"><div id="list" class="card">매뉴얼을 불러오는 중...</div></section>
<section id="detail" class="hidden"><nav class="tools"><button id="back" type="button">← 목록</button><button id="copy" type="button">주소 복사</button></nav><article id="content" class="document"></article></section><p id="error" role="alert"></p></main>
<div id="lightbox" class="lightbox hidden" role="dialog" aria-label="사진 확대" tabindex="-1"><img id="largeImage" alt="확대 사진"></div>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbxae0ODjghlDSbwj2qG_5JF3wybQ8Fsph0Nq9e3uyGUBULPKahBujlsdnUmoHcDVK3UrA/exec';
let manuals=[];const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=s=>/^https:\/\//i.test(String(s||''))?esc(s):'';
function render(){const q=$('search').value.toLocaleLowerCase().trim();const a=manuals.filter(m=>String(m.title+' '+m.category).toLocaleLowerCase().includes(q));$('list').innerHTML=a.map(m=>`<div class="item" data-id="${esc(m.id)}"><strong>${esc(m.title)}</strong><div class="muted">${esc(m.category)} · ${(m.steps||[]).length}단계 · ${esc(m.updated)}</div></div>`).join('')||'<p>검색 결과가 없습니다.</p>'}
function route(){let id='';try{id=decodeURIComponent(location.hash.slice(1))}catch(e){}const m=manuals.find(x=>x.id===id);$('home').classList.toggle('hidden',!!m);$('detail').classList.toggle('hidden',!m);$('siteHeader').classList.toggle('hidden',!!m);document.title=m?m.title+' | 현장 작업 매뉴얼':'현장 작업 매뉴얼';if(!m)return;
const steps=(m.steps||[]).map((s,i)=>{const img=safeUrl(s.image);return `<section class="step ${img?'':'no-photo'}"><div class="step-label">작업 ${String(i+1).padStart(2,'0')}</div><div class="step-layout">${img?`<div class="photoarea"><img loading="lazy" src="${img}" alt="${i+1}단계 현장 사진" data-zoom="${img}"></div>`:''}<div class="step-copy"><div class="stepname">${esc(s.name)}</div>${String(s.description||'').trim()?`<div class="description">${esc(s.description)}</div>`:''}${String(s.caution||'').trim()?`<div class="caution"><strong>주의사항</strong><div>${esc(s.caution)}</div></div>`:''}</div></div></section>`}).join('');
$('content').innerHTML=`<div class="doc-head"><div class="doc-title">${esc(m.title)}</div><div class="doc-meta"><span>${esc(m.category)}</span><span class="dot">·</span><span>최종 수정 ${esc(m.updated)}</span></div></div><div class="steps">${steps}</div>`;window.scrollTo(0,0)}
function sopCallback(data){if(data&&data.error){$('error').textContent=data.error;return}manuals=Array.isArray(data?.items)?data.items:[];render();route()}window.sopCallback=sopCallback;
$('search').addEventListener('input',render);$('list').addEventListener('click',e=>{const el=e.target.closest('[data-id]');if(el)location.hash=encodeURIComponent(el.dataset.id)});$('back').addEventListener('click',()=>{location.hash='';route()});$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);alert('주소를 복사했습니다.')}catch(e){prompt('주소를 복사하세요',location.href)}});
$('content').addEventListener('click',e=>{const img=e.target.closest('img[data-zoom]');if(!img)return;$('largeImage').src=img.dataset.zoom;$('lightbox').classList.remove('hidden');$('lightbox').focus()});$('lightbox').addEventListener('click',()=>{$('lightbox').classList.add('hidden');$('largeImage').removeAttribute('src')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('lightbox').classList.add('hidden');$('largeImage').removeAttribute('src')}});window.addEventListener('hashchange',route);
const script=document.createElement('script');script.src=API_URL+'?callback=sopCallback&t='+Date.now();script.onerror=()=>{$('list').textContent='매뉴얼 목록을 불러오지 못했습니다.';$('error').textContent='Apps Script 배포 주소와 공개 권한을 확인하세요.'};document.head.appendChild(script);
</script></body></html>
