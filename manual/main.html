<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>현장 작업 매뉴얼</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f8;color:#182434;font-family:system-ui,'Malgun Gothic',sans-serif}header{background:#173e69;color:#fff;padding:20px}header .inner,main{max-width:1000px;margin:auto}header h1{font-size:22px;margin:0}header small{opacity:.8}main{padding:14px 12px 40px}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 10px #142d4210;margin:12px 0}#search{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.item{padding:15px 6px;border-bottom:1px solid #e5e9ef;cursor:pointer}.item:last-child{border:0}.item:hover{background:#f5f8fc}.muted{font-size:13px;color:#687789}.hidden{display:none!important}body.detail-mode{background:#fff}body.detail-mode header{display:none}body.detail-mode main{max-width:1050px;padding:10px 10px 28px}.toolbar{display:flex;gap:7px;align-items:center;margin:0 0 9px}.tool{border:1px solid #d9e1eb;background:#f4f7fb;color:#274363;padding:7px 10px;border-radius:7px;font:inherit;font-size:12px;cursor:pointer}.tool:hover{background:#e9f0f8}.doc{border:1px solid #aeb8c5;background:white;margin:0;padding:0;box-shadow:none;border-radius:3px;overflow:hidden}.doc-title{text-align:center;font-weight:800;font-size:22px;padding:17px 12px;border-bottom:1px solid #aeb8c5}.meta{display:grid;grid-template-columns:90px 1fr 100px 1fr;border-bottom:1px solid #aeb8c5;font-size:13px}.meta b,.meta span{padding:9px;min-width:0;overflow-wrap:anywhere}.meta b{background:#f1f4f8;border-right:1px solid #aeb8c5}.meta span:nth-child(2){border-right:1px solid #aeb8c5}.thead{display:grid;grid-template-columns:55px minmax(0,40%) minmax(0,1fr);background:#f1f4f8;border-bottom:1px solid #aeb8c5;text-align:center;font-size:13px;font-weight:700}.thead>*{padding:9px 5px;border-right:1px solid #aeb8c5}.thead>*:last-child{border-right:0}.step{display:grid;grid-template-columns:55px minmax(0,40%) minmax(0,1fr);border-bottom:1px solid #aeb8c5}.step:last-child{border-bottom:0}.num{display:flex;align-items:center;justify-content:center;font-weight:700;border-right:1px solid #aeb8c5}.photo{padding:9px;border-right:1px solid #aeb8c5;display:flex;align-items:center;justify-content:center;min-height:170px}.photo img{width:100%;max-height:420px;object-fit:contain;cursor:zoom-in}.copy{padding:14px 16px;min-width:0;overflow-wrap:anywhere}.copy h3{font-size:16px;margin:0 0 10px}.copy p{line-height:1.7;white-space:pre-wrap;margin:0}.caution{border-top:1px solid #d9dfe6;margin-top:14px;padding-top:10px}.caution strong{display:block;color:#92501c;margin-bottom:6px}.caution p{font-size:14px}.empty-photo{color:#8794a4;font-size:12px}.lightbox{position:fixed;inset:0;background:#000d;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}.lightbox img{max-width:100%;max-height:95vh;object-fit:contain}@media(max-width:640px){.doc-title{font-size:19px;padding:16px 7px}.meta{grid-template-columns:72px 1fr 86px 1fr;font-size:11px}.meta b,.meta span{padding:8px 5px}.thead{display:none}.step{grid-template-columns:42px minmax(0,1fr)}.num{grid-row:1/3;align-items:flex-start;padding-top:20px}.photo{grid-column:2;min-height:0;padding:9px;border-right:0;border-bottom:1px solid #dce2e9}.photo img{max-height:460px}.copy{grid-column:2;padding:12px 13px}.copy h3{font-size:15px}.copy p{font-size:14px}.tool{font-size:12px}body.detail-mode main{padding:8px 8px 24px}}@media print{header,.toolbar,#search{display:none!important}body{background:white}.doc{box-shadow:none}.step{break-inside:avoid}}
</style></head><body>
<header><div class="inner"><h1>현장 작업 매뉴얼12</h1><small>사진으로 보는 표준작업지침서</small></div></header>
<main><section id="home"><input id="search" placeholder="매뉴얼 제목 또는 설비 검색" aria-label="매뉴얼 검색"><div id="list" class="card">매뉴얼을 불러오는 중...</div></section>
<section id="detail" class="hidden"><nav class="toolbar"><button class="tool" id="back" type="button">← 목록</button><button class="tool" id="copy" type="button">주소 복사</button></nav><article id="content" class="doc"></article></section><p id="error" class="muted" role="status"></p></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxae0ODjghlDSbwj2qG_5JF3wybQ8Fsph0Nq9e3uyGUBULPKahBujlsdnUmoHcDVK3UrA/exec';
let manuals=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=$('search').value.toLowerCase().trim();const a=manuals.filter(m=>(String(m.title||'')+' '+String(m.category||'')).toLowerCase().includes(q));$('list').innerHTML=a.map(m=>`<div class="item" data-id="${esc(m.id)}" role="button" tabindex="0"><strong>${esc(m.title)}</strong><div class="muted">${esc(m.category)} · ${(m.steps||[]).length}단계 · ${esc(m.updated)}</div></div>`).join('')||'<p>검색 결과가 없습니다.</p>';document.querySelectorAll('.item').forEach(el=>{const go=()=>location.hash=encodeURIComponent(el.dataset.id);el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});}
function route(){let id='';try{id=decodeURIComponent(location.hash.slice(1));}catch(e){id=location.hash.slice(1);}const m=manuals.find(x=>x.id===id);$('home').classList.toggle('hidden',!!m);$('detail').classList.toggle('hidden',!m);document.body.classList.toggle('detail-mode',!!m);document.title=m?m.title+' | 현장 작업 매뉴얼':'현장 작업 매뉴얼';if(!m)return;const steps=Array.isArray(m.steps)?m.steps:[];$('content').innerHTML=`<div class="doc-title">${esc(m.title)}</div><div class="meta"><b>분류</b><span>${esc(m.category)}</span><b>최종 수정일</b><span>${esc(m.updated)}</span></div><div class="thead"><span>순서</span><span>현장 사진</span><span>작업 설명 / 주의사항</span></div>${steps.map((s,i)=>`<section class="step"><div class="num">${i+1}</div><div class="photo">${s.image?`<img loading="lazy" src="${esc(s.image)}" alt="${i+1}단계 사진" data-zoom="1">`:'<span class="empty-photo">사진 없음</span>'}</div><div class="copy"><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p>${s.caution?`<div class="caution"><strong>주의사항</strong><p>${esc(s.caution)}</p></div>`:''}</div></section>`).join('')}`;$('content').querySelectorAll('[data-zoom]').forEach(img=>img.onclick=()=>zoom(img.src));window.scrollTo(0,0);}
function zoom(src){const d=document.createElement('div');d.className='lightbox';const im=document.createElement('img');im.src=src;im.alt='사진 크게 보기';d.appendChild(im);d.onclick=()=>d.remove();document.body.appendChild(d);}
function copyLink(){const url=location.href;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>alert('주소를 복사했습니다.')).catch(()=>prompt('주소를 복사하세요',url));}else prompt('주소를 복사하세요',url);}
function sopCallback(data){manuals=Array.isArray(data.items)?data.items:[];render();route();}
$('search').addEventListener('input',render);$('back').addEventListener('click',()=>{location.hash='';});$('copy').addEventListener('click',copyLink);window.addEventListener('hashchange',route);
const script=document.createElement('script');script.src=API_URL+'?callback=sopCallback&t='+Date.now();script.onerror=()=>{$('list').textContent='목록을 불러오지 못했습니다.';$('error').textContent='Apps Script 배포 및 공개 권한을 확인하세요.';};document.head.appendChild(script);
</script></body></html>
