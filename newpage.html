<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Modern Web Trend Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-light: #ffffff;
      --bg-dark: #121212;
      --text-light: #333333;
      --text-dark: #f0f0f0;
      --primary: #4a90e2;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-light);
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      padding: 1rem;
      background: var(--primary);
      color: white;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
    }

    nav a {
      text-decoration: none;
      color: var(--primary);
      font-weight: bold;
    }

    main {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }

    .card {
      background: #f9f9f9;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #eee;
      margin-top: 2rem;
    }

    /* 다크 모드 */
    body.dark {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    body.dark .card {
      background: #1e1e1e;
      box-shadow: 0 2px 6px rgba(255,255,255,0.1);
    }

    body.dark nav a {
      color: #90caf9;
    }

    .toggle-btn {
      cursor: pointer;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 5px;
      background: var(--primary);
      color: white;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>모던 웹 트렌드 페이지</h1>
    <button class="toggle-btn" id="toggleTheme">🌙 다크모드</button>
  </header>

  <nav>
    <a href="#">홈</a>
    <a href="#">서비스</a>
    <a href="#">문의</a>
  </nav>

  <main>
    <div class="card">
      <h2>최신 디자인</h2>
      <p>미니멀하고 반응형 레이아웃을 통해 다양한 기기에서 최적화된 경험을 제공합니다.</p>
    </div>
    <div class="card">
      <h2>다크 모드 지원</h2>
      <p>사용자 취향에 맞게 라이트/다크 모드를 전환할 수 있습니다.</p>
    </div>
    <div class="card">
      <h2>인터랙션</h2>
      <p>마우스 오버 시 카드가 살짝 떠오르는 애니메이션 효과로 생동감을 줍니다.</p>
    </div>
  </main>

  <footer>
    <p>© 2026 Modern Web Trend</p>
  </footer>

  <script>
    const toggleBtn = document.getElementById("toggleTheme");
    toggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      toggleBtn.textContent = 
        document.body.classList.contains("dark") ? "☀️ 라이트모드" : "🌙 다크모드";
    });
  </script>
</body>
</html>
