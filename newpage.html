<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

    :root {
      --bg-light: #ffffff;
      --bg-dark: #121212;
      --text-light: #333333;
      --text-dark: #f0f0f0;
      --primary: #4a90e2;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-light);
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: var(--primary);
      color: white;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 1rem;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-weight: bold;
    }

      display: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    main {
      padding: 2rem;
      max-width: 900px;
      margin: auto;
    }
