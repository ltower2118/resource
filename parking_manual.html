<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>서울숲엘타워 지식산업센터</title>
    <style>
        /* =========================================================
           [커스터마이징 가이드] 버튼 스타일 제어 변수 (여기서 수정하세요)
           ========================================================= */
        :root {
          /* 버튼 스타일 커스텀 */
          --btn-bg: #f1f5f9;            /* 버튼 기본 배경색 (연한 회색) */
          --btn-text: #475569;          /* 버튼 기본 글자색 */
          --btn-border: white;        /* 버튼 테두리 색상 */
          
          --btn-active-bg: #cbd5e1;     /* 버튼 활성화(선택) 배경색 (진한 차콜 회색) */
          --btn-active-text: #1e3a8a;   /* 버튼 활성화 글자색 */
          --btn-active-border: #ffffff; /* 버튼 활성화 테두리 색상 */

          --btn-font-size: 0.85rem;     /* 버튼 폰트 크기 */
          --btn-padding: 10px 4px;      /* 버튼 내부 여백 (상하 좌우) */
          --btn-radius: 30px;            /* 버튼 모서리 둥글기 */

          /* 기존 테이블 변수 */
          --lbl-w: 92px;
          --val-w: 110px;
          --color-steel-light: #ffffff;
          --color-line: #ffffff;
        }

        * { box-sizing: border-box; font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont,"Malgun Gothic", Roboto, sans-serif; }
        html { scroll-behavior: smooth; } /* 부드러운 스크롤 */
        body { background-color: #ffffff; padding: 5px; margin: 0; color: #1e293b; }
        .container { max-width: 540px; margin: 0 auto; }
        
        /* 헤더 섹션 */
        .header-title { background: #01438a; color: #f8fafc; padding: 14px 10px; border-radius: 8px; text-align: center; font-size: 1.4rem; font-weight: bold; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .emergency-banner { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 0.9rem; margin-bottom: 12px; }
       
        /* 메인 영역 */
        main {
          margin-top: 0px;
          padding: 1rem;
          max-width: 900px;
          margin-left: auto;
          margin-right: auto;
        }
        .title {
          font-weight: bold;
          font-size: 1.5rem;
          color: #1e3a8a;
        }
        .text-s {
          font-size: 0.95rem;
          color: #444;
        }
        .text {
          font-size: 0.95rem;
          color: #444;
        }
        
        /* 상단 앱바 */
        header {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 60px;
          background-color: white;
          color: black;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 20px;
          box-shadow: 0 2px 5px rgba(0,0,0,0.05);
          z-index: 1000;
        }

        header h1 {
          font-size: 20px;
          font-weight: 700;
          margin: 0;
        }

        header .icon {
          font-size: 22px;
        }
        
        /* 내비게이션 버튼 메뉴 그룹 */
        .nav-btn-group {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 6px;
          margin: 15px 0 20px 0;
          position: sticky;
          top: 60px; /* Header 바로 밑에 고정 */
          background: #ffffff;
          padding: 8px 0;
          z-index: 900;
        }

        .nav-btn {
          background-color: var(--btn-bg);
          color: var(--btn-text);
          border: 1px solid var(--btn-border);
          padding: var(--btn-padding);
          font-size: var(--btn-font-size);
          font-weight: 600;
          border-radius: var(--btn-radius);
          cursor: pointer;
          text-align: center;
          transition: all 0.2s ease-in-out;
          outline: none;
          word-break: keep-all;
          line-height: 1.2;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        /* 버튼 호버 & 활성화(클릭) 상태 */
        .nav-btn:hover {
          background-color: #e2e8f0;
        }

        .nav-btn.active {
          background-color: var(--btn-active-bg);
          color: var(--btn-active-text);
          border-color: var(--btn-active-border);

        }

        /* 패널 스크롤 위치 오프셋 (Header + Nav 높이 고려) */
        .panel {
          scroll-margin-top: 135px;
          margin-bottom: 25px;
        }

        /* 내부 타이틀 및 박스 스타일 */
        h3 { font-size: 1.05rem; margin: 0 0 12px 0; color: #1e3a8a; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; }
        h4 { font-size: 0.92rem; margin: 12px 0 6px 0; color: #0f172a; background: #f1f5f9; padding: 6px; border-radius: 4px; border-left: 3px solid #1e3a8a; }
        
        .text2 {
            font-size: 0.9rem;
            color: #535252;
            line-height: 1.4;
        }
        .text5 {
         font-size: 0.85rem;
          color: #0f172a;
          font-weight: bold;
        }


        /* 연락처 테이블 스타일 */
        .contact-table { 
          border: none;
          background: white; 
          width: 100%; 
          border-collapse: collapse; 
          font-size: 0.8rem; 
          margin-top: 5px; 
        }

        .contact-table th, 
        .contact-table td { 
          padding: 5px 4px; 
          font-size: 0.9rem; 
          color: #505051; 
          text-align: left; 
          border-bottom: 1px solid #cbd5e1; 
          border-left: 1px solid #cbd5e1;
          border-right: 1px solid #cbd5e1;
          word-break: break-word;
          line-height: 1.3;
        }
        .contact-table td:first-child { border-left: none; }
        .contact-table td:last-child { border-right: none; }
        
        .contact-table th { 
          background: #1e3a8a; 
          color: #ffffff; 
          font-weight: bold; 
          text-align: center; 
        }

        /* 단일 규격 정보 테이블 */
        .info-table { 
          width: 100%; 
          border-collapse: collapse; 
          font-size: 12.5px; 
          table-layout: fixed; 
        }
        
        .info-table th, .info-table td {
          border: 1px solid #cbd5e1;
          padding: 8px 9px;
          text-align: left;
          vertical-align: middle;
          word-break: keep-all;
          line-height: 1.3;
        }

        .text-info {
          font-size: 0.9rem;
          color: #ffffff;
          font-weight: bold;
          background: #1e3a8a;
          text-align: center;
          white-space: nowrap;
        }

        .info-table td.lbl {
          background: #fbfbfb;
          font-weight: 700;
          color: #334155;
          text-align: center;
          white-space: nowrap;
        }
        .section-line {
            border: none;
            border-top: 1px solid #cbd5e1;
            margin: 8px 0 0px 0;
        }
        .nested { width:100%; border-collapse:collapse; font-size:12.5px; table-layout:fixed; }
        .nested td, .nested th {
          border: 1px solid #cbd5e1;
          padding:7px 8px;
          text-align:left;
          vertical-align:middle;
          word-break: break-word;
          line-height: 1.3;
        }
        .nested .lbl { background:#ffffff; font-weight:700; color:#334155; white-space:nowrap; width:var(--lbl-w); overflow:hidden; text-overflow:ellipsis; }
        .nested col.lbl-col { width:var(--lbl-w); }
        .nested col.val-col { width:var(--val-w); }
        .no-border-td { border:none !important; padding:0 !important; }
        .check { font-weight:700; }

        /* 차단기 명세 테이블 스타일 */
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: center; border: 1px solid #cbd5e1; }
        .data-table th { background: #1e3a8a; color: white; padding: 8px 4px; border: 1px solid #cbd5e1; }
        .data-table td { padding: 6px 4px; border: 1px solid #cbd5e1; }

        /* foot 섹션 */
        .copyright { font-size: 0.9rem; color: #969697; margin: 20px 0 12px 0; padding-bottom: 6px; text-align: center;}
    </style>
</head>
<body>
    <header>
      <h1>서울숲엘타워</h1>
      <a href="index.html" class="home-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="black" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H10v7H5a1 1 0 0 1-1-1V9.5z"/>
        </svg>
      </a>
    </header>
<main>   
    <br><br><br>
    <div class="title">무인주차</div>
    <div class="text2" style="margin-top: 8px;">
      무인주차 새영수증 교체방법등을 볼수 있습니다.<br>

        <!-- 빠르게 이동하는 네비게이션 버튼 4개 -->
    <div class="nav-btn-group">
      <button class="nav-btn active" onclick="scrollToPanel('panel-1', this)">1.새영수증 교체방법</button>
      <button class="nav-btn" onclick="scrollToPanel('panel-2', this)">2.주차차단기 수동조작</button>
      <button class="nav-btn" onclick="scrollToPanel('panel-3', this)">3.정전시 차단기바 수동조작</button>
      <button class="nav-btn" onclick="scrollToPanel('panel-4', this)">4.어닝(천막)조작방법</button>
        
    </div>
     <br>
    <div class="panel" id="panel-1">
    <h2>1.새영수증 교체</h2>
    <div class="section-line"></div><br>
    <div><img src="images/parking_m1.jpg" width="420"></div>
        <br>
    <div><img src="images/parking_m2.jpg" width="420"></div>
        
    <div class="panel" id="panel-2"><br><br>
    <h2>2.주차 차단기 수동조작하기</h2>
    <div class="section-line"></div><br>
    <div><img src="images/parking_m3.jpg" width="420"></div>
        
    <div class="panel" id="panel-3"><br><br>
    <h2>3.정전시 주차 차단기바 수동조작</h2>
     <div class="section-line"></div><br><br>
    <div><img src="images/parking_m4.jpg" width="420></div>
        
    <div class="panel" id="panel-4"><br><br>
    <h2>4.어닝(천막)조작방법</h2>
    <div class="section-line"></div><br><br>
    <div><img src="images/parking_m5.jpg" width="420"></div>
 <br><br><br><br>
    <div class="copyright">Made by ai & ha you sin</div>
</main>
<script>
    // 클릭 시 해당 패널로 스크롤 및 활성화 클래스 적용 스크립트
    function scrollToPanel(panelId, btnElement) {
        const targetPanel = document.getElementById(panelId);
        if (targetPanel) {
            targetPanel.scrollIntoView({ behavior: 'smooth' });
        }
        
        // 전체 버튼에서 active 제거 후 클릭된 버튼에 부여
        const buttons = document.querySelectorAll('.nav-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
    }
</script>
</body>
</html>
