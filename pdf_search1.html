<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📑 모바일 종합 PDF 매뉴얼 검색 시스템</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; }
        body { background-color: #f1f5f9; margin: 0; padding: 12px; color: #0f172a; }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* 상단 헤더 영역 */
        .header { background: #1e3a8a; color: white; padding: 18px; border-radius: 12px; text-align: center; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header h1 { font-size: 1.25rem; margin: 0 0 12px 0; }
        
        /* 컨트롤 테이블/폼 (파일 선택 및 검색바) */
        .control-panel { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .select-box { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.9rem; background-color: white; font-weight: bold; color: #334155; }
        .search-box { display: flex; gap: 6px; }
        .search-input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
        .search-btn { background: #eab308; border: none; color: #0f172a; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; min-width: 70px; }
        .search-btn:active { background: #ca8a04; }

        /* 안내 문구 상태바 */
        .result-status { font-size: 0.88rem; color: #475569; margin: 8px 0; font-weight: 500; }

        /* PDF 내용 출력 뷰어 */
        .pdf-viewer-container { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); min-height: 350px; }
        .page-box { border-bottom: 2px dashed #e2e8f0; padding-bottom: 15px; margin-bottom: 15px; }
        .page-box:last-child { border-bottom: none; }
        .page-num { font-size: 0.78rem; color: #94a3b8; font-weight: bold; margin-bottom: 6px; display: inline-block; background: #f8fafc; padding: 2px 6px; border-radius: 4px; }
        
        /* 검색 단어 하이라이트 효과 */
        .highlight { background-color: #fde047; color: #000; font-weight: bold; padding: 1px 0; border-radius: 2px; box-shadow: 0 0 4px #fde047; }
        .text-content { font-size: 0.92rem; line-height: 1.6; white-space: pre-wrap; word-break: break-all; color: #334155; }
        
        /* 하단 푸터 */
        .footer { text-align: center; font-size: 0.75rem; color: #94a3b8; margin-top: 25px; letter-spacing: 0.3px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>통합 모바일 매뉴얼 검색</h1>
        
        <div class="control-panel">
            <select id="pdf-select" class="select-box" onchange="changePDF()">
                <option value="[교육]방재실수신반요령.pdf">🚨 방재실 수신반 요령 매뉴얼</option>
                <option value="[서울숲엘타워] 정전시대응메뉴얼정전.pdf">⚡ 정전시 대응 매뉴얼</option>
            </select>
            
            <div class="search-box">
                <input type="text" id="keyword" class="search-input" placeholder="검색할 단어 입력 (예: 부저, ATS, 복구)" onkeyup="if(window.event.keyCode==13){searchPDF()}">
                <button class="search-btn" onclick="searchPDF()">검색</button>
            </div>
        </div>
    </div>

    <div id="status" class="result-status">문서를 분석하는 중입니다...</div>

    <div class="pdf-viewer-container" id="viewer"></div>
    
    <p class="footer">Built by AI & Ha Yu-sin</p>
</div>

<script>
    // PDF.js 워커 연결 설정
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfDoc = null;
    let pagesText = []; // 현재 로드된 PDF의 텍스트 보관 저장소

    // 1. 선택한 PDF 파일을 읽어와서 텍스트를 추출하는 핵심 함수
    async function loadPDF(pdfUrl) {
        const statusText = document.getElementById('status');
        const viewer = document.getElementById('viewer');
        
        statusText.innerText = "📄 새 문서를 불러와 텍스트를 추출하고 있습니다...";
        viewer.innerHTML = '';
        pagesText = []; // 기존 데이터 초기화
        document.getElementById('keyword').value = ''; // 검색창 초기화

        try {
            pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
            statusText.innerText = `확인 완료: 총 ${pdfDoc.numPages}페이지 문서 로드 성공.`;
            
            for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                const page = await pdfDoc.getPage(pageNum);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                
                // 데이터 매핑 저장
                pagesText.push({ page: pageNum, text: pageText });

                // 초기 화면 구성 배치
                createPageLayout(pageNum, pageText);
            }
            statusText.innerText = `검색 준비 완료. 키워드를 입력해 주세요.`;
        } catch (error) {
            console.error(error);
            statusText.innerText = "❌ 파일을 찾을 수 없거나 불러오지 못했습니다. 깃허브 파일명을 검증해 주세요.";
        }
    }

    // 2. 파일 목록 드롭다운 선택이 변경될 때 가동되는 이벤트 함수
    function changePDF() {
        const selectedPdf = document.getElementById('pdf-select').value;
        loadPDF(selectedPdf);
    }

    // 3. 페이지 레이아웃 구조 동적 생성기
    function createPageLayout(pageNum, text) {
        const viewer = document.getElementById('viewer');
        
        const pageBox = document.createElement('div');
        pageBox.className = 'page-box';
        pageBox.id = `page-container-${pageNum}`;

        const pageLabel = document.createElement('span');
        pageLabel.className = 'page-num';
        pageLabel.innerText = `PAGE ${pageNum}`;

        const textDiv = document.createElement('div');
        textDiv.className = 'text-content';
        textDiv.id = `page-text-${pageNum}`;
        textDiv.innerText = text;

        pageBox.appendChild(pageLabel);
        pageBox.appendChild(textDiv);
        viewer.appendChild(pageBox);
    }

    // 4. 🔍 통합 다중 하이라이트 실시간 검색 로직
    function searchPDF() {
        const keyword = document.getElementById('keyword').value.trim();
        const statusText = document.getElementById('status');
        
        if (!keyword) {
            statusText.innerText = "검색어를 입력해 주십시오.";
            // 키워드가 공백이면 하이라이트 전체 초기화 복구
            pagesText.forEach(item => {
                document.getElementById(`page-text-${item.page}`).innerText = item.text;
            });
            return;
        }

        let matchCount = 0;

        pagesText.forEach(item => {
            const textDiv = document.getElementById(`page-text-${item.page}`);
            const originalText = item.text;

            if (originalText.includes(keyword)) {
                matchCount++;
                // 특수기호 에러 방지 처리 및 정규식을 통한 키워드 하이라이트 치환
                const safeKeyword = keyword.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                const regex = new RegExp(safeKeyword, 'g');
                textDiv.innerHTML = originalText.replace(regex, `<span class="highlight">${keyword}</span>`);
            } else {
                textDiv.innerText = originalText; // 일치하지 않는 페이지는 깨끗하게 초기화
            }
        });

        if (matchCount > 0) {
            statusText.innerHTML = `검색 결과: <span style="color:#1e3a8a; font-weight:bold;">총 ${matchCount}개 페이지</span>에서 단어를 발견했습니다.`;
        } else {
            statusText.innerText = "❌ 검색 결과가 없습니다. 다른 단어로 검색해 보세요.";
        }
    }

    // 첫 실행 시 드롭다운의 기본 선택된 첫 번째 파일([교육]방재실수신반요령.pdf)을 바로 로드함
    window.onload = function() {
        changePDF();
    };
</script>

</body>
</html>
