<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서울숲엘타워</title>
<style>
body{margin:0;background:#f3f6f9;font-family:Arial,sans-serif}
header{background:#0e2568;color:white;padding:18px}
main{padding:12px;max-width:1500px;margin:auto}
.box,.file{background:white;padding:12px;margin-bottom:10px;border-radius:10px}
.g{display:grid;grid-template-columns:1fr 2fr 100px;gap:8px}
input,select,button{font-size:1rem;padding:11px;width:100%;box-sizing:border-box;border:1px solid #ccd5df;border-radius:7px}
button{font-size:1rem;background:#0e2568;color:white;cursor:pointer}
.wrap{overflow:auto;max-height:55vh}
table{border-collapse:collapse;width:100%;min-width:800px}
th,td{padding:8px;border:1px solid #ccd5df;text-align:left;font-size:.95rem;vertical-align:middle}
mark{background:#fff09a}
.msg{text-align:center;padding:25px;color:#64717d}
.err{color:#b42318}
.file-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.file-head h2{margin:0}
.file-meta{font-size:12px;color:#64717d;line-height:1.55;text-align:right}
.merged-cell{background:#eef3fb;font-weight:700}
@media(max-width:700px){
  .g{grid-template-columns:1fr}
  .file-head{flex-direction:column}
  .file-meta{text-align:left}
}
</style>
</head>
<body>
<header><h2>서울숲엘타워 통합자료</h2></header>
<main>
  <div class="box">
    <div class="g">
      <div>
        <h2>문서 목록</h2>
        <div style="font-size:12px;color:#64717d;margin-top:4px">
          지정된 Google Drive 폴더의 Google 스프레드시트를 자동으로 불러옵니다.
        </div>
      </div>
      <div></div>
      <button onclick="loadFiles()">파일목록 새로고침</button>
    </div>
  </div>

  <div class="box">
    <div class="g">
      <select id="f"><option value="all">전체 파일</option></select>
      <input id="q" placeholder="내용 검색..." onkeydown="if(event.key==='Enter')searchFiles()">
      <button onclick="searchFiles()">검색</button>
    </div>
    <div id="stat">초기화 중...</div>
  </div>

  <div id="r"><div class="msg">파일 목록을 불러오는 중입니다.</div></div>
</main>

<script>
"use strict";

const APP_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwmHa3CMbl6xqwCB7hVj8eB1yIz0z-MJhxDuGzzniJDYj9w2TtVkpKigPzAp44S1Vst/exec";
const $=id=>document.getElementById(id);

function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function fmtDate(v){
  if(!v) return "-";
  const d=new Date(v);
  if(Number.isNaN(d.getTime())) return esc(v);
  const z=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}

async function get(params){
  const u=new URL(APP_SCRIPT_URL);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));
  const res=await fetch(u.toString(),{method:"GET",cache:"no-store",redirect:"follow"});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const text=await res.text();
  let j;
  try{ j=JSON.parse(text); }
  catch(e){ throw new Error("Apps Script 응답이 JSON이 아닙니다. 배포 및 접근권한을 확인하세요."); }
  if(!j.ok) throw new Error(j.error||"Apps Script 오류");
  return j;
}

async function loadFiles(){
  $("stat").className="";
  $("stat").textContent="파일목록 불러오는 중...";
  try{
    const j=await get({action:"files"});
    const all=Array.isArray(j.files)?j.files:[];
    const good=all.filter(x=>x.readable);
    const bad=all.filter(x=>!x.readable);

    $("f").innerHTML=
      '<option value="all">전체 파일</option>'+
      good.map(v=>{
        const mod=v.updatedAt?` · 수정 ${fmtDate(v.updatedAt)}`:"";
        return `<option value="${esc(v.id)}">${esc(v.name)}${mod}</option>`;
      }).join("");

    $("stat").textContent=
      `조회가능 ${good.length}개${bad.length?" / Excel 원본 "+bad.length+"개(변환 필요)":""}`;

    $("r").innerHTML='<div class="msg">파일을 선택하거나 검색어를 입력하세요.</div>';
  }catch(e){ showError(e); }
}

async function searchFiles(){
  $("stat").className="";
  $("stat").textContent="검색 중...";
  $("r").innerHTML='<div class="msg">검색 중...</div>';

  try{
    const q=$("q").value.trim();
    const j=await get({action:"search",id:$("f").value,q:q});
    $("stat").textContent=`검색 ${j.totalMatches}건 / ${j.fileMatches}개 파일`;
    render(j.results||[],q);
  }catch(e){ showError(e); }
}

function hi(v,q){
  let s=esc(v);
  if(!q) return s;
  const z=q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return s.replace(new RegExp(z,"gi"),m=>"<mark>"+m+"</mark>");
}

function buildTableHtml(t,q){
  const rows=t.rows||[];
  if(!rows.length) return "";

  const colCount=Math.max(1,...rows.map(r=>Array.isArray(r)?r.length:0));
  const merges=Array.isArray(t.merges)?t.merges:[];
  const mergeStart=new Map();
  const covered=new Set();

  merges.forEach(m=>{
    const r0=Number(m.row||0);
    const c0=Number(m.col||0);
    const nr=Math.max(1,Number(m.numRows||1));
    const nc=Math.max(1,Number(m.numCols||1));

    mergeStart.set(`${r0}:${c0}`,{nr,nc});

    for(let r=r0;r<r0+nr;r++){
      for(let c=c0;c<c0+nc;c++){
        if(r===r0 && c===c0) continue;
        covered.add(`${r}:${c}`);
      }
    }
  });

  const body=rows.map((row,r)=>{
    const cells=[];

    for(let c=0;c<colCount;c++){
      const key=`${r}:${c}`;
      if(covered.has(key)) continue;

      const merge=mergeStart.get(key);
      const value=(row && row[c]!==undefined)?row[c]:"";

      if(merge){
        const rs=merge.nr>1?` rowspan="${merge.nr}"`:"";
        const cs=merge.nc>1?` colspan="${merge.nc}"`:"";
        cells.push(`<td class="merged-cell"${rs}${cs}>${hi(value,q)}</td>`);
      }else{
        cells.push(`<td>${hi(value,q)}</td>`);
      }
    }

    return `<tr>${cells.join("")}</tr>`;
  }).join("");

  return `<div class="wrap"><table><tbody>${body}</tbody></table></div>`;
}

function render(a,q){
  if(!a.length){
    $("r").innerHTML='<div class="msg">검색 결과가 없습니다.</div>';
    return;
  }

  $("r").innerHTML=a.map(f=>`
    <section class="file">
      <div class="file-head">
        <h2>${esc(f.name)} — ${f.matches}건</h2>
        <div class="file-meta">
          생성일: ${fmtDate(f.createdAt)}<br>
          최종수정: ${fmtDate(f.updatedAt)}
        </div>
      </div>
      ${(f.tables||[]).map(t=>`
        <h3 style="font-size:14px;margin:12px 0 6px">${esc(t.sheet)}</h3>
        ${buildTableHtml(t,q)}
      `).join("")}
    </section>
  `).join("");
}

function showError(e){
  console.error(e);
  $("stat").className="err";
  $("stat").textContent="오류: "+(e.message||e);
  $("r").innerHTML='<div class="msg err">'+esc(e.message||e)+'</div>';
}

window.addEventListener("DOMContentLoaded",loadFiles);
</script>
</body>
</html>
