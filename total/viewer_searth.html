<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Google Sheets 문서 검색</title>
<style>
body{margin:0;background:#f3f6f9;font-family:Arial,sans-serif}header{background:#173e63;color:white;padding:18px}
main{padding:12px;max-width:1500px;margin:auto}.box,.file{background:white;padding:12px;margin-bottom:10px;border-radius:10px}
.g{display:grid;grid-template-columns:1fr 2fr 100px;gap:8px}input,select,button{padding:11px;width:100%;box-sizing:border-box;border:1px solid #ccd5df;border-radius:7px}
button{background:#173e63;color:white}.wrap{overflow:auto;max-height:55vh}table{border-collapse:collapse;width:100%;min-width:800px}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}th{position:sticky;top:0;background:#eaf0f6}
mark{background:#fff09a}.msg{text-align:center;padding:25px;color:#64717d}.err{color:#b42318}
@media(max-width:700px){.g{grid-template-columns:1fr}}
</style></head><body>
<header><b>폴더 문서검색</b><div>Google Drive 폴더 → Google Sheets → 스마트폰</div></header>
<main>
<div class="box"><div class="g"><div><b>Google Sheets 문서 목록</b><div style="font-size:12px;color:#64717d;margin-top:4px">지정된 Google Drive 폴더의 Google 스프레드시트를 자동으로 불러옵니다.</div></div><div></div><button onclick="loadFiles()">파일목록 새로고침</button></div></div>
<div class="box"><div class="g"><select id="f"><option value="all">전체 파일</option></select><input id="q" placeholder="내용 검색..." onkeydown="if(event.key==='Enter')searchFiles()"><button onclick="searchFiles()">검색</button></div><div id="stat">초기화 중...</div></div>
<div id="r"><div class="msg">파일 목록을 불러오는 중입니다.</div></div>
</main>
<script>
"use strict";
const APP_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwLMTYmfKnJek9KKvxkOZKLr2tHU4z-wtmy-SehGfB9bRBk0btnzFoU8KXZah7Fd2c8KA/exec";
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function get(params){
 const u=new URL(APP_SCRIPT_URL); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));
 const res=await fetch(u.toString(),{method:"GET",cache:"no-store",redirect:"follow"});
 if(!res.ok)throw new Error("HTTP "+res.status);
 const text=await res.text(); let j;
 try{j=JSON.parse(text)}catch(e){throw new Error("Apps Script 응답이 JSON이 아닙니다. 배포 및 접근권한을 확인하세요.")}
 if(!j.ok)throw new Error(j.error||"Apps Script 오류"); return j;
}
async function loadFiles(){
 $("stat").className="";$("stat").textContent="파일목록 불러오는 중...";
 try{
  const j=await get({action:"files"}), all=Array.isArray(j.files)?j.files:[], good=all.filter(x=>x.readable), bad=all.filter(x=>!x.readable);
  $("f").innerHTML='<option value="all">전체 파일</option>'+good.map(v=>`<option value="${esc(v.id)}">${esc(v.name)}</option>`).join("");
  $("stat").textContent=`조회가능 ${good.length}개${bad.length?" / Excel 원본 "+bad.length+"개(변환 필요)":""}`;
  $("r").innerHTML='<div class="msg">파일을 선택하거나 검색어를 입력하세요.</div>';
 }catch(e){showError(e)}
}
async function searchFiles(){
 $("stat").className="";$("stat").textContent="검색 중...";$("r").innerHTML='<div class="msg">검색 중...</div>';
 try{
  const q=$("q").value.trim(),j=await get({action:"search",id:$("f").value,q:q});
  $("stat").textContent=`검색 ${j.totalMatches}건 / ${j.fileMatches}개 파일`;render(j.results||[],q);
 }catch(e){showError(e)}
}
function hi(v,q){let s=esc(v);if(!q)return s;let z=q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return s.replace(new RegExp(z,"gi"),m=>"<mark>"+m+"</mark>")}
function render(a,q){if(!a.length){$("r").innerHTML='<div class="msg">검색 결과가 없습니다.</div>';return}
 $("r").innerHTML=a.map(f=>`<section class="file"><h3>${esc(f.name)} — ${f.matches}건</h3>${(f.tables||[]).map(t=>tbl(t,q)).join("")}</section>`).join("")}
function tbl(t,q){let rows=t.rows||[];if(!rows.length)return"";let h=rows[0],b=rows.slice(1);return `<h4>시트: ${esc(t.sheet)} — ${t.matches}건</h4><div class="wrap"><table><thead><tr>${h.map(x=>"<th>"+hi(x,q)+"</th>").join("")}</tr></thead><tbody>${b.map(row=>"<tr>"+h.map((_,i)=>"<td>"+hi(row[i]||"",q)+"</td>").join("")+"</tr>").join("")}</tbody></table></div>`}
function showError(e){console.error(e);$("stat").className="err";$("stat").textContent="오류: "+(e.message||e);$("r").innerHTML='<div class="msg err">'+esc(e.message||e)+'</div>'}
window.addEventListener("DOMContentLoaded",loadFiles);
</script></body></html>
