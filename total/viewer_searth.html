<!doctype html><html lang="ko"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Google Sheets 문서 검색</title><style>
    body{margin:0;background:#f3f6f9;font-family:Arial,sans-serif}
    header{background:#173e63;color:white;padding:18px}
    main{padding:12px;max-width:1500px;margin:auto}
    .box,.file{background:white;padding:12px;margin-bottom:10px;border-radius:10px}
    .g{display:grid;grid-template-columns:1fr 2fr 100px;gap:8px}
    input,select,button{padding:11px;width:100%;box-sizing:border-box;border:1px solid #ccd5df;border-radius:7px}
    button{background:#173e63;color:white}.wrap{overflow:auto;max-height:55vh}
    table{border-collapse:collapse;width:100%;min-width:800px}
    th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}
    th{position:sticky;top:0;background:#eaf0f6}
    mark{background:#fff09a}@media(max-width:700px){.g{grid-template-columns:1fr}}</style>
    </head>
    <body><header><b>폴더 문서검색</b><div>Google Drive 폴더 → Google Sheets → 스마트폰</div>
        </header>
        <main><div class="box"><div class="g"><div><b>Google Sheets 문서 목록</b>
            <div style="font-size:12px;color:#64717d;margin-top:4px">지정된 Google Drive 폴더의 Google 스프레드시트를 자동으로 불러옵니다.</div>
            </div><button onclick="files()">파일목록 새로고침</button></div></div><div class="box">
            <div class="g"><select id="f"><option value="all">전체 파일</option></select>
                <input id="q" placeholder="내용 검색..." onkeydown="if(event.key==='Enter')search()">
                <button onclick="search()">검색</button></div><div id="stat">대기</div></div>
            <div id="r">
            </div>
        </main>
        
        <script>// =========================================================
/* Apps Script 웹앱 주소 설정
   아래 따옴표 안에 배포 후 받은 /exec 주소 전체를 붙여넣으세요.
   예) https://script.google.com/macros/s/AKfycb.../exec
*/
const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKKCDuo9Fdind2Xankf9BkcEc8OMLtZoWK3SjcV1zs-Qxlhs7a9qdYiP8cLEQ5pQGaDA/exec";
// =========================================================

let $=x=>document.getElementById(x),api=()=>APP_SCRIPT_URL;async function get(p){let u=new URL(api());Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));let j=await(await fetch(u,{cache:"no-store"})).json();
                                                                                 if(!j.ok)throw Error(j.error);return j}
            async function files(){try{$("u").value=api();let j=await get({action:"files"}),g=j.files.filter(x=>x.readable),x=j.files.filter(x=>!x.readable);$("f").innerHTML='<option value="all">전체 파일</option>'+g.map(v=>`<option value="${v.id}">${v.name}</option>`)
                .join("");$("stat").textContent="조회가능 "+g.length+"개 / Excel 원본 "+x.length+"개(변환 필요)"}
                                   catch(e){$("stat").textContent=e.message}}async function search()
            {try{$("r").innerHTML="검색 중...";let q=$("q").value,j=await get({action:"search",id:$("f").value,q});$("stat").textContent="검색 "+j.totalMatches+"건 / "+j.fileMatches+"개 파일";
                render(j.results,q)}catch(e){$("r").textContent=e.message}}
            function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
            function hi(v,q){let s=esc(v);if(!q)return s;let z=q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
                             return s.replace(new RegExp(z,"gi"),m=>"<mark>"+m+"</mark>")}
            function render(a,q){$("r").innerHTML=a.length?a.map(f=>`<div class="file"><h3>${esc(f.name)} — ${f.matches}건</h3>${f.tables.map(t=>tbl(t,q)).join("")}</div>`).join(""):"검색 결과 없음"}
            function tbl(t,q){let h=t.rows[0],b=t.rows.slice(1);return `<h4>시트: ${esc(t.sheet)} — ${t.matches}건</h4><div class="wrap"><table><thead><tr>${h.map(x=>"<th>"+hi(x,q)+"</th>").join("")}</tr>
            </thead><tbody>${b.map(r=>"<tr>"+h.map((_,i)=>"<td>"+hi(r[i]||"",q)+"</td>").join("")+"</tr>").join("")}</tbody></table></div>`}window.onload=()=>{if(api()&&api().startsWith("https://"))files();
            else $("stat").textContent="index.html의 APP_SCRIPT_URL을 설정하세요."}</script></body></html>
